# SKU Forecasting System — Main Configuration v2.0

data:
  # MA-1 #519 (флип дефолта 2026-07-20, решение владельца): сетка каждого
  # SKU продлевается до глобальной max-даты нулями (is_dead_tail) — оценка
  # покрывает 100% товаро-дней окна; клиентские метрики честнее (и ниже),
  # преимущество над наивным — выше (−23.5% WMAPE, −13.9% order14 на каноне).
  extend_dead_tails: true
  date_col: date
  sku_col: sku
  target_col: sales
  optional_cols: [price, promo, stock]
  max_missing_ratio: 0.10
  min_rows: 30

features:
  # Daily lags. Includes long-term yearly/half-yearly references
  # (180/365) — critical for direct multi-step forecasts that need
  # to see "what happened a year ago this day" to learn seasonal
  # cycles. Lags wider than the dataset's history get auto-dropped
  # by feature engineering, so this list stays safe for short series.
  lags: [1, 2, 3, 7, 14, 21, 28, 60, 90, 180, 365]
  # Rolling stats over the same scale of windows. Each builds 4
  # features (mean/std/max/min). 180-day window captures the
  # half-yearly trend that helps with cross-season generalisation.
  rolling_windows: [7, 14, 28, 60, 90, 180]
  calendar: true
  price: true
  promo: true
  stock: true

  # Weather features (Open-Meteo, free API, no key required)
  weather:
    enabled: false               # set true to enable
    latitude: 55.75              # Moscow default
    longitude: 37.62
    cache_path: artifacts/weather_cache.parquet

  # Public holidays
  holidays:
    enabled: true
    country: RU                  # RU, US, DE, CN, etc.

  # Event-ramp windows (QH-7 #440): named continuous ramps for the events
  # that move RU retail (pre-NY build-up, dead January, Feb 23 / Mar 8 gift
  # windows, May 1). Default OFF — flips only on a measured bench verdict
  # (scripts/bench_wf_ab.py arms event_ramp_ny / event_ramp_full).
  event_ramp:
    enabled: false
    set: full                    # full | ny (NY ramp + dead January only)
    ny_window: 21                # days of pre-New-Year ramp
    gift_window: 10              # days of pre-Feb23/Mar8/May1 ramp

  # Russian-market external regressors (CNY/USD/EUR/BYN/KZT daily FX,
  # fetched from ЦБ РФ XML_dynamic endpoint and cached on disk).
  # Default OFF so existing client trainings don't shift underfoot;
  # client config can flip enabled=true to opt in. Frontend will expose
  # per-currency checkboxes — defaults are all-on inside this list.
  external_regressors_ru:
    enabled: false
    currencies: [CNY, USD, EUR, BYN, KZT]
    cache_dir: artifacts/regressors_ru
    cache_ttl_hours: 24

  # Cross-series market features (#229): lagged catalog totals + SKU share.
  # Default OFF (#380, 2026-07-11): the honest 3-fold walk-forward on the
  # real 1c dataset measured them at +5.05% WMAPE (WORSE), with horizon
  # step 1 degraded by +58% — the absolute-level totals track a
  # non-stationary catalog trend (-60% over the dataset) that does not
  # generalize forward. The original -7.32% came from the retired
  # single-window stand (see the measurement ledger). Per-client opt-in
  # stays (FX precedent, #94); normalized variants (share-only / momentum)
  # are the revival candidates - measure via scripts/bench_wf_ab.py first.
  market:
    enabled: false

model:
  type: mimo                     # "lgbm" (single-step) or "mimo" (direct multi-step)
  horizon: 14
  # QH-5 #422: per-band калибровка точечного прогноза (fold-clean probe на
  # внутреннем хвосте трейна). SHIP 2026-07-12 ОТОЗВАН 2026-07-15 (#458):
  # конверт #443 показал +9.47% WMAPE_g на нетронутом хвосте — факторы с
  # 14-дневного хвоста нестабильны по периодам при даун-тренде каталога.
  # Механизм остаётся default-OFF; включение — только через замер на
  # ДВУХ периодах. Квантили/conformal не калибруются в любом случае.
  band_calibration:
    enabled: false
    clip: [0.8, 1.25]
  # QH-9 #442: per-step калибровка горизонта (тот же fold-clean probe, что
  # band_calibration; факторы по band-скорректированному прогнозу). Default
  # OFF — bench-first: включение только по вердикту замера на 1c-live.
  step_calibration:
    enabled: false
    clip: [0.8, 1.25]
  # #384 SHIP: параметры гибрида (objective=hybrid у платных тарифов).
  # slow/mid band -> ансамбль, fast -> калиброванный MIMO/tweedie —
  # замер route_slowmid_ens: MASE −3.04% при нейтральном WMAPE_g.
  hybrid:
    route_bands: [0, 1]
    fast_objective: tweedie
  # Loss objective. Plan-tier defaults override this (Free→mse, Start/Business→tweedie).
  # Accepted values: mse | mae | huber | tweedie | poisson
  # Tweedie is recommended for retail demand: handles intermittent zeros
  # and right-skewed sales distributions natively. Same family Amazon
  # Forecast uses internally.
  objective: mse
  tweedie_variance_power: 1.5    # used only when objective=tweedie. (1, 2): closer to 1 = poisson-like, closer to 2 = gamma-like
  quantiles: [0.1, 0.5, 0.9]   # for interval forecasts
  # #308 newsvendor: service level τ for the ORDER-QUANTITY recommendation
  # (interpolated from the calibrated [p10,p90]). 0.5 = median; higher = fewer
  # stockouts / more holding. Optimal τ = Cu/(Cu+Co). Paid clients may override.
  service_level: 0.7
  # #151 CQR: p10/p90 are conformalized — quantile heads train on history
  # minus the last `conformal_cal_days`, whose held-out targets calibrate the
  # band to the nominal 1−alpha coverage (0.2 → 80%, matching [p10, p90]).
  conformal_enabled: true
  conformal_cal_days: 28
  conformal_alpha: 0.2
  # #219 Mondrian: corrections per (horizon-block × SKU volume band) instead of
  # per-head-global — fixes band-specific under-coverage (fast movers were ~0.70
  # vs 80% nominal). Fallback chain (block,band) → block → global → 0.
  conformal_mondrian: true
  # #152 A1: ensemble blend weights from a CLEAN holdout (temp children fit on
  # history-minus-window, weights on the unseen window; +K temp child fits of
  # training time, peak memory unchanged). false → legacy pseudo-holdout.
  blend_clean_holdout: true
  # #154 A3: Croston-SBA side child for intermittent/lumpy SKUs (Syntetos-
  # Boylan quadrants, ADI≥1.32 / CV²≥0.49). Joins the per-SKU blend only for
  # eligible SKUs via the same inverse-WMAPE weights; never in cold-start
  # defaults. Ensemble (paid) tiers only — the single-MIMO path is untouched.
  intermittent_croston: true
  croston_alpha: 0.1
  # #225 QW2-2: seasonal-naive (weekday profile, last 4 weeks) as a gated
  # ensemble child — a measured per-SKU floor: competes for blend weight only
  # where it wins the clean window; never in cold-start defaults.
  naive_child: true
  # #227 QW2-4: champion/challenger promotion gate — a challenger that fails
  # the fail-closed gate (must beat seasonal-naive AND not regress vs the
  # champion beyond gate_tolerance) is NOT saved; the champion keeps serving.
  # First model (no champion) always promotes, verdict persisted.
  promotion_gate: true
  gate_tolerance: 0.02
  # #228 QW2-B1: OOS demand censoring — target days with stock==0 are dropped
  # from training (zero sales there ≠ zero demand). No stock column → no-op.
  oos_censoring: true
  n_estimators: 500
  learning_rate: 0.05
  num_leaves: 64
  min_child_samples: 20
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 5
  random_state: 42               # L-A10: pin the RNG so training is reproducible (bagging/feature sub-sampling). Change to re-draw.
  early_stopping_rounds: 50


anomaly_detection:
  enabled: true
  contamination: 0.05
  iqr_factor: 3.0
  anomaly_weight: 0.1
  # MA-3 #521: не флажить SKU с вырожденным IQR (sparse) — иначе каждая
  # продажа intermittent-SKU получала вес 0.1 (аудит H2). false = легаси.
  sparse_iqr_guard: true

# B1 #319 — exponential recency sample-weights: 0.5 ** (age_days / half_life),
# anchored to the train cutoff, composed multiplicatively with anomaly weights.
# Default OFF until the honest 1c-live bench (scripts/bench_wf_ab.py) shows a
# real gain — measure-first discipline; см. журнал замеров. `floor` keeps old
# rows from starving short-history SKUs of effective sample size.
recency_decay:
  enabled: false
  half_life_days: 180
  floor: 0.05

hpo:
  enabled: false                 # set true to run Optuna HPO
  n_trials: 30
  timeout_sec: 600

validation:
  type: walk_forward
  n_splits: 3

metrics:
  - mase
  - wmape
  - smape

mlflow:
  tracking_uri: http://mlflow:5000
  experiment_name: sku-forecasting

api:
  host: 0.0.0.0
  port: 8000
  max_latency_ms: 200
  rate_limiting:
    enabled: true
    default_tier: pro
