# Monthly drill: pull the most recent encrypted dump from S3,
# decrypt it, restore into an ephemeral postgres container, run smoke
# queries. Fails loudly if anything along the chain breaks.
#
# A backup that's never been restored is a hope, not a backup. This
# drill turns the hope into a verified property — and surfaces format
# regressions (changed pg_dump options, encryption algorithm drift,
# missing migrations, etc.) before a real DR scenario.
#
# Required GitHub secrets (mirror values from Lockbox):
#   S3_BACKUP_BUCKET
#   S3_BACKUP_ENDPOINT_URL
#   S3_BACKUP_ACCESS_KEY_ID
#   S3_BACKUP_SECRET_ACCESS_KEY
#   BACKUP_PASSPHRASE

name: Backup Restore Drill

on:
  workflow_dispatch:
  schedule:
    # 03:15 UTC on the 1st of every month. Off-peak in all timezones.
    - cron: "15 3 1 * *"

jobs:
  drill:
    name: Restore latest dump + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30  # R5-M8 — pg_basebackup / restore drills take longer
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     drill
          POSTGRES_PASSWORD: drill
          POSTGRES_DB:       drill_restore
        options: >-
          --health-cmd "pg_isready -U drill"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      # Restore goes into the ephemeral service container above, NOT
      # into prod. Hardcoded localhost.
      PGHOST:     127.0.0.1
      PGPORT:     5432
      PGUSER:     drill
      PGPASSWORD: drill
      PGDATABASE: drill_restore
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install mc + postgresql-client + openssl
        run: |
          set -euo pipefail
          # MinIO client — same `mc` we use in backup.sh.
          curl -fsSL -o /usr/local/bin/mc \
              https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x /usr/local/bin/mc
          # postgresql-client for pg_restore + psql; openssl for AES decrypt.
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client openssl
          mc --version | head -1
          pg_restore --version
          openssl version

      - name: Find latest backup in S3
        env:
          S3_BACKUP_BUCKET:            ${{ secrets.S3_BACKUP_BUCKET }}
          S3_BACKUP_ENDPOINT_URL:      ${{ secrets.S3_BACKUP_ENDPOINT_URL }}
          S3_BACKUP_ACCESS_KEY_ID:     ${{ secrets.S3_BACKUP_ACCESS_KEY_ID }}
          S3_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.S3_BACKUP_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for v in S3_BACKUP_BUCKET S3_BACKUP_ENDPOINT_URL S3_BACKUP_ACCESS_KEY_ID S3_BACKUP_SECRET_ACCESS_KEY; do
              if [ -z "${!v:-}" ]; then
                  echo "ERROR: secret $v is not set in this repo." >&2
                  exit 2
              fi
          done
          mc alias set bak "$S3_BACKUP_ENDPOINT_URL" \
              "$S3_BACKUP_ACCESS_KEY_ID" "$S3_BACKUP_SECRET_ACCESS_KEY" >/dev/null
          # Recursively list YYYY-MM-DD/<name>.dump.enc, sort by lexically
          # (which equals chronologically because of the date prefix), pick last.
          LATEST=$(mc find "bak/$S3_BACKUP_BUCKET/backups/" --name '*.dump.enc' \
                   | sort | tail -1)
          if [ -z "$LATEST" ]; then
              echo "ERROR: no .dump.enc found under s3://$S3_BACKUP_BUCKET/backups/" >&2
              exit 3
          fi
          echo "latest=$LATEST"
          echo "BACKUP_REMOTE_PATH=$LATEST" >> $GITHUB_ENV

      - name: Download + decrypt
        env:
          S3_BACKUP_ENDPOINT_URL:      ${{ secrets.S3_BACKUP_ENDPOINT_URL }}
          S3_BACKUP_ACCESS_KEY_ID:     ${{ secrets.S3_BACKUP_ACCESS_KEY_ID }}
          S3_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.S3_BACKUP_SECRET_ACCESS_KEY }}
          BACKUP_PASSPHRASE:           ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          mc alias set bak "$S3_BACKUP_ENDPOINT_URL" \
              "$S3_BACKUP_ACCESS_KEY_ID" "$S3_BACKUP_SECRET_ACCESS_KEY" >/dev/null
          mkdir -p /tmp/drill
          mc cp "$BACKUP_REMOTE_PATH" /tmp/drill/backup.dump.enc
          ls -la /tmp/drill/backup.dump.enc

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -salt \
              -in  /tmp/drill/backup.dump.enc \
              -out /tmp/drill/backup.dump \
              -pass env:BACKUP_PASSPHRASE
          ls -la /tmp/drill/backup.dump

      - name: pg_restore into ephemeral postgres
        run: |
          set -euo pipefail
          # --clean --if-exists handles the case where service container's
          # initial template (created by POSTGRES_DB=drill_restore) has
          # default schema artifacts. --no-owner avoids requiring the
          # original `sku` role to exist in the drill instance.
          pg_restore --no-owner --no-privileges --verbose \
              --dbname="postgresql://drill:drill@127.0.0.1:5432/drill_restore" \
              /tmp/drill/backup.dump 2>&1 | tail -50

      - name: Smoke queries
        run: |
          set -euo pipefail
          echo "─── tables in restored DB ───"
          psql -tAc "
            SELECT schemaname || '.' || tablename
              FROM pg_tables
             WHERE schemaname NOT IN ('pg_catalog','information_schema')
             ORDER BY 1
          "

          # Critical-table presence check. List must stay in sync with
          # migrations/ — if a migration adds a new table that's also
          # backed up, append it here.
          for t in _db_migrations sku_clients sku_training_runs sku_forecasts sku_uploads sku_anomalies sku_otp_codes audit_log; do
              EXISTS=$(psql -tAc "SELECT 1 FROM pg_tables WHERE tablename = '$t'" || true)
              if [ "$EXISTS" != "1" ]; then
                  echo "MISSING table: $t" >&2
                  exit 4
              fi
              ROWS=$(psql -tAc "SELECT count(*) FROM $t")
              echo "  $t: $ROWS rows"
          done

      # ── R10 B2 (2026-05-29) — DATA-EQUIVALENCE assertions ────────────
      # Before this, the smoke step ECHOED row counts but asserted only
      # table PRESENCE — a restore that loaded the schema with ZERO data
      # rows would PASS the drill. "A backup that restored only the
      # schema is a hope, not a backup."
      #
      # These checks are SELF-CONTAINED (intrinsic properties of the
      # restored data) — deliberately NOT a row-count comparison against
      # the live primary. Comparing to prod would require prod DB
      # credentials in this CI job, a real security regression (any CI
      # run could then read prod). The intrinsic assertions below catch
      # the same failure modes (schema-only, empty, stale, truncated)
      # without that exposure.
      - name: Data-equivalence assertions (B2)
        run: |
          set -euo pipefail

          # 1) NON-EMPTY guarantee — tables that prod ALWAYS has rows in.
          #    (sku_anomalies / sku_forecasts / sku_otp_codes can be
          #    legitimately empty — no anomalies, no pending OTP — so we
          #    only hard-assert the always-populated ones.) Catches a
          #    schema-only / 0-row restore that the presence check misses.
          for t in _db_migrations sku_clients audit_log; do
              N=$(psql -tAc "SELECT count(*) FROM $t")
              if [ "$N" -lt 1 ]; then
                  echo "FAIL: $t restored with 0 rows — schema-only / empty dump?" >&2
                  exit 7
              fi
              echo "OK: $t has $N rows (>0)"
          done

          # 2) MIGRATION COMPLETENESS — dynamic floor from the repo's
          #    migrations/ at this commit (was a stale hardcoded `>=7`;
          #    repo is at 012+). The dump comes from prod, which may lag
          #    the repo by an undeployed migration or two during a deploy
          #    window — allow a grace of 2. Catches schema-only (0 << N-2)
          #    and very-stale dumps (far fewer migrations than expected).
          EXPECTED=$(ls migrations/*.sql 2>/dev/null | wc -l | tr -d ' ')
          GRACE=2
          FLOOR=$(( EXPECTED > GRACE ? EXPECTED - GRACE : 1 ))
          MIGRATIONS=$(psql -tAc "SELECT count(*) FROM _db_migrations")
          if [ "$MIGRATIONS" -lt "$FLOOR" ]; then
              echo "FAIL: _db_migrations has $MIGRATIONS (expected ≥ $FLOOR; repo has $EXPECTED migration files, grace $GRACE)" >&2
              exit 5
          fi
          echo "OK: $MIGRATIONS migration rows present (repo expects ~$EXPECTED)"

          # 3) DATA FRESHNESS — the newest audit_log event in the
          #    restored dump must be recent. audit_log gets continuous
          #    writes (logins, OAuth, plan changes) on a live SaaS, so a
          #    fresh daily dump's max(ts) is ~hours old. A 7-day window
          #    catches a STALE dump (cron stopped → drill restored a
          #    weeks-old dump) and a TRUNCATED dump (no recent rows),
          #    while tolerating a genuinely quiet stretch. The drill runs
          #    monthly against the LATEST dump, which in the healthy case
          #    is from that morning.
          STALE=$(psql -tAc "SELECT (max(ts) < NOW() - INTERVAL '7 days') FROM audit_log")
          NEWEST=$(psql -tAc "SELECT max(ts) FROM audit_log")
          if [ "$STALE" = "t" ]; then
              echo "FAIL: newest audit_log.ts in the restored dump is $NEWEST (>7d old) — stale or truncated backup" >&2
              exit 8
          fi
          echo "OK: newest audit_log.ts = $NEWEST (within 7d — dump captured recent data)"

          # 4) DUMP RECENCY (S3-side) — the latest dump object itself must
          #    be from the last ~2 days, else cron stopped firing. The
          #    date is in the S3 path: backups/YYYY-MM-DD/<file>.dump.enc.
          DUMP_DATE=$(printf '%s\n' "$BACKUP_REMOTE_PATH" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
          if [ -z "$DUMP_DATE" ]; then
              echo "FAIL: could not parse YYYY-MM-DD from BACKUP_REMOTE_PATH=$BACKUP_REMOTE_PATH" >&2
              exit 9
          fi
          AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$DUMP_DATE" +%s) ) / 86400 ))
          if [ "$AGE_DAYS" -gt 2 ]; then
              echo "FAIL: latest dump is $AGE_DAYS days old ($DUMP_DATE) — daily backup cron likely stopped" >&2
              exit 10
          fi
          echo "OK: latest dump date $DUMP_DATE is $AGE_DAYS day(s) old (≤2)"

          echo "═══ B2 data-equivalence: all assertions passed ═══"

      - name: Final report
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "  Backup-restore drill PASSED"
          echo "  source: $BACKUP_REMOTE_PATH"
          echo "═══════════════════════════════════════════════════════"
