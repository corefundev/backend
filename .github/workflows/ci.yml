name: CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

env:
  PYTHON_VERSION: "3.11"
  STORAGE_BACKEND: local
  ARTIFACTS_DIR: /tmp/artifacts
  APP_ENV: test
  JWT_SECRET_KEY: test-jwt-secret-key-for-ci-pipeline-32
  API_KEY: test-api-key-for-ci-pipeline-only-32chars

jobs:
  # ── 1. Lint ────────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install flake8
      - run: |
          # Style choice: this codebase column-aligns assignments,
          # function-arg defaults, and dataclass fields — flake8 flags
          # all of those as "multiple spaces" (E221/E251/E272). The
          # alignment is intentional; ignoring those rules preserves
          # the style.
          # E402: module-level import below other code (used for
          # vault_agent bootstrap that runs first).
          # E301/E302/E303/E305: blank-line count rules — visually
          # noisy, no semantic effect.
          # E731: lambda assignment — sometimes intentional for terse
          # callable factories.
          # E401: multiple imports on one line — minor.
          # E131/E127/E128: continuation-line indentation — complex
          # to satisfy, no semantic effect.
          # E261: comment-space — minor.
          # F541: f-string without placeholders — sometimes used for
          # uniform formatting in error templates.
          # F401 (unused imports) and F841 (unused vars) STAY enforced
          # — they catch real dead code.
          flake8 src/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503,E501,E221,E251,E272,E402,E301,E302,E303,E305,E306,E731,E401,E131,E127,E128,E261,E222,E225,E231,E741,F541 \
            --exclude=__pycache__,.venv

  # ── 2. Type check ──────────────────────────────────────────
  # Currently advisory (41 errors of legacy debt — OAuth provider
  # protocol types, chaos.py, etc.). Continue-on-error so the gate
  # surfaces type drift without blocking unrelated merges. Full
  # cleanup tracked separately under "enterprise hardening".
  typecheck:
    name: Type check (mypy, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install mypy types-PyYAML types-redis
      - run: mypy src/ --ignore-missing-imports --no-strict-optional --follow-imports=silent

  # ── 3. Unit tests ──────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          python -m pytest tests/unit/ tests/data/ \
            -v --tb=short \
            --junitxml=reports/unit-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: reports/unit-results.xml

  # ── 4. Integration tests ───────────────────────────────────
  # Postgres + Redis spin up as service containers so tests that
  # touch sku_clients / OTP / RQ have real backends. DATABASE_URL
  # and REDIS_URL point the runtime at them.
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sku
          POSTGRES_PASSWORD: sku
          POSTGRES_DB:   sku_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sku"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sku:sku@localhost:5432/sku_test
      REDIS_URL:    redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: PYTHONPATH=. python scripts/migrate.py
      - run: |
          python -m pytest tests/integration/ \
            -v --tb=short \
            --junitxml=reports/integration-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: reports/integration-results.xml

  # ── 5. Chaos tests ─────────────────────────────────────────
  chaos-tests:
    name: Chaos engineering
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run chaos suite
        run: |
          python -c "
          import os
          os.environ['APP_ENV'] = 'test'
          os.environ['JWT_SECRET_KEY'] = 'test-jwt-secret-key-for-ci-pipeline-32'
          os.environ['API_KEY'] = 'test-api-key-for-ci-pipeline-only-32chars'
          os.environ['STORAGE_BACKEND'] = 'local'
          os.environ['ARTIFACTS_DIR'] = '/tmp/artifacts'
          from src.monitoring.chaos import run_standard_chaos_suite
          results = run_standard_chaos_suite()
          failed = [r for r in results if not r.passed]
          if failed:
              print(f'FAILED: {[r.experiment for r in failed]}')
              exit(1)
          print(f'All {len(results)} chaos experiments passed')
          "

  # ── 6. Build Docker ────────────────────────────────────────
  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: sku-forecasting-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          load: true
          tags: sku-forecasting-worker:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Sandbox image (Phase 2 — upload parser)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.sandbox
          push: false
          load: true
          tags: sku-forecasting-sandbox:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 7. Vulnerability scan (Trivy) ─────────────────────────
  # HIGH and CRITICAL findings fail the build. Medium findings are
  # reported to the SARIF tab but don't block merges.
  image-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: [build-docker]
    permissions:
      # Setting any explicit permissions disables the default bundle —
      # actions/checkout then can't fetch the repo. Re-grant `contents:
      # read` so checkout works alongside the SARIF upload's
      # security-events scope.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: sku-forecasting-api:scan
          cache-from: type=gha
      - name: Install Trivy
        # Wrapper actions (aquasecurity/trivy-action) keep retracting
        # versions; the upstream binary is more stable. Pin to a
        # current release; bump intentionally.
        run: |
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v0.55.2/trivy_0.55.2_Linux-64bit.deb" -o trivy.deb
          sudo dpkg -i trivy.deb
          trivy --version
      - name: Run Trivy on API image
        run: |
          trivy image \
            --format sarif --output trivy-api.sarif \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            sku-forecasting-api:scan
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-api.sarif') != ''
        with:
          sarif_file: trivy-api.sarif
