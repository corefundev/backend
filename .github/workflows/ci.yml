name: CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

env:
  PYTHON_VERSION: "3.11"
  STORAGE_BACKEND: local
  ARTIFACTS_DIR: /tmp/artifacts
  APP_ENV: test
  JWT_SECRET_KEY: test-jwt-secret-key-for-ci-pipeline-32
  API_KEY: test-api-key-for-ci-pipeline-only-32chars

jobs:
  # ── 1. Lint ────────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install flake8
      - run: |
          flake8 src/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503,E501 \
            --exclude=__pycache__,.venv

  # ── 2. Type check ──────────────────────────────────────────
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install mypy types-PyYAML types-redis
      - run: mypy src/ --ignore-missing-imports --no-strict-optional --follow-imports=silent

  # ── 3. Unit tests ──────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          python -m pytest tests/unit/ tests/data/ \
            -v --tb=short \
            --junitxml=reports/unit-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: reports/unit-results.xml

  # ── 4. Integration tests ───────────────────────────────────
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          python -m pytest tests/integration/ \
            -v --tb=short \
            --junitxml=reports/integration-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: reports/integration-results.xml

  # ── 5. Chaos tests ─────────────────────────────────────────
  chaos-tests:
    name: Chaos engineering
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run chaos suite
        run: |
          python -c "
          import os
          os.environ['APP_ENV'] = 'test'
          os.environ['JWT_SECRET_KEY'] = 'test-jwt-secret-key-for-ci-pipeline-32'
          os.environ['API_KEY'] = 'test-api-key-for-ci-pipeline-only-32chars'
          os.environ['STORAGE_BACKEND'] = 'local'
          os.environ['ARTIFACTS_DIR'] = '/tmp/artifacts'
          from src.monitoring.chaos import run_standard_chaos_suite
          results = run_standard_chaos_suite()
          failed = [r for r in results if not r.passed]
          if failed:
              print(f'FAILED: {[r.experiment for r in failed]}')
              exit(1)
          print(f'All {len(results)} chaos experiments passed')
          "

  # ── 6. Build Docker ────────────────────────────────────────
  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: sku-forecasting-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          load: true
          tags: sku-forecasting-worker:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Sandbox image (Phase 2 — upload parser)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.sandbox
          push: false
          load: true
          tags: sku-forecasting-sandbox:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 7. Vulnerability scan (Trivy) ─────────────────────────
  # HIGH and CRITICAL findings fail the build. Medium findings are
  # reported to the SARIF tab but don't block merges.
  image-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: [build-docker]
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: sku-forecasting-api:scan
          cache-from: type=gha
      - name: Run Trivy on API image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: sku-forecasting-api:scan
          format: sarif
          output: trivy-api.sarif
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-api.sarif
