name: CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

env:
  PYTHON_VERSION: "3.11"
  STORAGE_BACKEND: local
  ARTIFACTS_DIR: /tmp/artifacts
  APP_ENV: test
  JWT_SECRET_KEY: test-jwt-secret-key-for-ci-pipeline-32
  API_KEY: test-api-key-for-ci-pipeline-only-32chars

jobs:
  # ── 1. Lint ────────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # R5-M8 — bound per-job to 30min
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install flake8
      # Профиль линта — ЕДИНЫЙ источник в tools/ci/flake8.sh (его же
      # гоняем локально перед пушем; дрейф двух копий уже бил CI — #589)
      - run: bash tools/ci/flake8.sh

  # ── 1b. Lint (NFOR — no-fail-open-return) ────────────────
  # Custom AST linter that detects the exception-swallow → fail-open
  # pattern that was R8-12's root cause (MLflow exception logged as
  # WARNING and function returned a non-error value, leaving
  # `mlflow_run_id = NULL` invisibly in the DB).
  #
  # Pre-existing call sites are catalogued in the baseline file; new
  # violations fail CI. Removing baseline entries is the target state
  # — R9-B item #14 starts that work.
  lint-nfor:
    name: Lint (no-fail-open-return)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run NFOR linter against src/
        run: |
          python tools/lint/no_fail_open_return.py src/ \
            --baseline tools/lint/.no_fail_open_return.baseline
      - name: Run NFOR unit tests
        run: |
          # `pydantic` is needed not for the tests themselves but for
          # pytest to satisfy the project-wide `filterwarnings = [
          # "ignore::pydantic.warnings.PydanticDeprecatedSince20", … ]`
          # in pyproject.toml — without it, pytest emits a noisy
          # `Failed to import filter module 'pydantic'` warning per
          # test (~25 lines of log spam per job). Tests pass either
          # way; this is purely log-cleanliness.
          # pyyaml: the full lint suite parses compose/alert YAML
          pip install pytest pydantic pyyaml
          # AUD-1 (#353): run the WHOLE lint suite, not one file. Naming
          # each lint test individually let test_grafana_lockbox_aware.py rot
          # unnoticed — it asserted the pre-#303 file-mount path and had been
          # failing (uncollected) on main. A directory run cannot silently rot.
          python -m pytest tests/lint/ -v

  # ── 1c. Lint (COMPOSE_PWD_INTERP — Phase 0-C PR-1) ─────────
  # Forbids ${POSTGRES_PASSWORD} interpolation inside docker-compose
  # `command:` / `entrypoint:` blocks. Triggered the R8-12 v1 SASL
  # trap 2026-05-25 (mlflow command had postgresql://sku:${POSTGRES_
  # PASSWORD}@…, which compose substituted from .env's seed `sku`,
  # auth-failed at startup). Reference fix: scripts/mlflow_entrypoint.sh
  # builds the DSN at runtime from the Lockbox-injected value. Same
  # NFOR-style baseline mechanism — entries require a written reason.
  lint-compose-pwd-interpolation:
    name: Lint (compose ${POSTGRES_PASSWORD} interpolation)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run COMPOSE_PWD_INTERP linter against docker/
        run: |
          python tools/lint/compose_pwd_interpolation.py docker/ \
            --baseline tools/lint/.compose_pwd_interpolation.baseline
      - name: Run COMPOSE_PWD_INTERP unit tests
        run: |
          # See NFOR job above for why `pydantic` is installed here —
          # pyproject.toml's `filterwarnings = ignore::pydantic.*`
          # entry would otherwise log-spam per-test.
          pip install pytest pydantic
          python -m pytest tests/lint/test_compose_pwd_interpolation.py -v

  # ── 1d. Lint (placeholder constant consistency — Phase 0-C PR-3) ─
  # Asserts the structural placeholder
  # `_LOCKBOX_NOT_INJECTED_DO_NOT_USE_PG_PASSWORD` appears verbatim in
  # every file that documents or enforces it (.env.example,
  # docker-compose.yml, mlflow_entrypoint.sh, cd_deploy.sh, integration
  # test). Drift between those files would leave operators with stale
  # docs OR runtime checks looking for the wrong literal. Pure static
  # check (~10 ms). Also enforces that the legacy `sku` value is no
  # longer documented as the active placeholder in non-comment context.
  lint-placeholder-consistency:
    name: Lint (placeholder constant consistency)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run placeholder-consistency tests
        run: |
          pip install pytest pydantic
          python -m pytest tests/lint/test_placeholder_constant_consistency.py -v

  # ── 1d2. Lint (settings-field-usage — C1.4 / #174) ──────────────
  # Guards src/settings.py against the blind spot that let ~95 dead
  # pydantic fields accumulate before C1.1 (#171): flake8/vulture can't
  # see an unread Settings field (the metaclass "uses" every field via
  # introspection). SFU001 fails on a field with no `settings.<field>`
  # reader; SFU002 fails on a direct `os.environ.get("FIELD")` that
  # shadows a settings field (the divergent-default class — login_lockout
  # was settings=5 vs os.environ=10). AST-based, not substring, so
  # docstring examples don't false-match. ~10 ms static check.
  lint-settings-field-usage:
    name: Lint (settings-field-usage)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run SFU linter against src/
        run: |
          python tools/lint/settings_field_usage.py src/ \
            --settings-file src/settings.py \
            --allow tools/lint/.settings_field_usage.allow
      - name: Run SFU unit tests
        run: |
          # See NFOR job above for why `pydantic` is installed here.
          pip install pytest pydantic
          python -m pytest tests/lint/test_settings_field_usage.py -v

  # ── 1e. Alert acceptance (promtool test rules — R10 G1) ─────────
  # Behavioural coverage of docker/prometheus/alerts*.yml: feeds
  # synthetic time-series via `promtool test rules` and asserts which
  # alerts fire at each eval_time. This catches the class of bug the
  # static unit tests (tests/unit/test_*alerts*.py) CANNOT — they
  # assert YAML-string presence, not firing behaviour. Three reactive
  # finds proved the gap (R5-12/R5-13 phantom-metric silent alerts,
  # R10 A1-A3, and the PR #38 absent()-storm whose unit test ASSERTED
  # the buggy `absent()`). promtool's synthetic-series tests would
  # have caught all of them at PR time. See
  # tests/prometheus/alerts_acceptance_test.yml.
  alert-acceptance:
    name: Alert acceptance (promtool)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Pin to the same prometheus version as the prod image
      # (docker/Dockerfile.prometheus) so the rule-eval semantics
      # under test match production exactly.
      PROM_VERSION: "2.55.1"
      # SHA256 of prometheus-2.55.1.linux-amd64.tar.gz from the
      # upstream release `sha256sums.txt`. Pinned per the repo's
      # supply-chain discipline (R3 Phase 9 digest pins) — a
      # MITM'd / swapped tarball fails the checksum and the job
      # aborts before executing downloaded code. Bump together with
      # PROM_VERSION when the prod prometheus image is upgraded.
      PROM_SHA256: "19700bdd42ec31ee162e4079ebda4cd0a44432df4daa637141bdbea4b1cd8927"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install promtool ${{ env.PROM_VERSION }} (SHA256-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          echo "${PROM_SHA256}  /tmp/prom.tar.gz" | sha256sum -c -
          tar xzf /tmp/prom.tar.gz -C /tmp
          sudo install "/tmp/prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version | head -1
      - name: Validate alert rule files parse
        run: |
          promtool check rules \
            docker/prometheus/alerts.yml \
            docker/prometheus/alerts.production.yml
      - name: Run alert acceptance tests
        run: |
          promtool test rules tests/prometheus/alerts_acceptance_test.yml
      - name: Coverage gate — every alert must have a behavioural test
        run: |
          pip install pytest pyyaml
          python -m pytest tests/lint/test_alert_test_coverage.py -v

  # ── 2. Type check ──────────────────────────────────────────
  # Mypy is now a hard gate — the legacy 41-error backlog was cleared
  # in the type-cleanup commit (OAuth provider Protocols, chaos.py
  # __exit__ Literal[False], train.py val_factory Union, etc).
  # Re-introducing a type error in a PR fails CI.
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # R5-M8 — bound per-job to 30min
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # pandas-stubs (QW2-B6 #233): without it --ignore-missing-imports
      # silently degrades every pandas type to Any, hiding real arg-type
      # errors (10 latent ExtensionArray-vs-ndarray errors were invisible
      # in CI while local runs with stubs installed flagged them).
      # Pinned to the stubs release matching the runtime pin in
      # requirements.txt (pandas==2.2.2) so a stubs upgrade can't flip
      # this job red independently of a pandas bump — move both together.
      - run: pip install mypy types-PyYAML types-redis pandas-stubs==2.2.2.240807
      - run: mypy src/ --ignore-missing-imports --no-strict-optional --follow-imports=silent

  # ── 3. Unit tests ──────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30  # R5-M8 — bound per-job to 30min
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: |
          python -m pytest tests/unit/ tests/data/ \
            -v --tb=short \
            --junitxml=reports/unit-results.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-test-results
          path: reports/unit-results.xml

  # ── 4. Integration tests ───────────────────────────────────
  # Postgres + Redis spin up as service containers so tests that
  # touch sku_clients / OTP / RQ have real backends. DATABASE_URL
  # and REDIS_URL point the runtime at them.
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30  # R5-M8 — bound per-job to 30min
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sku
          POSTGRES_PASSWORD: sku
          POSTGRES_DB:   sku_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sku"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sku:sku@localhost:5432/sku_test
      REDIS_URL:    redis://localhost:6379/0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations
        run: PYTHONPATH=. python scripts/migrate.py
      - run: |
          python -m pytest tests/integration/ \
            -v --tb=short \
            --junitxml=reports/integration-results.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-test-results
          path: reports/integration-results.xml

  # ── 5. Chaos tests ─────────────────────────────────────────
  chaos-tests:
    name: Chaos engineering
    runs-on: ubuntu-latest
    timeout-minutes: 30  # R5-M8 — bound per-job to 30min
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run chaos suite
        run: |
          python -c "
          import os
          os.environ['APP_ENV'] = 'test'
          os.environ['JWT_SECRET_KEY'] = 'test-jwt-secret-key-for-ci-pipeline-32'
          os.environ['API_KEY'] = 'test-api-key-for-ci-pipeline-only-32chars'
          os.environ['STORAGE_BACKEND'] = 'local'
          os.environ['ARTIFACTS_DIR'] = '/tmp/artifacts'
          from src.monitoring.chaos import run_standard_chaos_suite
          results = run_standard_chaos_suite()
          failed = [r for r in results if not r.passed]
          if failed:
              print(f'FAILED: {[r.experiment for r in failed]}')
              exit(1)
          print(f'All {len(results)} chaos experiments passed')
          "

  # ── 6. Build Docker ────────────────────────────────────────
  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30  # R5-M8 — bound per-job to 30min
    needs: [lint, unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-buildx-retry   # R11-#83 — bounded retry
      - name: Build API image
        uses: ./.github/actions/build-image-retry    # R11-#83 — bounded retry
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: sku-forecasting-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Worker image
        uses: ./.github/actions/build-image-retry    # R11-#83 — bounded retry
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          load: true
          tags: sku-forecasting-worker:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Sandbox image (Phase 2 — upload parser)
        uses: ./.github/actions/build-image-retry    # R11-#83 — bounded retry
        with:
          context: .
          file: docker/Dockerfile.sandbox
          push: false
          load: true
          tags: sku-forecasting-sandbox:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 7. Vulnerability scan (Trivy) ─────────────────────────
  # HIGH and CRITICAL findings fail the build. Medium findings are
  # reported to the SARIF tab but don't block merges.
  #
  # R4-19 — scan all THREE shipped images (api + worker + sandbox)
  # via matrix strategy, not just api. The worker (RQ + ML training
  # deps) and sandbox (untrusted CSV/XLSX parser) carry different
  # base layers and dependency graphs; api-only scanning silently
  # missed CVEs in the other two. fail-fast: false so a HIGH in one
  # image doesn't hide findings in the others.
  image-scan:
    name: Trivy ${{ matrix.image.name }} scan
    runs-on: ubuntu-latest
    timeout-minutes: 30  # R5-M8 — bound per-job to 30min
    needs: [build-docker]
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            dockerfile: docker/Dockerfile
          - name: worker
            dockerfile: docker/Dockerfile.worker
          - name: sandbox
            dockerfile: docker/Dockerfile.sandbox
    permissions:
      # Setting any explicit permissions disables the default bundle —
      # actions/checkout then can't fetch the repo. Re-grant `contents:
      # read` so checkout works alongside the SARIF upload's
      # security-events scope.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-buildx-retry   # R11-#83 — bounded retry
      - name: Build ${{ matrix.image.name }} image for scanning
        uses: ./.github/actions/build-image-retry    # R11-#83 — bounded retry
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: false
          load: true
          tags: sku-forecasting-${{ matrix.image.name }}:scan
          cache-from: type=gha
      - name: Install Trivy
        # Wrapper actions (aquasecurity/trivy-action) keep retracting
        # versions; the upstream binary is more stable. Pin to a
        # current release; bump intentionally.
        env:
          TRIVY_VERSION: 0.70.0
        run: |
          # R11-#83 — curl retries transient download failures itself;
          # then pre-pull the vulnerability DB with a bounded retry so
          # GHCR propagation lag can't fail the scan steps below.
          curl -fsSL --retry 4 --retry-all-errors -o trivy.deb \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          sudo dpkg -i trivy.deb
          trivy --version
          for attempt in 1 2 3; do
              trivy image --download-db-only && break
              if [ "$attempt" = 3 ]; then
                  echo "::error::trivy DB download failed after 3 attempts"
                  exit 1
              fi
              echo "::warning::trivy DB download attempt $attempt failed — retrying in 30s"
              sleep 30
          done
      # First pass: print findings to stdout so the CI log shows them.
      # Second pass: emit SARIF for the GitHub Security tab. Same image
      # is hit twice but Trivy caches the vuln-DB so it's quick.
      - name: Trivy scan (human-readable summary)
        run: |
          trivy image \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            sku-forecasting-${{ matrix.image.name }}:scan
      - name: Trivy scan (SARIF for code-scanning)
        run: |
          trivy image \
            --format sarif --output trivy-${{ matrix.image.name }}.sarif \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            sku-forecasting-${{ matrix.image.name }}:scan
      # SARIF upload writes to GitHub's code-scanning tab. That feature
      # is gated by GitHub Advanced Security on private repos — and
      # we're a private repo without GHAS, so the upload returns
      # "Resource not accessible by integration". Make it best-effort:
      # the trivy *scan* itself is the gate; the SARIF upload is just
      # nicer formatting in a tab we don't actually use today.
      #
      # `category` distinguishes per-image SARIF in the security tab so
      # findings don't collapse across api/worker/sandbox.
      - uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.image.name)) != ''
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: trivy-${{ matrix.image.name }}

  # ── 6. Software Composition Analysis ─────────────────────────────
  # pip-audit pass over requirements.txt, in addition to the trivy
  # image scan above. Trivy catches OS-level + base-image CVEs;
  # pip-audit catches application-dep CVEs at the manifest level,
  # which is useful BEFORE we build the image (faster signal) and
  # surfaces findings for pinned versions even when trivy says
  # "unfixed".
  #
  # Audit R3-22 (2026-05-16) — promoted from advisory to hard gate.
  # Baseline established over the R2-14 advisory window (2026-05-15→
  # 2026-05-16); all subsequent runs were clean. New CVEs now fail
  # CI loudly so they can't slip into a deploy unseen.
  # To allowlist a known-acceptable CVE temporarily, add
  #   --ignore-vuln <id>
  # to the pip-audit invocation below with a comment linking to the
  # tracking task.
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30  # R5-M8 — bound per-job to 30min
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - name: pip-audit on requirements.txt
        run: |
          pip-audit --desc --requirement requirements.txt \
                    --format columns \
                    --vulnerability-service osv \
            | tee pip-audit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit.txt
