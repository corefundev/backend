# Hot-reload Prometheus config + ensure adjacent monitoring services
# (alerts.yml rules, ssl-exporter for TLS-cert probing) are in
# sync with the repo.
#
# Trigger: workflow_dispatch — bumping monitoring config is infrequent
# and shouldn't auto-fire on every push.
#
# Files synced (all bind-mounted into containers from /srv/backend/docker/):
#   - prometheus.yml   → prometheus container, hot-reload via /-/reload
#   - alerts.yml       → prometheus container, picked up by hot-reload
#   - ssl-exporter.yml     → ssl-exporter, picked up on container restart
#   - docker-compose.yml → ensures ssl-exporter is defined
#
# Then `docker compose up -d --no-deps prometheus ssl-exporter`
# brings up any missing service + restarts blackbox so it re-reads its
# config. Prometheus reload happens last so the new scrape jobs land
# after the targets they probe are up.

name: Update Monitoring Config (Primary)

on:
  workflow_dispatch:

jobs:
  update-config:
    name: Push prometheus.yml + hot-reload
    runs-on: ubuntu-latest
    timeout-minutes: 15  # R5-M8 — bound stuck SSH / psql to 15min, not GH default 6h
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup SSH
        env:
          SSH_KEY:         ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY"         > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ConnectTimeout 10
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Push monitoring config files + reload
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # Sync the four files the prometheus + blackbox containers
          # care about. Bind-mounts in /srv/backend/docker/ pick them up
          # at next read (prometheus reload, blackbox restart).
          scp -q \
              docker/prometheus.yml \
              docker/alerts.yml \
              docker/ssl-exporter.yml \
              docker/docker-compose.yml \
              "${VPS_USER}@${VPS_HOST}:/srv/backend/docker/"

          ssh -q "${VPS_USER}@${VPS_HOST}" bash -s <<'EOF'
          set -e
          cd /srv/backend
          COMPOSE_ARGS="--env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml -f docker/docker-compose.minimal.yml -f docker/docker-compose.lockbox.yml -f docker/docker-compose.replication.yml"

          # Stop + remove the obsolete blackbox-exporter (replaced by
          # ssl-exporter — its YAML byte-encoding broke the postgres
          # SSLRequest handshake). Idempotent: -f tolerates missing.
          docker rm -f docker-blackbox-exporter-1 2>/dev/null || true

          # Bring up ssl-exporter (new service in this update) and
          # restart it if already running so it re-reads ssl-exporter.yml.
          docker compose $COMPOSE_ARGS up -d ssl-exporter
          docker compose $COMPOSE_ARGS restart ssl-exporter

          PROM=$(docker ps --filter ancestor=prom/prometheus:v2.51.2 --format '{{.ID}}' | head -1)
          if [ -z "$PROM" ]; then
              echo "ERROR: prometheus container not running" >&2
              exit 1
          fi

          # Reload first — verbose dumps come after so a truncated log
          # still shows the answer.
          docker exec "$PROM" wget -qO- --post-data= \
              http://localhost:9090/-/reload >/dev/null 2>&1 \
              && echo "RELOAD: ok" \
              || { echo "RELOAD: FAILED"; exit 1; }
          sleep 18  # one scrape interval + margin

          # === HEADLINE ANSWER (top of log) ============================
          # Verification block — failures shouldn't fail the whole
          # workflow (the deploy itself succeeded). Each query gets a
          # `|| echo "(no data yet)"` fallback for fresh-scrape windows.
          set +e
          echo "════════════════════════════════════════════════════════"
          echo "ACTIVE JOBS:"
          docker exec "$PROM" wget -qO- http://localhost:9090/api/v1/targets \
              | grep -oE '"job":"[^"]+","[^"]+"|"job":"[^"]+"' | sort -u | head -20

          echo "REPLICA TARGET HEALTH:"
          docker exec "$PROM" wget -qO- \
              'http://localhost:9090/api/v1/targets?scrapePool=postgres-replica' \
              | grep -oE '"health":"[^"]+"|"lastError":"[^"]*"|"scrapeUrl":"[^"]+"'

          echo "REPLICA METRIC pg_replication_is_replica:"
          docker exec "$PROM" wget -qO- \
              'http://localhost:9090/api/v1/query?query=pg_replication_is_replica' \
              | grep -oE '"value":\[[^]]+\]|"replica":"[^"]+"|"host":"[^"]+"'

          # ssl-exporter's scrape interval is 1m — wait so the first
          # probe has landed before we query for cert expiry.
          echo "(waiting 65s for ssl-exporter first scrape …)"
          sleep 65
          echo "SSL TLS PROBE STATUS (1=ok):"
          docker exec "$PROM" wget -qO- \
              'http://localhost:9090/api/v1/query?query=ssl_probe_success{job="ssl-pg-tls"}' \
              | grep -oE '"value":\[[^]]+\]|"instance":"[^"]+"' \
              || echo "(no ssl_probe_success result — ssl-exporter may not have scraped yet)"
          echo "SSL TLS CERT EXPIRY (days remaining):"
          docker exec "$PROM" wget -qO- \
              'http://localhost:9090/api/v1/query?query=(ssl_cert_not_after{job="ssl-pg-tls"}-time())/86400' \
              | grep -oE '"value":\[[^]]+\]|"instance":"[^"]+"' \
              || echo "(no cert-expiry result — check ssl-exporter container logs)"

          # ssl-exporter has no debug-trace endpoint like blackbox, but
          # its container logs surface probe failures with timestamps.
          SSL=$(docker ps --filter ancestor=ribbybibby/ssl-exporter:2.4.3 --format '{{.ID}}' | head -1)
          if [ -n "$SSL" ]; then
              echo "--- ssl-exporter direct probe (postgres:5432) ---"
              docker exec "$SSL" wget -qO- \
                  'http://localhost:9219/probe?module=postgres&target=postgres:5432' \
                  | grep -E '^ssl_(probe_success|cert_not_after|cert_not_before)' | head -10
              echo "--- ssl-exporter container logs (last 30) ---"
              docker logs --tail=30 "$SSL" 2>&1
          fi
          echo "════════════════════════════════════════════════════════"

          set -e
          echo "--- on-disk prometheus.yml ---"
          tail -25 /srv/backend/docker/prometheus.yml
          EOF
