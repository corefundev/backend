# Hot-reload Prometheus config on the primary VPS.
#
# Trigger: workflow_dispatch — bumping prometheus.yml's scrape jobs is
# infrequent and shouldn't auto-fire on every push.
#
# Mechanism: scp the current docker/prometheus.yml to
# /srv/backend/docker/prometheus.yml (bind-mounted into the container),
# then POST /-/reload via curl from inside the container. Prometheus
# starts with --web.enable-lifecycle, so reload is supported.
#
# The reload is no-restart, no-downtime, no-state-loss.

name: Update Prometheus Config (Primary)

on:
  workflow_dispatch:

jobs:
  update-config:
    name: Push prometheus.yml + hot-reload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup SSH
        env:
          SSH_KEY:         ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY"         > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ConnectTimeout 10
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Push prometheus.yml + reload
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # Repo's docker/prometheus.yml → /srv/backend/docker/prometheus.yml
          # (the path the bind-mount in docker-compose.yml points at).
          scp -q docker/prometheus.yml \
              "${VPS_USER}@${VPS_HOST}:/srv/backend/docker/prometheus.yml"

          ssh -q "${VPS_USER}@${VPS_HOST}" bash -s <<'EOF'
          set -e
          PROM=$(docker ps --filter ancestor=prom/prometheus:v2.51.2 --format '{{.ID}}' | head -1)
          if [ -z "$PROM" ]; then
              echo "ERROR: prometheus container not running" >&2
              exit 1
          fi
          echo "prometheus container: $PROM"

          echo "--- on-disk prometheus.yml (host) ---"
          tail -25 /srv/backend/docker/prometheus.yml

          echo "--- prometheus.yml AS SEEN BY CONTAINER ---"
          docker exec "$PROM" tail -25 /etc/prometheus/prometheus.yml

          echo "--- reload ---"
          # BusyBox wget's --post-data= sends an empty POST body, which
          # is what /-/reload expects. Capture both response body and
          # transport status. A non-2xx response prints to stderr but
          # wget still exits 0 for protocol errors → check by polling
          # /api/v1/status/runtimeinfo afterwards.
          RESP=$(docker exec "$PROM" wget -qSO- --post-data= \
              http://localhost:9090/-/reload 2>&1) || {
              echo "RELOAD FAILED:"; echo "$RESP"; exit 1
          }
          echo "reload returned: $RESP"

          sleep 2
          echo "--- prometheus's loaded config (scrape jobs only) ---"
          docker exec "$PROM" wget -qO- http://localhost:9090/api/v1/status/config \
              | head -c 6000
          echo
          echo "--- active jobs ---"
          docker exec "$PROM" wget -qO- http://localhost:9090/api/v1/targets \
              | grep -oE '"job":"[^"]+"' | sort -u
          EOF
