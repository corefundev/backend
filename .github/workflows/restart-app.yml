# Force-refresh app containers' env from Lockbox.
#
# Use case: any time a secret in YC Lockbox is changed (rotation,
# new entry like DATABASE_URL_REPLICA, etc.). bootstrap_secrets()
# reads Lockbox at process start, so a `docker compose restart`
# picks up the new value.
#
# Doesn't touch postgres / redis / clamav / nginx / monitoring —
# only the services that actually re-read Lockbox at startup
# (api, worker, scan-worker, process-worker).
#
# Triggered manually only.

name: Restart App (refresh Lockbox env)

on:
  workflow_dispatch:

jobs:
  restart:
    name: docker compose restart api + workers
    runs-on: ubuntu-latest
    timeout-minutes: 15  # R5-M8 — bound stuck SSH / psql to 15min, not GH default 6h
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup SSH
        env:
          SSH_KEY:         ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY"         > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ConnectTimeout 10
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Restart app services + verify env
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -q "${VPS_USER}@${VPS_HOST}" bash -s <<'EOF'
          set -e
          cd /srv/backend
          COMPOSE_ARGS="--env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml -f docker/docker-compose.minimal.yml -f docker/docker-compose.lockbox.yml -f docker/docker-compose.replication.yml"
          docker compose $COMPOSE_ARGS restart api worker scan-worker process-worker

          # Wait for /readyz so the next step's check is meaningful.
          for i in $(seq 1 30); do
              if curl -fsS http://localhost:8000/readyz >/dev/null 2>&1; then
                  echo "api ready after ${i}s"
                  break
              fi
              sleep 1
          done

          # Diagnose any future "primary can't reach replica" timeouts —
          # show our actual outbound IP (NAT'd by Beget might differ from
          # the public-facing IP in DNS).
          echo "--- primary outbound IP (as seen by external services) ---"
          curl -fsS --max-time 5 https://api.ipify.org || curl -fsS --max-time 5 https://ifconfig.me || echo "(probe failed)"
          echo
          echo "--- direct probe primary→replica:5432 (via host network) ---"
          timeout 5 bash -c 'echo > /dev/tcp/db-replica.testcore.ru/5432 && echo OK || echo FAILED' \
              || echo "(connect failed/timed out)"

          # Verify Lockbox-injected vars by running bootstrap_secrets()
          # in a fresh Python process inside the container. `docker exec
          # sh -c 'echo $VAR'` would only see compose-set env (Lockbox
          # injects via Python's os.environ AFTER process start), so we
          # need actual Python to introspect.
          API=$(docker compose $COMPOSE_ARGS ps -q api)
          echo "--- DATABASE_URL_REPLICA presence (via bootstrap_secrets) ---"
          docker exec "$API" python -c "
          import os
          from src.auth.vault_agent import bootstrap_secrets
          bootstrap_secrets()
          val = os.environ.get('DATABASE_URL_REPLICA', '')
          if not val:
              print('STATUS: UNSET — Lockbox entry not picked up')
          else:
              # Unambiguous dump — !r shows escape codes (\\r, \\n, '),
              # split the value at the @ so we never accidentally print
              # the password segment.
              print('STATUS: SET (len=' + str(len(val)) + ')')
              print('  starts (20) = ' + repr(val[:20]))
              print('  ends   (30) = ' + repr(val[-30:]))
              # Try to test connection with psycopg2 — that's the real
              # signal of whether the value works.
              try:
                  import psycopg2
                  c = psycopg2.connect(val, connect_timeout=3)
                  c.close()
                  print('  CONNECTION: OK (psycopg2 connected to replica)')
              except Exception as e:
                  print('  CONNECTION: FAILED — ' + repr(e)[:200])
          " 2>&1 | tail -15
          EOF
