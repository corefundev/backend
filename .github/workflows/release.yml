name: Release

# Triggered on semver tags — vX.Y.Z. Builds and publishes all three
# Docker images (API, worker, sandbox), signs each with keyless cosign,
# generates an SBOM and a GitHub Release with the changelog.
#
# This complements cd.yml, which handles continuous deploys from main.
# A tag kicks off the "proper" release with provenance + retention.

on:
  push:
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # R5-M8
    permissions:
      contents: write       # create release
      packages: write       # push images to ghcr
      id-token: write       # cosign keyless signing (OIDC)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-buildx-retry   # R11-#83 — bounded retry
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to ghcr
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: vars
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Loop three images to keep the job compact. For each image we:
      #   1. Build + push with `tag` and `latest`
      #   2. Record the digest
      #   3. Sign the digest keylessly via cosign
      - name: Build & push API
        id: api
        uses: ./.github/actions/build-image-retry    # R11-#83 — bounded retry
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/sku-api:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_BASE }}/sku-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Worker
        id: worker
        uses: ./.github/actions/build-image-retry    # R11-#83 — bounded retry
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/sku-worker:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_BASE }}/sku-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Sandbox
        id: sandbox
        uses: ./.github/actions/build-image-retry    # R11-#83 — bounded retry
        with:
          context: .
          file: docker/Dockerfile.sandbox
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/sku-sandbox:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_BASE }}/sku-sandbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign images
        env:
          COSIGN_YES: "true"    # keyless: use GitHub OIDC identity
        run: |
          for svc in api worker sandbox; do
            digest="$(skopeo inspect --raw docker://${IMAGE_BASE}/sku-${svc}:${{ steps.vars.outputs.tag }} 2>/dev/null | sha256sum | cut -d' ' -f1)" || true
            img="${IMAGE_BASE}/sku-${svc}@sha256:${digest}"
            case "$svc" in
              api)     img="${{ steps.api.outputs.digest }}";;
              worker)  img="${{ steps.worker.outputs.digest }}";;
              sandbox) img="${{ steps.sandbox.outputs.digest }}";;
            esac
            echo "signing $img"
            # R11-#83 — bounded retry against transient GHCR 5xx.
            for attempt in 1 2 3; do
              cosign sign --yes "${IMAGE_BASE}/sku-${svc}@${img}" && break
              if [ "$attempt" = 3 ]; then
                echo "::error::cosign sign failed after 3 attempts for sku-${svc}"
                exit 1
              fi
              echo "::warning::cosign sign attempt $attempt failed — retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            done
          done

      # R4-18 — SBOM coverage for ALL THREE shipped images, not just
      # api. The worker (RQ + ML training graph) and sandbox (untrusted
      # CSV/XLSX parser, distinct minimal deps) have entirely separate
      # dependency graphs from api; a release with only an api SBOM
      # gave a false sense of supply-chain auditability for the other
      # two artefacts. syft inspects the published GHCR image (not a
      # local build) so the SBOM matches what consumers actually pull.
      - name: Generate SBOM — api (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_BASE }}/sku-api:${{ steps.vars.outputs.tag }}
          format: spdx-json
          output-file: sbom-api.spdx.json

      - name: Generate SBOM — worker (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_BASE }}/sku-worker:${{ steps.vars.outputs.tag }}
          format: spdx-json
          output-file: sbom-worker.spdx.json

      - name: Generate SBOM — sandbox (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_BASE }}/sku-sandbox:${{ steps.vars.outputs.tag }}
          format: spdx-json
          output-file: sbom-sandbox.spdx.json

      # Audit R3-23 — sign the SBOM blob the same way we sign images.
      # Without this, anyone with push access to the GH Release assets
      # could swap a tampered SBOM and the signature on the image
      # wouldn't catch it. cosign sign-blob produces a .sig sidecar
      # using the same keyless OIDC identity as the image signatures.
      #
      # R4-18 — one sign-blob per SBOM (api/worker/sandbox); each gets
      # its own .sig + .crt sidecar pair so verifiers can audit any of
      # the three independently without touching the others.
      - name: Sign SBOMs (cosign sign-blob keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for svc in api worker sandbox; do
              echo "  signing sbom-${svc}.spdx.json"
              cosign sign-blob \
                  --yes \
                  --output-signature "sbom-${svc}.spdx.json.sig" \
                  --output-certificate "sbom-${svc}.spdx.json.crt" \
                  "sbom-${svc}.spdx.json"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          # Attach the signed SBOM + sidecars for all three images.
          # Per-image verify recipe:
          #   cosign verify-blob \
          #     --certificate-identity-regexp '.*corefundev/backend.*' \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          #     --signature sbom-<svc>.spdx.json.sig \
          #     --certificate sbom-<svc>.spdx.json.crt \
          #     sbom-<svc>.spdx.json
          # where <svc> is one of: api, worker, sandbox.
          files: |
            sbom-api.spdx.json
            sbom-api.spdx.json.sig
            sbom-api.spdx.json.crt
            sbom-worker.spdx.json
            sbom-worker.spdx.json.sig
            sbom-worker.spdx.json.crt
            sbom-sandbox.spdx.json
            sbom-sandbox.spdx.json.sig
            sbom-sandbox.spdx.json.crt
