# One-shot install of iptables DOCKER-USER rules that restrict the
# primary's published 5432 port to the replica IP + localhost.
#
# Logic in scripts/setup_pg_firewall.sh — workflow is a thin wrapper.

name: Setup PG Firewall (Primary)

on:
  workflow_dispatch:
    inputs:
      replica_cidr:
        description: "Replica IP in CIDR notation"
        required: true
        default: "212.8.226.233/32"

jobs:
  setup-firewall:
    name: Restrict pg port to replica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup SSH
        env:
          SSH_KEY:         ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY"         > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ConnectTimeout 10
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Push firewall script to primary
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -q scripts/setup_pg_firewall.sh \
              "${VPS_USER}@${VPS_HOST}:/srv/backend/scripts/setup_pg_firewall.sh"
          ssh -q "${VPS_USER}@${VPS_HOST}" \
              "chmod +x /srv/backend/scripts/setup_pg_firewall.sh"

      - name: Apply firewall rules
        env:
          VPS_HOST:     ${{ secrets.VPS_HOST }}
          VPS_USER:     ${{ secrets.VPS_USER }}
          REPLICA_CIDR: ${{ inputs.replica_cidr }}
        run: |
          set -euo pipefail
          ssh -q "${VPS_USER}@${VPS_HOST}" \
              "REPLICA_CIDR='$REPLICA_CIDR' bash /srv/backend/scripts/setup_pg_firewall.sh"

      - name: Probe — replica should reach, anonymous should not
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # The GHA runner is NOT in REPLICA_CIDR — its connection
          # attempt should be dropped. We don't fail on success here
          # (the replica-side validation is the real test); just
          # surface what the primary now refuses.
          echo "Probe from GHA runner (should DROP):"
          timeout 5 bash -c "echo > /dev/tcp/${VPS_HOST}/5432 && echo 'CONNECTED — DROP NOT WORKING' || echo 'no route — drop is in effect'" || true
