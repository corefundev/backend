# Run pending DB migrations on prod.
#
# The `migrate` compose service is one-shot — it runs once at initial
# deploy, applies migrations, exits 0. If new migration files land in
# migrations/ later (like 008_audit_log.sql), they don't auto-apply
# until someone explicitly re-runs the migrate service.
#
# This workflow does that: push the migrations dir + scripts/migrate.py
# to the host, then run migrate.py in a THROWAWAY container from the
# current api image with those files mounted over (#413: the host keeps
# no src/ anymore — CD ships prebuilt GHCR images, so building on the
# host is impossible).
#
# Idempotent — migrate.py uses _db_migrations to track applied files,
# so re-running is a no-op when nothing's pending.

name: Apply DB Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    name: docker compose run migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15  # R5-M8 — bound stuck SSH / psql to 15min, not GH default 6h
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup SSH
        env:
          SSH_KEY:         ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY"         > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ConnectTimeout 10
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Push migrations + migrate.py
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # rsync would be nicer but plain VPSes often lack it; tar+ssh is universal.
          tar czf - migrations scripts/migrate.py \
              | ssh -q "${VPS_USER}@${VPS_HOST}" "cd /srv/backend && tar xzf - && ls migrations/ | tail -10"

      - name: Run migrate.py in a throwaway container (current api image)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -q "${VPS_USER}@${VPS_HOST}" bash -s <<'EOF'
          set -e
          cd /srv/backend
          # #413: хост давно НЕ хранит src/ (CD = готовые GHCR-образы) —
          # `compose build migrate` на хосте мёртв. Вместо сборки гоняем
          # НАСТОЯЩИЙ scripts/migrate.py (advisory lock, _db_migrations,
          # потранзакционно) в одноразовом контейнере из ТЕКУЩЕГО
          # api-образа, с host-свежими migrations/ и migrate.py поверх
          # (сценарий «миграция без деплоя»). Env+mounts берём у живого
          # api — Lockbox-бутстрап внутри migrate.py получает всё сам.
          PG=$(docker ps --format '{{.Names}}' | grep -E 'postgres' | head -1)

          echo "── current state of _db_migrations ──"
          docker exec "$PG" psql -U sku -d sku_forecasting -c \
              "SELECT filename, applied_at FROM _db_migrations ORDER BY applied_at;"

          IMG=$(docker inspect docker-api-1 --format '{{.Config.Image}}')
          NET=$(docker inspect docker-api-1 --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          echo
          echo "── running migrate.py (image: $IMG, idempotent) ──"
          docker run --rm --network "$NET" \
            $(docker inspect docker-api-1 --format '{{range .Config.Env}}-e {{.}} {{end}}') \
            $(docker inspect docker-api-1 --format '{{range .Mounts}}-v {{.Source}}:{{.Destination}}:ro {{end}}') \
            -v /srv/backend/migrations:/app/migrations:ro \
            -v /srv/backend/scripts/migrate.py:/app/scripts/migrate.py:ro \
            "$IMG" python scripts/migrate.py

          echo
          echo "── post-migrate _db_migrations ──"
          docker exec "$PG" psql -U sku -d sku_forecasting -c \
              "SELECT filename, applied_at FROM _db_migrations ORDER BY applied_at;"

          echo
          echo "── verify audit_log table exists ──"
          docker exec "$PG" psql -U sku -d sku_forecasting -c \
              "SELECT to_regclass('public.audit_log') AS audit_log;"
          EOF
