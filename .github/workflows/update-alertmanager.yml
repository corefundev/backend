# Update Alertmanager (Lockbox-mode):
#   1. scp the latest alertmanager.yml + docker-compose.yml +
#      Dockerfile.alertmanager + scripts/alertmanager_entrypoint.sh.
#      lockbox_bootstrap.sh is already on the VPS (used by backup).
#   2. Strip any leftover TELEGRAM_ALERT_* lines from /srv/backend/.env
#      (legacy from the GH-secrets phase — they must NOT be there now;
#      Lockbox is the only source).
#   3. Build the alertmanager image and recreate the container.
#   4. Optionally send a synthetic test alert via /api/v2/alerts.
#
# No GitHub secrets for the bot token any more — the SA key on the VPS
# fetches it from Lockbox at container start.
#
# Lockbox secret prerequisites:
#   sku-forecasting-secrets must contain text entries
#     TELEGRAM_ALERT_BOT_TOKEN
#     TELEGRAM_ALERT_CHAT_ID
#   (added via:
#     yc lockbox secret add-version \
#         --id $YC_LOCKBOX_SECRET_ID \
#         --payload '[{"key":"TELEGRAM_ALERT_BOT_TOKEN","text_value":"…"},
#                     {"key":"TELEGRAM_ALERT_CHAT_ID","text_value":"…"}]')

name: Update Alertmanager (Telegram)

on:
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: "Send a synthetic test alert after restart"
        required: false
        type: boolean
        default: true

jobs:
  update:
    name: Build + restart alertmanager
    runs-on: ubuntu-latest
    timeout-minutes: 15  # R5-M8 — bound stuck SSH / psql to 15min, not GH default 6h
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup SSH
        env:
          SSH_KEY:         ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY"         > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ConnectTimeout 10
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Push alertmanager files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # R7-7 (2026-05-19) — alertmanager.yml now lives in
          # docker/alertmanager/ as alertmanager.yml.tpl (bind-mount
          # the directory, not the single file, to avoid the R6-5
          # inode-replace trap).
          ssh -q "${VPS_USER}@${VPS_HOST}" \
              'mkdir -p /srv/backend/docker/alertmanager'
          scp -q docker/alertmanager/alertmanager.yml.tpl \
              "${VPS_USER}@${VPS_HOST}:/srv/backend/docker/alertmanager/"
          scp -q docker/docker-compose.yml \
                 docker/docker-compose.lockbox.yml \
                 docker/Dockerfile.alertmanager \
              "${VPS_USER}@${VPS_HOST}:/srv/backend/docker/"
          scp -q scripts/alertmanager_entrypoint.sh \
                 scripts/lockbox_bootstrap.sh \
              "${VPS_USER}@${VPS_HOST}:/srv/backend/scripts/"

      - name: Strip legacy TELEGRAM_ALERT_* lines from .env
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -q "${VPS_USER}@${VPS_HOST}" bash -s <<'EOF'
          set -e
          cd /srv/backend
          ENV_FILE=.env
          [ -f "$ENV_FILE" ] || exit 0
          # Drop any prior TELEGRAM_ALERT_* — Lockbox is the only source now.
          BEFORE=$(grep -cE '^TELEGRAM_ALERT_(BOT_TOKEN|CHAT_ID)=' "$ENV_FILE" || true)
          sed -i '/^TELEGRAM_ALERT_BOT_TOKEN=/d' "$ENV_FILE"
          sed -i '/^TELEGRAM_ALERT_CHAT_ID=/d'   "$ENV_FILE"
          echo "  scrubbed $BEFORE legacy TELEGRAM_ALERT_* line(s) from .env"
          EOF

      - name: Build + recreate alertmanager
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -q "${VPS_USER}@${VPS_HOST}" bash -s <<'EOF'
          set -e
          cd /srv/backend
          chmod +x scripts/alertmanager_entrypoint.sh
          COMPOSE_ARGS="--env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml -f docker/docker-compose.minimal.yml -f docker/docker-compose.lockbox.yml -f docker/docker-compose.replication.yml"

          echo "  resolved alertmanager service env (compose config):"
          docker compose $COMPOSE_ARGS config alertmanager 2>/dev/null \
              | sed -n '/^[[:space:]]*environment:/,/^[[:space:]]*[a-z_]\+:/p' \
              | sed -E 's/(BOT_TOKEN|PASSWORD|SECRET[A-Z_]*|API_KEY|FERNET).*$/\1: ***/g' \
              | head -40

          echo
          echo "  building alertmanager image…"
          docker compose $COMPOSE_ARGS build alertmanager

          echo "  recreating alertmanager…"
          docker compose $COMPOSE_ARGS up -d --force-recreate alertmanager

          echo "  waiting for healthy…"
          for i in $(seq 1 60); do
              S=$(docker compose $COMPOSE_ARGS ps --format '{{.Health}}' alertmanager 2>/dev/null || true)
              [ "$S" = "healthy" ] && { echo "  healthy after ${i}s"; break; }
              sleep 1
          done

          echo
          echo "  Lockbox bootstrap log line (look for 'injected N variables'):"
          docker compose $COMPOSE_ARGS logs --tail=80 alertmanager 2>&1 \
              | grep -E 'lockbox_bootstrap|alertmanager_entrypoint' || \
              echo "    (no bootstrap line — entrypoint may have skipped Lockbox path)"

          echo
          echo "  recent alertmanager errors (if any):"
          docker compose $COMPOSE_ARGS logs --tail=80 alertmanager 2>&1 \
              | grep -E 'level=error|level=warn' | tail -10 || true

          AM=$(docker compose $COMPOSE_ARGS ps -q alertmanager)
          if [ -n "$AM" ] && docker inspect -f '{{.State.Running}}' "$AM" 2>/dev/null | grep -q true; then
              echo
              echo "  rendered config (sensitive values masked):"
              docker exec "$AM" cat /tmp/alertmanager.yml \
                  | sed -E 's/(bot_token: ").{4}[^"]*/\1***/g; s/(chat_id:\s+).+/\1***/g'
          else
              echo
              echo "  alertmanager container is not running — skipping rendered-config dump."
          fi

          echo
          echo "  verifying .env has no TELEGRAM_ALERT_* (should be empty):"
          grep -E '^TELEGRAM_ALERT_' .env || echo "    (clean)"
          EOF

      - name: Send synthetic test alert
        if: inputs.send_test_alert
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -q "${VPS_USER}@${VPS_HOST}" bash -s <<'EOF'
          set -e
          cd /srv/backend
          COMPOSE_ARGS="--env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml -f docker/docker-compose.minimal.yml -f docker/docker-compose.lockbox.yml -f docker/docker-compose.replication.yml"
          AM=$(docker compose $COMPOSE_ARGS ps -q alertmanager)
          # Direct API push — no need for amtool. Fires immediately.
          docker exec "$AM" wget -qO- --post-data='[{
              "labels": {
                  "alertname": "TelegramRoutingTest",
                  "severity":  "warning",
                  "cluster":   "prod"
              },
              "annotations": {
                  "summary":     "Test alert from Update Alertmanager workflow",
                  "description": "If you see this in the Alert System group, telegram routing works."
              },
              "endsAt": "'"$(date -u -d '+5 minutes' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
                         || date -u -v +5M +%Y-%m-%dT%H:%M:%SZ)"'"
          }]' --header='Content-Type: application/json' \
              http://localhost:9093/api/v2/alerts
          echo
          echo "  Test alert posted. Check the Alert System group for ⚠️ TelegramRoutingTest."
          EOF
