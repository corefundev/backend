# One-shot setup of streaming replication on the PRIMARY postgres.
#
# Idempotent — safe to re-run. Steps:
#   1. CREATE / ALTER `replication` role with the password from
#      ${{ secrets.REPLICATION_PASSWORD }}.
#   2. Add a pg_hba.conf rule allowing the role from REPLICA_CIDR
#      using scram-sha-256.
#   3. Reload postgres (no restart — pg_hba changes apply via SIGHUP).
#   4. Create physical replication slot if missing.
#   5. Print wal_level / max_wal_senders for sanity.
#   6. Open UFW for 5432 from REPLICA_CIDR (no-op if UFW inactive).
#
# Triggered manually only (workflow_dispatch). Uses the same SSH-secret
# convention as the rotate-lockbox-key workflow (VPS_*).
#
# Implementation: the remote script is a single-quoted heredoc fed to
# `ssh ... bash -s` via stdin, with values passed as POSITIONAL args.
# That means zero escaping inside the heredoc — what you see is what
# remote bash sees.

name: Setup PG Replication (Primary)

on:
  workflow_dispatch:
    inputs:
      replica_cidr:
        description: "Replica IP in CIDR notation"
        required: true
        default: "212.8.226.233/32"
      replication_user:
        description: "Replication role name"
        required: true
        default: "replicator"
      slot_name:
        description: "Physical replication slot name"
        required: true
        default: "replica_1"

jobs:
  setup-primary:
    name: Configure primary for replication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup SSH
        env:
          SSH_KEY:         ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY"         > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ConnectTimeout 10
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Configure primary
        env:
          VPS_HOST:        ${{ secrets.VPS_HOST }}
          VPS_USER:        ${{ secrets.VPS_USER }}
          VPS_COMPOSE_DIR: /srv/backend
          REPL_PW:         ${{ secrets.REPLICATION_PASSWORD }}
          REPL_USER:       ${{ inputs.replication_user }}
          REPL_CIDR:       ${{ inputs.replica_cidr }}
          SLOT_NAME:       ${{ inputs.slot_name }}
        run: |
          set -euo pipefail
          if [ -z "$REPL_PW" ]; then
            echo "ERROR: secrets.REPLICATION_PASSWORD is empty" >&2
            exit 1
          fi
          # bash -s + positional args: VAR_* on remote are populated from
          # $1..$N.  Heredoc is single-quoted ('REMOTE') so it's verbatim
          # — no $-expansion on the runner, no escaping inside.
          ssh -q "${VPS_USER}@${VPS_HOST}" \
              bash -s -- \
              "$VPS_COMPOSE_DIR" \
              "$REPL_USER" \
              "$REPL_PW" \
              "$REPL_CIDR" \
              "$SLOT_NAME" <<'REMOTE'
          set -e
          VPS_COMPOSE_DIR="$1"
          REPL_USER="$2"
          REPL_PW="$3"
          REPL_CIDR="$4"
          SLOT_NAME="$5"

          cd "$VPS_COMPOSE_DIR"
          COMPOSE_ARGS="--env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml -f docker/docker-compose.minimal.yml -f docker/docker-compose.lockbox.yml"
          PG_CONTAINER=$(docker compose $COMPOSE_ARGS ps -q postgres 2>/dev/null || true)
          if [ -z "$PG_CONTAINER" ]; then
              PG_CONTAINER=$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}' | head -1)
          fi
          if [ -z "$PG_CONTAINER" ]; then
              echo "ERROR: postgres container not found" >&2
              exit 1
          fi
          echo "    postgres container: $PG_CONTAINER"

          # Helper: run psql, with role/db pre-baked.
          run_sql() {
              docker exec -i "$PG_CONTAINER" psql -U sku -d sku_forecasting -v ON_ERROR_STOP=1 "$@"
          }

          echo "[1/6] role"
          # Existence check via -tAc (tuples-only, unaligned). Idempotent
          # via bash branching — avoids PL/pgSQL DO $$ entirely.
          # Quote literals with PG's standard ''-doubling rule.
          REPL_USER_LIT="'$(printf '%s' "$REPL_USER" | sed "s/'/''/g")'"
          REPL_PW_LIT="'$(printf '%s' "$REPL_PW"   | sed "s/'/''/g")'"
          SLOT_LIT="'$(printf '%s' "$SLOT_NAME"   | sed "s/'/''/g")'"
          # Identifier — double-quote and double any embedded ".
          REPL_USER_ID='"'"$(printf '%s' "$REPL_USER" | sed 's/"/""/g')"'"'
          if run_sql -tAc "SELECT 1 FROM pg_roles WHERE rolname = $REPL_USER_LIT" | grep -q '^1$'; then
              run_sql -c "ALTER ROLE $REPL_USER_ID WITH REPLICATION LOGIN PASSWORD $REPL_PW_LIT;"
              echo "    altered role"
          else
              run_sql -c "CREATE ROLE $REPL_USER_ID WITH REPLICATION LOGIN PASSWORD $REPL_PW_LIT;"
              echo "    created role"
          fi

          echo "[2/6] pg_hba"
          HBA_PATH=$(docker exec "$PG_CONTAINER" sh -c 'echo $PGDATA')/pg_hba.conf
          HBA_LINE="host    replication    $REPL_USER    $REPL_CIDR    scram-sha-256"
          if docker exec "$PG_CONTAINER" grep -qF "$REPL_CIDR" "$HBA_PATH" 2>/dev/null; then
              echo "    pg_hba already has entry for $REPL_CIDR"
          else
              docker exec "$PG_CONTAINER" sh -c "echo \"$HBA_LINE\" >> $HBA_PATH"
              echo "    added: $HBA_LINE"
          fi

          echo "[3/6] reload"
          run_sql -c "SELECT pg_reload_conf();"

          echo "[4/6] slot"
          if run_sql -tAc "SELECT 1 FROM pg_replication_slots WHERE slot_name = $SLOT_LIT" | grep -q '^1$'; then
              echo "    slot $SLOT_NAME already exists"
          else
              run_sql -c "SELECT pg_create_physical_replication_slot($SLOT_LIT);"
              echo "    created slot $SLOT_NAME"
          fi
          run_sql -c "SELECT slot_name, slot_type, active, restart_lsn FROM pg_replication_slots WHERE slot_name = $SLOT_LIT;"

          echo "[5/6] WAL settings"
          run_sql -c "SELECT name, setting FROM pg_settings WHERE name IN ('wal_level','max_wal_senders','max_replication_slots');"

          echo "[6/6] UFW"
          if command -v ufw >/dev/null && sudo ufw status | grep -q "Status: active"; then
              if sudo ufw status numbered | grep -qE "5432.*$REPL_CIDR"; then
                  echo "    UFW already permits 5432 from $REPL_CIDR"
              else
                  sudo ufw allow from "$REPL_CIDR" to any port 5432 proto tcp comment "pg-replication"
                  echo "    allowed 5432 from $REPL_CIDR"
              fi
          else
              echo "    UFW not active — Docker iptables governs port exposure"
          fi
          echo "DONE"
          REMOTE
