# One-shot setup of streaming replication on the PRIMARY postgres.
#
# All actual logic lives in scripts/setup_replication_primary.sh — the
# workflow is a thin wrapper that scp's the script + the compose
# overlay, recreates postgres with port 5432 published, then runs the
# script via ssh.

name: Setup PG Replication (Primary)

on:
  workflow_dispatch:
    inputs:
      replica_cidr:
        description: "Replica IP in CIDR notation"
        required: true
        default: "212.8.226.233/32"
      replication_user:
        description: "Replication role name"
        required: true
        default: "replicator"
      slot_name:
        description: "Physical replication slot name"
        required: true
        default: "replica_1"
      force_regen_cert:
        description: "Force-regenerate the SSL cert (annual rotation)"
        required: false
        type: boolean
        default: false

jobs:
  setup-primary:
    name: Configure primary for replication
    runs-on: ubuntu-latest
    timeout-minutes: 30  # R5-M8 — pg_basebackup / restore drills take longer
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup SSH
        env:
          SSH_KEY:         ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY"         > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ConnectTimeout 10
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Push replication overlay + setup script to primary
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -q docker/docker-compose.replication.yml \
              "${VPS_USER}@${VPS_HOST}:/srv/backend/docker/docker-compose.replication.yml"
          scp -q scripts/setup_replication_primary.sh \
              "${VPS_USER}@${VPS_HOST}:/srv/backend/scripts/setup_replication_primary.sh"
          ssh -q "${VPS_USER}@${VPS_HOST}" \
              "chmod +x /srv/backend/scripts/setup_replication_primary.sh && \
               ls -la /srv/backend/docker/docker-compose.replication.yml /srv/backend/scripts/setup_replication_primary.sh"

      - name: Recreate postgres + bring up firewall sidecar
        env:
          VPS_HOST:         ${{ secrets.VPS_HOST }}
          VPS_USER:         ${{ secrets.VPS_USER }}
          REPLICA_CIDR:     ${{ inputs.replica_cidr }}
          FORCE_REGEN_CERT: ${{ inputs.force_regen_cert }}
        run: |
          set -euo pipefail
          # `up -d` (no service args) brings up everything declared,
          # including the pg-firewall sidecar from the replication
          # overlay. REPLICA_CIDR + FORCE_REGEN_CERT are exported into
          # the remote shell.
          ssh -q "${VPS_USER}@${VPS_HOST}" \
              "REPLICA_CIDR='$REPLICA_CIDR' FORCE_REGEN_CERT='$FORCE_REGEN_CERT' bash -s" <<'EOF'
          set -e
          cd /srv/backend
          COMPOSE_ARGS="--env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml -f docker/docker-compose.minimal.yml -f docker/docker-compose.lockbox.yml -f docker/docker-compose.replication.yml"

          # Cert MUST exist before postgres starts — the new compose
          # overlay's `ssl=on -c ssl_cert_file=...` will fail-loop
          # otherwise. Generation is idempotent: skips if files present.
          # FORCE_REGEN_CERT=true wipes the existing cert first — this
          # is the rotation path (cert is valid 1 year, plan for rotation
          # in March/April each year, well before the May expiry).
          SSL_DIR=/srv/backend/secrets/pg-ssl
          mkdir -p "$SSL_DIR"
          if [ "$FORCE_REGEN_CERT" = "true" ]; then
              echo "force-regen requested — removing existing cert"
              # docker run as root to remove files owned by uid 70
              docker run --rm -v "$SSL_DIR:/out" alpine:3.20 \
                  sh -c 'rm -f /out/server.crt /out/server.key'
          fi
          if [ ! -f "$SSL_DIR/server.crt" ] || [ ! -f "$SSL_DIR/server.key" ]; then
              echo "generating SSL cert (one-time)"
              docker run --rm -v "$SSL_DIR:/out" alpine:3.20 sh -c '
                  apk add --no-cache openssl >/dev/null
                  openssl req -new -x509 -days 365 -nodes \
                      -keyout /out/server.key \
                      -out /out/server.crt \
                      -subj "/CN=api.testcore.ru" \
                      -addext "subjectAltName=DNS:api.testcore.ru,IP:62.217.181.157"
                  chown 70:70 /out/server.crt /out/server.key
                  chmod 644 /out/server.crt
                  chmod 600 /out/server.key
              '
              echo "cert generated"
          else
              echo "SSL cert already present"
          fi
          ls -la "$SSL_DIR"

          # --force-recreate wipes any stuck container from a previous
          # failed run (e.g. SSL cert was missing → restart-loop with
          # exponential backoff). Fresh container reads the now-present
          # cert and starts cleanly.
          docker compose $COMPOSE_ARGS up -d --force-recreate postgres pg-firewall

          # Wait up to 60s — even a fresh start can take ~10s, and we
          # want margin if the previous container's stale state needs
          # to settle.
          S=""
          for i in $(seq 1 60); do
              S=$(docker compose $COMPOSE_ARGS ps --format "{{.Health}}" postgres 2>/dev/null || true)
              [ "$S" = "healthy" ] && { echo "postgres healthy after ${i}s"; break; }
              sleep 1
          done
          if [ "$S" != "healthy" ]; then
              echo "postgres did not become healthy in 60s" >&2
              docker compose $COMPOSE_ARGS logs --tail=80 postgres >&2
              exit 1
          fi

          echo "--- pg-firewall sidecar status ---"
          docker compose $COMPOSE_ARGS ps pg-firewall
          # Wait briefly for the sidecar's first iptables-apply pass.
          for i in $(seq 1 10); do
              if docker logs pg-firewall 2>&1 | grep -q "rules applied"; then
                  echo "firewall rules applied after ${i}s"
                  break
              fi
              sleep 1
          done
          docker logs pg-firewall 2>&1 | tail -15
          EOF

      - name: Run setup script on primary
        env:
          VPS_HOST:   ${{ secrets.VPS_HOST }}
          VPS_USER:   ${{ secrets.VPS_USER }}
          REPL_PW:    ${{ secrets.REPLICATION_PASSWORD }}
          REPL_USER:  ${{ inputs.replication_user }}
          REPL_CIDR:  ${{ inputs.replica_cidr }}
          SLOT_NAME:  ${{ inputs.slot_name }}
        run: |
          set -euo pipefail
          if [ -z "$REPL_PW" ]; then
            echo "ERROR: secrets.REPLICATION_PASSWORD is empty" >&2
            exit 1
          fi
          # Pass values via SSH SendEnv requires server-side AcceptEnv,
          # which we don't have. Just inline them into the remote env on
          # the command line — the script then reads them via env var.
          ssh -q \
              -o "SendEnv=REPL_PW REPL_USER REPL_CIDR SLOT_NAME" \
              "${VPS_USER}@${VPS_HOST}" \
              "REPL_PW='$REPL_PW' REPL_USER='$REPL_USER' REPL_CIDR='$REPL_CIDR' SLOT_NAME='$SLOT_NAME' bash /srv/backend/scripts/setup_replication_primary.sh"
