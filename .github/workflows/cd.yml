name: CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: staging
        type: choice
        options: [staging, production]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/sku-api
  IMAGE_WORKER: ghcr.io/${{ github.repository }}/sku-worker

jobs:
  # ── Deploy Staging ─────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:staging
            ${{ env.IMAGE_API }}:${{ github.sha }}

      - name: Build and push Worker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: |
            ${{ env.IMAGE_WORKER }}:staging
            ${{ env.IMAGE_WORKER }}:${{ github.sha }}

      - name: Deploy to staging server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/sku-forecasting
            docker compose pull
            docker compose up -d --no-deps api worker
            sleep 10
            curl -f http://localhost:8000/health || exit 1
            echo "Staging health check passed"

  # ── Staging validation ─────────────────────────────────────
  validate-staging:
    name: Validate Staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install httpx pytest
      - name: Run smoke tests against staging
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          API_KEY:     ${{ secrets.STAGING_API_KEY }}
        run: |
          python -c "
          import httpx, os
          url = os.environ['STAGING_URL']
          key = os.environ['API_KEY']
          r = httpx.get(f'{url}/health', timeout=10)
          assert r.status_code == 200, f'Health check failed: {r.status_code}'
          assert r.json()['status'] == 'ok'
          print('Staging validation: PASSED')
          "

  # ── Manual approval gate ───────────────────────────────────
  # (GitHub environment protection rules enforce manual approval)

  # ── Deploy Production ──────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate-staging
    environment: production   # ← requires manual approval in GitHub Settings
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Tag production images
        run: |
          docker pull ${{ env.IMAGE_API }}:${{ github.sha }}
          docker tag  ${{ env.IMAGE_API }}:${{ github.sha }} ${{ env.IMAGE_API }}:latest
          docker push ${{ env.IMAGE_API }}:latest

      - name: Deploy to production server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/sku-forecasting
            docker compose pull
            # Rolling restart: worker first, then API
            docker compose up -d --no-deps worker
            sleep 5
            docker compose up -d --no-deps api
            sleep 15
            curl -f http://localhost:8000/health || exit 1
            echo "Production deploy complete"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
