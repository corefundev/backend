# Continuous deployment: push to main → staging → smoke → manual gate → prod.
#
# Pipeline shape:
#   1. build         — build api + worker images on the runner, push to GHCR
#                      with both :sha-12 and :main tags. Identical artifact
#                      flows to staging and prod (no rebuild on VPS).
#   2. deploy-staging — rsync configs (compose/scripts/migrations) to
#                      /srv/backend on staging, pull images, run migrate,
#                      recreate api + worker* services. Other infra
#                      services (postgres/redis/nginx/...) are restarted
#                      only if their compose-time defs changed.
#   3. smoke-staging  — external probes (https://api.staging.testcore.ru/healthz).
#   4. deploy-prod    — environment "production" requires reviewer approval
#                      (configure in GH Settings → Environments). Mirrors
#                      staging steps on prod VPS using same image SHA.
#   5. smoke-prod     — final external probe + tagged commit notification.
#
# Required GH secrets:
#   STAGING_HOST, STAGING_USER,
#   STAGING_SSH_PRIVATE_KEY, STAGING_SSH_KNOWN_HOSTS
#   VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY, VPS_SSH_KNOWN_HOSTS  (prod)
#
# Required GH environments:
#   "staging"     — no protection (auto-deploys on push to main)
#   "production"  — required reviewers (set in Settings → Environments)
#
# GHCR auth on VPS uses GITHUB_TOKEN (passed via SSH heredoc); a
# read-only PAT could be persisted on each VPS instead, but rotating
# the runner-issued token avoids one more secret to manage.

name: CD — Deploy to Staging then Production

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "scripts/**"
      - "migrations/**"
      - "docker/**"
      - "configs/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/cd.yml"
  workflow_dispatch:
    inputs:
      skip_staging:
        description: "Emergency: skip staging, deploy main directly to prod (requires approval)"
        type: boolean
        default: false

env:
  REGISTRY:      ghcr.io
  IMAGE_API:     ghcr.io/corefundev/sku-forecasting-api
  IMAGE_WORKER:  ghcr.io/corefundev/sku-forecasting-worker
  # R4-1 — sandbox image now built+pushed by CD (was: built locally on the
  # VPS via a docker:26-cli + docker.sock one-shot compose service, which
  # never reran after the initial deploy, so apt-upgrade and any change to
  # Dockerfile.sandbox or requirements-sandbox.txt silently failed to land).
  IMAGE_SANDBOX: ghcr.io/corefundev/sku-forecasting-sandbox

concurrency:
  # Group name is intentionally NEW (-v2) — the prior `cd-${{ github.ref }}`
  # value held a stale lock from 8f66e28 (2 days pending) that kept
  # subsequent runs stuck at 0-jobs/pending even after we set
  # cancel-in-progress: true. Rotating the group name forces the
  # scheduler to pick a fresh lock state.
  group: cd-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # R4-17 — keyless cosign signing via GitHub OIDC requires id-token.
      id-token: write
    outputs:
      tag:            ${{ steps.tag.outputs.sha }}
      digest_api:     ${{ steps.api.outputs.digest }}
      digest_worker:  ${{ steps.worker.outputs.digest }}
      digest_sandbox: ${{ steps.sandbox.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - id: tag
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # R4-17 — install cosign so the post-build step can sign each
      # image digest keylessly via GitHub OIDC. Previously only
      # release.yml (tagged releases) ran cosign; CD-built images on
      # main were unsigned — which is what prod actually runs.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # R4-21 — `:latest` tag is no longer pushed by CD. Compose's
      # default fallback flipped to `:main` (always points at the
      # tip of main, narrower attack surface than the unbounded
      # `:latest` namespace). `:<sha>` is the deploy artefact;
      # `:main` is the dev / fresh-VPS fallback.
      - name: Build + push api image
        id: api
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE_API }}:main
          cache-from: type=registry,ref=${{ env.IMAGE_API }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_API }}:buildcache,mode=max

      - name: Build + push worker image
        id: worker
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: |
            ${{ env.IMAGE_WORKER }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE_WORKER }}:main
          cache-from: type=registry,ref=${{ env.IMAGE_WORKER }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_WORKER }}:buildcache,mode=max

      # R4-1 — sandbox image built+pushed on every CD run. process-worker
      # runs `docker run ${SANDBOX_IMAGE}` to parse untrusted upload files;
      # the previous flow built it locally on the VPS via a docker:26-cli
      # one-shot compose service with /var/run/docker.sock bind-mounted —
      # never reran after the initial deploy AND exposed the host docker
      # daemon. This step keeps the image identity lockstep with api+worker
      # so apt-upgrade (Trivy debian patches) + requirements-sandbox.txt
      # changes actually land in prod.
      - name: Build + push sandbox image
        id: sandbox
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: docker/Dockerfile.sandbox
          push: true
          tags: |
            ${{ env.IMAGE_SANDBOX }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE_SANDBOX }}:main
          cache-from: type=registry,ref=${{ env.IMAGE_SANDBOX }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_SANDBOX }}:buildcache,mode=max

      # R4-17 — sign each pushed image keylessly via cosign + GitHub OIDC.
      # Anyone with `docker pull` access can verify with:
      #   cosign verify ghcr.io/corefundev/sku-forecasting-<svc>@<digest> \
      #     --certificate-identity-regexp '.*corefundev/backend.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # `cosign sign` operates on the digest (not the tag) — tag→digest
      # races between push and sign can't slip a different image past
      # the signature. build-push-action's `outputs.digest` is the
      # authoritative reference for the image we just pushed.
      - name: Sign images (keyless cosign)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for svc in api worker sandbox; do
              case "$svc" in
                  api)     img="${{ env.IMAGE_API }}";     d='${{ steps.api.outputs.digest }}'     ;;
                  worker)  img="${{ env.IMAGE_WORKER }}";  d='${{ steps.worker.outputs.digest }}'  ;;
                  sandbox) img="${{ env.IMAGE_SANDBOX }}"; d='${{ steps.sandbox.outputs.digest }}' ;;
              esac
              echo "  signing ${img}@${d}"
              cosign sign --yes "${img}@${d}"
          done

  deploy-staging:
    name: Deploy → staging
    needs: build
    if: ${{ ! inputs.skip_staging }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup SSH (staging)
        env:
          SSH_KEY:         ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY"         > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Sync configs to staging /srv/backend
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          # Push only configs / scripts / migrations — image carries src.
          # Excludes: secrets/yc-sa-key.json (kept stable on host), .env
          # (host-managed), build / cache / venv junk.
          rsync -azh \
              --include='docker/' --include='docker/**' \
              --include='scripts/' --include='scripts/**' \
              --include='migrations/' --include='migrations/**' \
              --include='configs/' --include='configs/**' \
              --exclude='*' \
              --exclude='secrets/**' --exclude='.env' \
              -e "ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts" \
              ./ "${USER}@${HOST}:/srv/backend/"

      - name: Pull image, migrate, recreate app services (via cd_deploy.sh)
        env:
          HOST:      ${{ secrets.STAGING_HOST }}
          USER:      ${{ secrets.STAGING_USER }}
          TAG:       ${{ needs.build.outputs.tag }}
          GHCR_PW:   ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euxo pipefail
          : "${TAG:?TAG empty — needs.build.outputs.tag missing}"
          : "${HOST:?HOST empty — STAGING_HOST secret missing}"
          : "${USER:?USER empty — STAGING_USER secret missing}"
          : "${GHCR_PW:?GHCR_PW empty — GITHUB_TOKEN missing}"
          echo "  TAG-prefix=${TAG::5}  HOST=${HOST}  USER=${USER}"
          # scp the deploy script (stable artifact, no heredoc shenanigans),
          # then run it via plain ssh with env-vars passed on the command line.
          scp -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts \
              ./scripts/cd_deploy.sh "${USER}@${HOST}:/tmp/cd_deploy.sh"
          ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts "${USER}@${HOST}" \
              env GHCR_USER="${GHCR_USER}" GHCR_PW="${GHCR_PW}" \
                  bash /tmp/cd_deploy.sh staging "${TAG}"

  smoke-staging:
    name: Smoke → staging
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /healthz returns 200 + status:ok
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
              BODY=$(curl -fsS https://api.staging.testcore.ru/healthz 2>&1) || BODY=""
              if echo "$BODY" | grep -q '"status":"ok"'; then
                  echo "  /healthz OK on attempt $i: $BODY"
                  exit 0
              fi
              sleep 5
          done
          echo "::error::staging /healthz did not return status:ok within 60s"
          exit 1

      - name: TLS cert chain valid (LE)
        run: |
          set -euo pipefail
          ISSUER=$(echo | openssl s_client -connect api.staging.testcore.ru:443 -servername api.staging.testcore.ru 2>/dev/null | openssl x509 -noout -issuer)
          echo "  issuer: $ISSUER"
          echo "$ISSUER" | grep -q "Let's Encrypt" || { echo "::error::cert not Let's Encrypt"; exit 1; }

  # "Approval needed" Telegram ping — fires the moment staging smoke is
  # green, before deploy-prod hits its environment gate. Gives ops a
  # direct link to approve without needing to watch the Actions tab.
  notify-prod-approval-needed:
    name: Notify → Telegram (prod approval needed)
    needs: [build, smoke-staging]
    if: ${{ always() && (needs.smoke-staging.result == 'success' || inputs.skip_staging) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Post approval-needed to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TAG:       ${{ needs.build.outputs.tag }}
          RUN_URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
              echo "TELEGRAM_ALERT_* not set — skipping"; exit 0
          fi
          MSG=$(printf '%s\n' \
              '⏸ <b>backend: prod approval needed</b>' \
              '' \
              "<i>tag:</i>     <code>${TAG}</code>" \
              '<i>staging:</i> <code>smoke ok</code>' \
              "<a href=\"${RUN_URL}\">Approve in GitHub</a>")
          curl -fsS -X POST \
              -H 'Content-Type: application/json' \
              --data "$(jq -n --arg chat "$CHAT_ID" --arg text "$MSG" \
                       '{chat_id:$chat, text:$text, message_thread_id:44, parse_mode:"HTML", disable_web_page_preview:true}')" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage"

  deploy-prod:
    name: Deploy → production
    # Need build for outputs.tag; smoke-staging gates the rollout.
    needs: [build, smoke-staging, notify-prod-approval-needed]
    if: ${{ always() && (needs.smoke-staging.result == 'success' || inputs.skip_staging) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup SSH (prod)
        env:
          SSH_KEY:         ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY"         > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Sync configs to prod /srv/backend
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          rsync -azh \
              --include='docker/' --include='docker/**' \
              --include='scripts/' --include='scripts/**' \
              --include='migrations/' --include='migrations/**' \
              --include='configs/' --include='configs/**' \
              --exclude='*' \
              --exclude='secrets/**' --exclude='.env' \
              -e "ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts" \
              ./ "${USER}@${HOST}:/srv/backend/"

      - name: Pull image, migrate, rolling-recreate on prod (via cd_deploy.sh)
        env:
          HOST:      ${{ secrets.VPS_HOST }}
          USER:      ${{ secrets.VPS_USER }}
          TAG:       ${{ needs.build.outputs.tag }}
          GHCR_PW:   ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euxo pipefail
          : "${TAG:?TAG empty — needs.build.outputs.tag missing}"
          : "${HOST:?HOST empty — VPS_HOST secret missing}"
          : "${USER:?USER empty — VPS_USER secret missing}"
          : "${GHCR_PW:?GHCR_PW empty — GITHUB_TOKEN missing}"
          echo "  TAG-prefix=${TAG::5}  HOST=${HOST}  USER=${USER}"
          scp -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts \
              ./scripts/cd_deploy.sh "${USER}@${HOST}:/tmp/cd_deploy.sh"
          ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts "${USER}@${HOST}" \
              env GHCR_USER="${GHCR_USER}" GHCR_PW="${GHCR_PW}" \
                  bash /tmp/cd_deploy.sh production "${TAG}"

  smoke-prod:
    name: Smoke → production
    needs: deploy-prod
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /healthz returns 200 + status:ok
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
              BODY=$(curl -fsS https://api.testcore.ru/healthz 2>&1) || BODY=""
              if echo "$BODY" | grep -q '"status":"ok"'; then
                  echo "  /healthz OK on attempt $i: $BODY"
                  exit 0
              fi
              sleep 5
          done
          echo "::error::prod /healthz did not return status:ok within 60s"
          exit 1

  # Telegram notifications: one per env (staging, prod). always() so
  # they fire regardless of whether the deploy / smoke job succeeded —
  # the message text reflects the actual status. Re-uses the same
  # @Alertcorebot + Alert System group as alertmanager (#158).
  notify-staging:
    name: Notify → Telegram (staging)
    needs: [build, deploy-staging, smoke-staging]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Post status to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TAG:       ${{ needs.build.outputs.tag }}
          DEPLOY_R:  ${{ needs.deploy-staging.result }}
          SMOKE_R:   ${{ needs.smoke-staging.result }}
          RUN_URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
              echo "TELEGRAM_ALERT_* secrets not set — skipping"; exit 0
          fi
          if [ "$DEPLOY_R" = "success" ] && [ "$SMOKE_R" = "success" ]; then
              MSG=$(printf '%s\n' \
                  '🚀 <b>staging deploy ok</b>' \
                  '' \
                  "<i>tag:</i>   <code>${TAG}</code>" \
                  "<i>cluster:</i> <code>staging</code>" \
                  "<a href=\"${RUN_URL}\">CD run</a>")
          else
              MSG=$(printf '%s\n' \
                  '❌ <b>staging deploy FAILED</b>' \
                  '' \
                  "<i>tag:</i>     <code>${TAG}</code>" \
                  "<i>deploy:</i>  <code>${DEPLOY_R}</code>" \
                  "<i>smoke:</i>   <code>${SMOKE_R}</code>" \
                  "<a href=\"${RUN_URL}\">CD run</a>")
          fi
          # message_thread_id=44 → "Deploys" topic in the Alert System
          # supergroup. Same chat as alertmanager critical/warning
          # threads, just routed to a different forum topic.
          curl -fsS -X POST \
              -H 'Content-Type: application/json' \
              --data "$(jq -n --arg chat "$CHAT_ID" --arg text "$MSG" \
                       '{chat_id:$chat, text:$text, message_thread_id:44, parse_mode:"HTML", disable_web_page_preview:true}')" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage"

  notify-prod:
    name: Notify → Telegram (production)
    needs: [build, deploy-prod, smoke-prod]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Post status to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TAG:       ${{ needs.build.outputs.tag }}
          DEPLOY_R:  ${{ needs.deploy-prod.result }}
          SMOKE_R:   ${{ needs.smoke-prod.result }}
          RUN_URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
              echo "TELEGRAM_ALERT_* secrets not set — skipping"; exit 0
          fi
          if [ "$DEPLOY_R" = "success" ] && [ "$SMOKE_R" = "success" ]; then
              MSG=$(printf '%s\n' \
                  '🚀 <b>prod deploy ok</b>' \
                  '' \
                  "<i>tag:</i>   <code>${TAG}</code>" \
                  "<i>cluster:</i> <code>prod</code>" \
                  "<a href=\"${RUN_URL}\">CD run</a>")
          elif [ "$DEPLOY_R" = "skipped" ]; then
              # Skipped means smoke-staging failed — already alerted by notify-staging
              echo "deploy-prod skipped (smoke-staging failure already notified) — silent exit"
              exit 0
          else
              MSG=$(printf '%s\n' \
                  '❌ <b>prod deploy FAILED</b>' \
                  '' \
                  "<i>tag:</i>     <code>${TAG}</code>" \
                  "<i>deploy:</i>  <code>${DEPLOY_R}</code>" \
                  "<i>smoke:</i>   <code>${SMOKE_R}</code>" \
                  "<a href=\"${RUN_URL}\">CD run</a>")
          fi
          # message_thread_id=44 → "Deploys" topic in the Alert System
          # supergroup. Same chat as alertmanager critical/warning
          # threads, just routed to a different forum topic.
          curl -fsS -X POST \
              -H 'Content-Type: application/json' \
              --data "$(jq -n --arg chat "$CHAT_ID" --arg text "$MSG" \
                       '{chat_id:$chat, text:$text, message_thread_id:44, parse_mode:"HTML", disable_web_page_preview:true}')" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage"
