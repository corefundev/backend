# supbot VPS — контур ассистента поддержки (эпик #503).
# ВАЖНО: это НЕ прод-компоуз; сервисы изолированы от sku_forecasting.
services:
  vectordb:
    image: pgvector/pgvector:pg16
    container_name: supbot-vectordb
    restart: unless-stopped
    environment:
      POSTGRES_DB: supbot
      POSTGRES_USER: supbot
      POSTGRES_PASSWORD: ${VECTORDB_PASSWORD:?set in /srv/supbot/.env}
    # только loopback — наружу порт не смотрит (UFW дополнительно deny)
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - vectordb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supbot -d supbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SUP-2 (#505): локальная LLM. Образ llama.cpp приезжает через прод
  # (ghcr с supbot недоступен): docker save|load — см. README. Модель:
  # models/qwen3-1.7b-q8.gguf (официальный Qwen GGUF, sha сверяется с
  # LFS-oid HF при доставке). Порт только loopback.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: supbot-llm
    restart: unless-stopped
    # #592: -c 8192 давал KV-кэш ~1.8ГБ (fp16, 2 слота) — вместе с весами
    # (1.8ГБ mmap) не влезало в лимит 4g, ядро выселяло страницы модели и
    # каждый токен перечитывался с диска (~0.5 tok/s, iowait 50%).
    # ctx 4096: худший запрос чата (system ~150 + 3 чанка ~900 + вопрос
    # 2000 симв ~600 + max_tokens 400 ≈ 2600 ток) проходит с запасом ×1.5,
    # KV ≈ 0.9ГБ; запросы синхронные по одному; --mlock прибивает веса.
    command: >
      -m /models/qwen3-1.7b-q8.gguf
      --host 0.0.0.0 --port 8080
      -c 4096 --parallel 1 -t 3 --mlock --no-warmup
      --jinja
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./models:/models:ro
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 5g

  # SUP-2 (#505): Chat API + оркестратор (host-network не нужен —
  # ходит в vectordb и llm по хост-loopback через host.docker.internal).
  chatapi:
    build: ./api
    container_name: supbot-chatapi
    restart: unless-stopped
    environment:
      VECTORDB_PASSWORD: ${VECTORDB_PASSWORD:?}
      LLM_URL: http://127.0.0.1:8081
      SUPBOT_ADMIN_SECRET: ${SUPBOT_ADMIN_SECRET:-}
      DIALOG_RETENTION_DAYS: ${DIALOG_RETENTION_DAYS:-90}
    network_mode: host
    volumes:
      - ./models:/models
      - ./ingest:/srv/supbot/ingest:ro
      - ./kb:/srv/supbot/kb:ro
      - ./corpus.json:/srv/supbot/corpus.json
    depends_on:
      - vectordb
      - llm

volumes:
  vectordb_data:
