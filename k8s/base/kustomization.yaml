# Base overlay — raw manifests. Environment-specific overlays live under
# ../overlays/<env>/ and reference this directory via `bases:`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sku-forecasting

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.example.yaml    # replace with Sealed/External Secrets in overlays
  - api.yaml
  - workers.yaml
  - ingress.yaml
  - clusterissuer.yaml      # cluster-scoped; only apply once per cluster
  - networkpolicy.yaml

commonLabels:
  app.kubernetes.io/part-of: sku-forecasting

# Pull the same image tag for api + all workers. Overlays override with
# the real ghcr path + version.
images:
  - name: ghcr.io/your-org/sku-forecasting/sku-api
    newTag: latest
  - name: ghcr.io/your-org/sku-forecasting/sku-worker
    newTag: latest
