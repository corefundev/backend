# ─────────────────────────────────────────────────────────────────────────────
# ingress.yaml — public entry for the API.
#
# Assumes:
#   • ingress-nginx controller installed in the cluster (the most common)
#   • cert-manager installed with a ClusterIssuer named "letsencrypt-prod"
#     (defined in clusterissuer.yaml alongside this file)
#
# For other ingress controllers (Traefik, GCE, etc.), the main thing to
# adjust is the `ingressClassName` + rate-limit annotations.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sku-api
  namespace: sku-forecasting
  annotations:
    # TLS via cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Upload size matches backend MAX_UPLOAD_BYTES (50 MB + headroom)
    nginx.ingress.kubernetes.io/proxy-body-size: "60m"
    # Long upload connections
    nginx.ingress.kubernetes.io/proxy-read-timeout:    "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout:    "120"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    # Stream uploads through without buffering
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # Rate-limit at the ingress layer (per source IP, per-minute).
    # Mirrors our nginx.conf zones — belt-and-suspenders with backend-side
    # limits.
    nginx.ingress.kubernetes.io/limit-rpm:         "600"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # Security headers via snippet (not every ingress allows snippets;
    # drop this if your controller blocks them).
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    # Pass through Retry-After for FastAPI plan-quota 429s
    nginx.ingress.kubernetes.io/proxy-pass-headers: "Retry-After"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.com   # change to your domain; cert-manager provisions
      secretName: sku-api-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
