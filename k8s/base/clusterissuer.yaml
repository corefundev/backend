# ─────────────────────────────────────────────────────────────────────────────
# cert-manager ClusterIssuer — pair with the Ingress above.
#
# ClusterIssuer is cluster-scoped; install it ONCE per cluster, not per
# application. If another team already runs letsencrypt-prod, skip this
# file and reuse theirs.
#
# Prerequisite:  kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: ops@example.com                             # ⚠ change
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
# Staging issuer — use for dev clusters to avoid hitting LE rate limits.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    email: ops@example.com
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
