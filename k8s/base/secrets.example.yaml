# ─────────────────────────────────────────────────────────────────────────────
# Template for application secrets.
#
# ❌ Do NOT commit a real Secret to git. Use one of:
#     • Sealed Secrets (bitnami-labs) — encrypt with cluster pubkey, commit ciphertext
#     • External Secrets Operator reading from Vault / AWS SM / GCP SM
#     • kubectl apply locally from a .env, never checked in
#
# If you're already running the Vault bootstrap from Phase 1 (see
# src/auth/vault_agent.py), you only need VAULT_ADDR + VAULT_ROLE_ID +
# VAULT_SECRET_ID here — everything else is fetched at pod start.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: sku-secrets
  namespace: sku-forecasting
type: Opaque
stringData:
  # Vault AppRole (preferred path)
  VAULT_ADDR:       "http://vault.vault.svc.cluster.local:8200"
  VAULT_ROLE_ID:    "REPLACE_ME"
  VAULT_SECRET_ID:  "REPLACE_ME"   # inject from CI, short TTL
  VAULT_PATH:       "sku-forecasting"

  # Static fallbacks (used only if Vault isn't bootstrapped)
  JWT_SECRET_KEY:       "REPLACE_ME"
  API_KEY:              "REPLACE_ME"
  ADMIN_API_KEY:        "REPLACE_ME"
  MODEL_SIGNING_KEY:    "REPLACE_ME"
  AWS_ACCESS_KEY_ID:    "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  DATABASE_URL:         "postgresql://user:pass@postgres:5432/sku_forecasting"
  BACKUP_PASSPHRASE:    "REPLACE_ME"
  ALERT_WEBHOOK_URL:    ""
