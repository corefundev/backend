apiVersion: v1
kind: Namespace
metadata:
  name: sku-forecasting
  labels:
    # Pod-security standards: "restricted" blocks privileged containers,
    # hostPath mounts, the root user — matches our Dockerfile.worker
    # (non-root `sku` uid 1000) and the hardened sandbox image.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit:   restricted
    pod-security.kubernetes.io/warn:    restricted
