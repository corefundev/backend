# ─────────────────────────────────────────────────────────────────────────────
# sku-api — FastAPI inference service.
#
# HA posture:
#   • replicas: 2 minimum (via Deployment)
#   • maxUnavailable: 0 during rolling updates
#   • PodDisruptionBudget minAvailable: 1 so a node drain never takes
#     down the last replica
#   • topologySpreadConstraints spread across nodes so single-node loss
#     only costs half the capacity
#
# Scaling posture:
#   • HPA on CPU + memory (stock metrics-server)
#   • (optional) custom HPA on queue depth — commented below,
#     requires kube-prometheus-stack + prometheus-adapter
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sku-api
  namespace: sku-forecasting
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sku-api
  namespace: sku-forecasting
  labels: { app: sku-api, component: api }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: sku-api }
  template:
    metadata:
      labels: { app: sku-api, component: api }
      annotations:
        # Prometheus operator scrape (if you prefer ServiceMonitor, see below).
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8000"
        prometheus.io/path:   "/metrics"
    spec:
      serviceAccountName: sku-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser:    1000
        runAsGroup:   1000
        fsGroup:      1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: sku-api }
      containers:
        - name: api
          image: ghcr.io/your-org/sku-forecasting/sku-api:latest   # override in overlay
          imagePullPolicy: Always
          command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
          env:
            - { name: PORT, value: "8000" }
          envFrom:
            - configMapRef: { name: sku-config }
            - secretRef:    { name: sku-secrets }
          ports:
            - { name: http, containerPort: 8000 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "2Gi"   }
          startupProbe:
            # Gives vault-bootstrap + model cache warmup up to 30s x 10 = 5 min
            httpGet: { path: /healthz, port: http }
            failureThreshold: 10
            periodSeconds: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # readyz checks Redis + Postgres → LB drains a bad pod without
            # killing it, so transient DB blips don't cause pod restarts.
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - { name: tmp,        mountPath: /tmp }
            - { name: artifacts,  mountPath: /data/artifacts }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 128Mi }
        - name: artifacts
          # PVC provides shared storage across replicas for any local-mode
          # deploys. In S3 mode this mount is effectively unused but harmless.
          persistentVolumeClaim: { claimName: sku-artifacts }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sku-forecasting
  labels: { app: sku-api }
spec:
  type: ClusterIP
  selector: { app: sku-api }
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sku-api
  namespace: sku-forecasting
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: sku-api }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sku-api
  namespace: sku-forecasting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       sku-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
    # ── Optional: scale on inference request rate ──────────────────────
    # Requires prometheus-adapter exposing forecast_requests_total under
    # custom.metrics.k8s.io/v1beta1. Uncomment after the adapter is deployed.
    #
    # - type: Pods
    #   pods:
    #     metric:
    #       name: forecast_requests_per_second
    #     target:
    #       type: AverageValue
    #       averageValue: "20"
  behavior:
    scaleDown:
      # Don't thrash — only scale down after 5 min of low load, step 1 pod.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      # React fast: double the pods if CPU stays high for 30s.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
---
# PVC used by the Deployment above (exists in S3 mode too, but idle).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sku-artifacts
  namespace: sku-forecasting
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 10Gi
