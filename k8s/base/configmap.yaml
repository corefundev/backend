apiVersion: v1
kind: ConfigMap
metadata:
  name: sku-config
  namespace: sku-forecasting
data:
  # ── App ─────────────────────────────────────────────────────────
  APP_ENV:           "production"
  STORAGE_BACKEND:   "s3"
  ARTIFACTS_DIR:     "/data/artifacts"
  CONFIG_PATH:       "configs/config.yaml"

  # ── S3 zones ────────────────────────────────────────────────────
  S3_ENDPOINT_URL:         "https://s3.beget.com"
  AWS_DEFAULT_REGION:      "ru-1"
  S3_BUCKET:               "sku-forecasting"
  S3_UNTRUSTED_BUCKET:     "sku-forecasting-untrusted"
  S3_QUARANTINE_BUCKET:    "sku-forecasting-quarantine"
  S3_PROCESSED_BUCKET:     ""

  # ── Internal service DNS (populated by Services in this namespace) ──
  REDIS_URL:               "redis://redis:6379"
  CLAMAV_HOST:             "clamav"
  CLAMAV_PORT:             "3310"
  MLFLOW_TRACKING_URI:     "http://mlflow:5000"

  # ── Upload / sandbox limits ─────────────────────────────────────
  MAX_UPLOAD_BYTES:         "52428800"
  SANDBOX_IMAGE:            "sku-forecasting-sandbox"
  SANDBOX_TIMEOUT_SEC:      "30"
  SANDBOX_MEM_LIMIT:        "512m"
  SANDBOX_CPUS:             "1.0"
  SANDBOX_MAX_ROWS:         "5000000"
  SANDBOX_MAX_COLUMNS:      "64"

  # ── CORS / frontend coordination ────────────────────────────────
  FRONTEND_ORIGINS:         "https://web.example.com"

  # ── Sync fallback OFF in prod ───────────────────────────────────
  ALLOW_SYNC_UPLOAD_FALLBACK: "0"
