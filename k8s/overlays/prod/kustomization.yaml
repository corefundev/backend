# Production overlay.
# Apply with:
#   kubectl apply -k k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sku-forecasting

resources:
  - ../../base

# Pin image tags in prod. CD pipeline rewrites these on release.
images:
  - name: ghcr.io/your-org/sku-forecasting/sku-api
    newName: ghcr.io/your-org/sku-forecasting/sku-api
    newTag:  v1.0.0
  - name: ghcr.io/your-org/sku-forecasting/sku-worker
    newName: ghcr.io/your-org/sku-forecasting/sku-worker
    newTag:  v1.0.0

patches:
  # Raise API floor — two replicas is the dev default; prod wants ≥3.
  - target: { kind: HorizontalPodAutoscaler, name: sku-api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20

  # Training: scale further in prod, the jobs are long-lived.
  - target: { kind: HorizontalPodAutoscaler, name: sku-worker-training }
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 16

  # Real domain — override the placeholder from base.
  - target: { kind: Ingress, name: sku-api }
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.example.com
      - op: replace
        path: /spec/rules/0/host
        value: api.example.com
