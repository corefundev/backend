# Ansible config for host-level configuration that lives OUTSIDE /srv/backend
# and therefore cannot be shipped by the app CD pipeline (which only touches
# the compose stack). See ansible/README.md.
[defaults]
inventory = inventory/hosts.yml
# Roles live at ansible/roles, but playbooks are under ansible/playbooks; make
# the role search path explicit (relative to this ansible.cfg) so playbooks
# resolve roles regardless of their own directory.
roles_path = roles
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
# Host config is operator-run, never CI-run — keep diffs visible by default.
nocows = True

[privilege_escalation]
# Writing /etc/docker/daemon.json + restarting docker needs root. become is
# enabled per-play; on prod the deploy user has NO passwordless sudo, so prod
# runs must pass --ask-become-pass (staging has passwordless sudo).
become = False
become_method = sudo
