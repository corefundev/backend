# Inventory for host-level config. Hostnames only — SSH keys are operator-
# local and supplied via --private-key (or ~/.ssh/config), NEVER committed.
# Key/user reference lives in the team's SSH-access notes.
all:
  children:
    # Full app stack + cAdvisor → REQUIRE the overlay2 storage-driver pin
    # (cAdvisor v0.49.1 can't read the Docker 29 containerd snapshotter →
    # 0 container metrics; google/cadvisor#3860).
    backend:
      hosts:
        prod:
          ansible_host: api.testcore.ru
          ansible_user: deploy
          # NOTE: deploy@prod has NO passwordless sudo → run prod with
          # `--ask-become-pass`. (staging deploy@ has passwordless sudo.)
        staging:
          ansible_host: staging.testcore.ru
          ansible_user: deploy
    # Async DR standby. Runs NO cAdvisor, so it stays on the Docker default
    # storage driver (overlayfs) — deliberately NOT in the overlay2-pin play.
    replica:
      hosts:
        db-replica:
          ansible_host: db-replica.testcore.ru
          ansible_user: deploy
    # Static frontend host (root login).
    frontend:
      hosts:
        skusystem:
          ansible_host: skusystem.ru
          ansible_user: root
