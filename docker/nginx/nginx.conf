# Top-level nginx config used by the API reverse proxy container.
#
# Declares the rate-limit zones referenced by api.conf and the upstream
# pointing at the Python API service.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;

    # Hide version from responses + error pages
    server_tokens off;

    # ── Log format + real client IP ─────────────────────────────────────
    # If you sit behind another LB (Cloudflare, etc.) set real_ip_from to
    # its CIDR and uncomment set_real_ip_from directives below.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time ut=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # ── Rate-limit zones ───────────────────────────────────────────────
    # Memory: 10m ≈ 160k unique IPs. Bump if you serve more.
    limit_req_zone $binary_remote_addr zone=auth_rl:10m    rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload_rl:10m  rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_rl:10m     rate=600r/m;
    limit_req_status 429;

    # ── Upstream ───────────────────────────────────────────────────────
    # keepalive pool avoids TCP churn on hot endpoints.
    upstream api_upstream {
        server api:8000;
        keepalive 32;
    }

    # Compression for JSON responses (forecasts can be large).
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript
        application/xml image/svg+xml;

    # Rendered config drops here at container start.
    include /etc/nginx/conf.d/*.conf;
}
