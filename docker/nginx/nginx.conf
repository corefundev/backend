# Top-level nginx config used by the API reverse proxy container.
#
# Declares the rate-limit zones referenced by api.conf and the upstream
# pointing at the Python API service.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;

    # Hide version from responses + error pages
    server_tokens off;

    # ── Log format + real client IP ─────────────────────────────────────
    # If you sit behind another LB (Cloudflare, etc.) set real_ip_from to
    # its CIDR and uncomment set_real_ip_from directives below.
    # MIGR-2 #494: $host in the log — the Phase-2 alias-retirement
    # decision needs per-hostname traffic split (api.sprosly.com vs the
    # legacy testcore alias), and per-vhost visibility is permanently
    # useful ops data.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    'host=$host "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time ut=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # ── DNS resolver — R3-15 / R5-15 structural fix (2026-05-17) ───────
    # Docker's embedded DNS server lives at 127.0.0.11 inside every
    # bridge-network container. Pointing nginx at it + setting a short
    # `valid` TTL forces re-resolution every 10s instead of caching the
    # api container's IP forever at worker startup.
    #
    # Before this fix: any api recreate (CD deploy, autoheal, manual
    # restart) gave api a new bridge-network IP; nginx kept connecting
    # to the OLD IP until either `nginx -s reload` (cd_deploy.sh paper-
    # over) or worker restart. Real incident 2026-05-17 — R4-21 deploy
    # produced a 502 window even with the post-recreate reload, because
    # the reload raced the new container's network attach.
    #
    # `ipv6=off` because Docker DNS returns AAAA for IPv6-enabled
    # networks and nginx will try to connect there first; our bridge
    # is IPv4-only.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ── Rate-limit zones ───────────────────────────────────────────────
    # Memory: 10m ≈ 160k unique IPs. Bump if you serve more.
    limit_req_zone $binary_remote_addr zone=auth_rl:10m    rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload_rl:10m  rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_rl:10m     rate=600r/m;
    limit_req_status 429;

    # ── Upstream ───────────────────────────────────────────────────────
    # R3-15 / R5-15 — switched from `upstream { server api:8000; }` +
    # `proxy_pass http://api_upstream` to per-location `set $api_upstream
    # ...` + `proxy_pass http://$api_upstream`. The variable form forces
    # nginx to consult the resolver above on each request, so a recreated
    # api container is picked up within `valid=10s` automatically.
    #
    # Trade-off: variable proxy_pass disables the `keepalive 32`
    # connection pool to the backend. On a docker-bridge local
    # connection, TCP-setup overhead is sub-ms — well worth losing for
    # automatic IP-change recovery.

    # Compression for JSON responses (forecasts can be large).
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript
        application/xml image/svg+xml;

    # Rendered config drops here at container start.
    include /etc/nginx/conf.d/*.conf;
}
