# ─────────────────────────────────────────────────────────────────────────────
# Staging overlay. Layered on top of:
#   docker-compose.yml + docker-compose.prod.yml + docker-compose.minimal.yml
#   + docker-compose.lockbox.yml
#
# What's different vs prod:
#   • Prometheus scrapes staging.yml (cluster=staging external_label, no
#     replica/ssl-pg-tls scrape jobs).
#   • postgres command override: drops the SSL/CA flags from
#     docker-compose.replication.yml (we don't apply that overlay on
#     staging — there's no replica to encrypt to).
#   • mlflow / sandbox-image services skipped via `profiles: ["disabled"]`
#     trick — they're heavy and not needed for smoke flow.
#
# Same Lockbox-bootstrap pattern as prod: yc-sa-key.json mounted RO,
# alertmanager / postgres-exporter / api / workers / backup all fetch
# their secrets from `sku-forecasting-staging-secrets` at startup.
#
# Compose chain on staging VPS:
#   docker compose --env-file .env \
#       -f docker-compose.yml \
#       -f docker-compose.prod.yml \
#       -f docker-compose.minimal.yml \
#       -f docker-compose.lockbox.yml \
#       -f docker-compose.staging.yml \
#       up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # Postgres — staging doesn't apply replication.yml (no read-replica),
  # but we still want WAL archiving for PITR (#183). Override the
  # postgres command here to enable archive_mode + archive_command.
  # Same wal_archive.sh + S3_BACKUP_* env via Lockbox as prod.
  postgres:
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/wal_archive.sh %p %f
      - -c
      - archive_timeout=60

  # Override prometheus config to use the staging variant — adds
  # cluster=staging external_label and drops scrape jobs that only
  # exist on the prod stack (postgres-replica, ssl-pg-tls).
  prometheus:
    # 2026-05-28 — staging picks the staging variant of prometheus.yml
    # via `--config.file=` instead of via a single-file bind-mount
    # overlay. Single-file mounts pin to the container-start inode; a
    # host-side rsync (tempfile + rename) produces a NEW inode, so the
    # container keeps reading the original file. That R6-5 inode-trap
    # surfaced 2026-05-28 during PR #34 prod-verify when force-recreate
    # was the only way to land the alerts.yml split on staging.
    #
    # The fix: directory-bind `./prometheus/` (so file-content updates
    # propagate via path-resolution-per-syscall) AND put both the
    # prod and staging variants of prometheus.yml inside that directory
    # (`prometheus.yml` and `prometheus.staging.yml`). The command-line
    # `--config.file=` picks which one prometheus loads.
    #
    # alerts.production.yml is also visible inside the staging
    # container (whole dir is mounted), but is NOT loaded because
    # `prometheus.staging.yml`'s `rule_files:` lists only alerts.yml.
    # That single line is the exclusion gate — enforced by
    # `tests/unit/test_alerts_split.py::test_staging_prometheus_yml_loads_only_the_shared_file`.
    command:
      - "--config.file=/etc/prometheus/prometheus.staging.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes: !override
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
      # R10-S6 — the custom prometheus image runs lockbox_bootstrap.sh,
      # which needs the YC SA key. `!override` above drops the mount
      # docker-compose.lockbox.yml adds, so it must be re-listed here.
      # (staging Lockbox has no METRICS_TOKEN → bootstrap injects nothing
      # → entrypoint writes an empty token file; staging /metrics gate
      # stays inert, which is fine for a test env.)
      - ../secrets/yc-sa-key.json:/run/secrets/yc-sa-key.json:ro

  # Heavy services we don't need on staging — disable via a non-default
  # profile so `up -d` (no --profile) skips them.
  mlflow:
    profiles: ["disabled"]

  sandbox-image:
    profiles: ["disabled"]

  airflow-init:
    profiles: ["disabled"]

  airflow-scheduler:
    profiles: ["disabled"]

  airflow-webserver:
    profiles: ["disabled"]

  grafana:
    profiles: ["disabled"]
