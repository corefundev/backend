# Loki single-binary mode — fine for our 2-VPS scale.
# Storage: filesystem-backed (chunks on disk in named volume), tsdb index.
# Retention: 30 days; older chunks compacted away.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Audit R2-21 (2026-05-15): 30d → 90d. Aligns post-incident-forensics
  # window with typical enterprise compliance requirements. audit_log
  # table has its OWN 2-year retention via migration 012 — this is
  # for app/access logs only.
  retention_period: 2160h          # 90 days
  reject_old_samples: true
  reject_old_samples_max_age: 168h # 7 days
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20

compactor:
  working_directory: /loki/retention
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 50

# Single-binary needs query frontend defaults.
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

analytics:
  reporting_enabled: false

# Audit R2-8 / R4 incident 2026-05-17 — Loki ruler ports the three
# log-based security alerts (JWT decode spike, OAuth state rejection,
# Vault bootstrap failure) from prometheus alerts.yml where they
# never parsed (PromQL doesn't support LogQL streams). Rules file is
# mounted at /loki/rules/fake/loki-rules.yml — `fake` is Loki's
# default tenant when auth_enabled=false.
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-tmp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true
  enable_alertmanager_v2: true
  evaluation_interval: 30s
  poll_interval: 1m
