global:
  scrape_interval:     15s
  evaluation_interval: 15s

# Alerting rules (in alerts.yml) evaluate against freshly scraped metrics.
# Alertmanager fans out to Slack / PagerDuty / email via its own config.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "sku-forecasting-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Worker queues — rq exposes metrics only when the rq-exporter sidecar
  # is running. Optional; rule referencing rq_* no-ops if no data.
  - job_name: "rq-exporter"
    static_configs:
      - targets: ["rq-exporter:9726"]
    honor_labels: true
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "^go_|^process_"
        action: drop

  # Postgres — via postgres_exporter
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # MinIO exposes its own Prometheus endpoint
  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
