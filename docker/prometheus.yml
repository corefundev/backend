global:
  scrape_interval:     15s
  evaluation_interval: 15s
  # external_labels propagate to every metric, alert and federation
  # sample. Lets alertmanager group by cluster + lets us route
  # staging alerts visibly differently from prod (see template in
  # alertmanager.yml). Override to "staging" via prometheus.staging.yml.
  external_labels:
    cluster: prod

# Alerting rules (in alerts.yml) evaluate against freshly scraped metrics.
# Alertmanager fans out to Slack / PagerDuty / email via its own config.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "sku-forecasting-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Worker queues — rq exposes metrics only when the rq-exporter sidecar
  # is running. Optional; rule referencing rq_* no-ops if no data.
  - job_name: "rq-exporter"
    static_configs:
      - targets: ["rq-exporter:9726"]
    honor_labels: true
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "^go_|^process_"
        action: drop

  # Postgres — via postgres_exporter (LOCAL: primary's own DB)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # SSL cert expiry probing — ssl-exporter upgrades a TCP connection
  # to the replication endpoint via PostgreSQL StartTLS, then exposes
  # `ssl_cert_not_after` (unix-time of cert's Not After). Targets are
  # TCP host:port; module name picks the prober config in
  # docker/ssl-exporter.yml.
  - job_name: "ssl-pg-tls"
    metrics_path: /probe
    params:
      module: [postgres]
    static_configs:
      - targets:
          - "postgres:5432"             # primary's postgres (in-stack)
          # Replica doesn't terminate TLS itself — it CONSUMES the
          # primary's cert. So we only probe the primary endpoint here;
          # one cert, one alert.
    relabel_configs:
      - source_labels: [__address__]
        target_label:  __param_target
      - source_labels: [__param_target]
        target_label:  instance
      - target_label: __address__
        replacement:   ssl-exporter:9219
    scrape_interval: 1m

  # Postgres — replica VPS (db-replica.testcore.ru / 212.8.226.233).
  # Replica runs its own postgres-exporter sidecar (see
  # docker/docker-compose.replica.yml). Replica-firewall sidecar there
  # restricts source IP to this primary, so anyone else gets DROPed.
  # 15s scrape interval is fine for lag tracking; pg_replication_slots
  # + pg_stat_wal_receiver expose written/flushed/replayed LSNs which
  # let Grafana plot lag in MB.
  - job_name: "postgres-replica"
    static_configs:
      - targets: ["212.8.226.233:9187"]
        labels:
          replica: "1"
          host:    "db-replica.testcore.ru"
    scrape_interval: 15s
    scrape_timeout:  10s
  # NOTE: minio scrape removed — production uses Beget S3, not MinIO.
  # The corresponding MinIO alerts in alerts.yml are likewise harmless
  # (they reference metrics that never get produced).

  # Pushgateway — receives metrics from batch jobs (backup.sh).
  # honor_labels: true so the `instance` / `job` labels pushed by the
  # job survive (otherwise prometheus overwrites them with the scrape
  # target's pushgateway:9091).
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
