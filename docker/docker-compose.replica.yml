# Standby PostgreSQL — streaming replica of api.testcore.ru's primary.
#
# Bring-up flow (run scripts/bootstrap_replica.sh once):
#   1. pg_basebackup from primary into the named volume (binds host
#      dir /srv/postgres-replica/data → /var/lib/postgresql/data).
#   2. Bootstrap script writes standby.signal + postgresql.auto.conf with
#      primary_conninfo + primary_slot_name into the data dir.
#   3. `docker compose -f docker-compose.replica.yml up -d` starts this
#      service. The container detects standby.signal and enters recovery
#      mode, pulling WAL via the streaming connection from the primary.
#
# Promotion (DR scenario, primary is gone for good):
#   docker exec -it postgres-replica pg_ctl promote
#   The replica becomes a standalone primary; standby.signal is removed.
#   Then point app's DATABASE_URL at the replica and ALTER existing slot.
#
# Why no `ports: ["5432:5432"]`:
#   The replica is read-only and consumed by app code that lives on the
#   PRIMARY VPS via DATABASE_URL_REPLICA — so it's reached over the
#   internet on the docker host port. We bind to 127.0.0.1 only at the
#   host level and rely on UFW + Docker iptables for outside exposure.
#   When (if) we wire a read-only path, expose 5432 explicitly with a
#   tightly-scoped UFW rule allowing only the primary VPS.

services:
  postgres-replica:
    image: postgres:16-alpine
    container_name: postgres-replica
    restart: unless-stopped
    # Standby mode is signaled by the presence of standby.signal in the
    # data directory — the bootstrap script writes that file. The image's
    # entrypoint sees the file and skips initdb.
    environment:
      # POSTGRES_PASSWORD is required by the entrypoint script even though
      # we restored the data dir from pg_basebackup (entrypoint validates
      # env presence before checking PGDATA contents). Set it to anything;
      # it's not actually applied because the cluster is already initialized.
      POSTGRES_PASSWORD: ignored-already-initialized
    volumes:
      - /srv/postgres-replica/data:/var/lib/postgresql/data
      # Public cert from primary, used to verify the WAL stream is
      # really coming from our primary (sslmode=verify-ca). Populated
      # by scripts/configure_replica_ssl.sh after the primary's TLS
      # rollout. Read-only — replica never writes here.
      - /srv/postgres-replica/ssl:/etc/ssl/pg:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sku -d sku_forecasting"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Bind only to localhost on the replica VPS for now. Add a second
    # ports rule (or change to 0.0.0.0:5432:5432) when the primary VPS
    # needs to query us — guarded by UFW.
    ports:
      - "127.0.0.1:5432:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Metrics exporter ────────────────────────────────────────────
  # Exposes pg_stat_* + pg_replication_slots + pg_stat_wal_receiver
  # for Prometheus scraping. Connects as `replicator` (which has
  # pg_monitor role granted by setup_replication_primary.sh — replicates
  # over to here automatically).
  #
  # The DATA_SOURCE_NAME password is supplied via REPLICATION_PASSWORD
  # env on the host (set when running `docker compose up`). Same secret
  # bootstrap_replica.sh / configure_replica_ssl.sh use.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://replicator:${REPLICATION_PASSWORD}@postgres-replica:5432/sku_forecasting?sslmode=disable"
    depends_on:
      postgres-replica:
        condition: service_healthy
    # Exposed on the public interface so primary's Prometheus can
    # scrape it. The replica-firewall sidecar below restricts source
    # IP to PRIMARY_CIDR only — anyone else gets DROP.
    ports:
      - "9187:9187"
    healthcheck:
      test: ["CMD", "/postgres_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Replica-side firewall sidecar ───────────────────────────────
  # Mirrors the pg-firewall pattern from primary's
  # docker-compose.replication.yml. Restricts incoming TCP/9187
  # to PRIMARY_CIDR + localhost; everything else gets DROPed in
  # DOCKER-USER chain. Self-heals every hour.
  replica-firewall:
    image: alpine:3.20
    container_name: replica-firewall
    privileged: true
    network_mode: host
    restart: always
    environment:
      PRIMARY_CIDR: "${PRIMARY_CIDR:-62.217.181.157/32}"
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache iptables >/dev/null
        ensure_rule() {
            while iptables -C DOCKER-USER "$$@" 2>/dev/null; do
                iptables -D DOCKER-USER "$$@"
            done
            iptables -I DOCKER-USER 1 "$$@"
        }
        # Final order (top-of-chain insert pushes earlier rules down):
        #   1. ACCEPT primary
        #   2. ACCEPT localhost
        #   3. DROP everyone
        ensure_rule -p tcp --dport 9187 -j DROP \
            -m comment --comment "exporter-fw-deny"
        ensure_rule -p tcp --dport 9187 -s 127.0.0.1/8 -j ACCEPT \
            -m comment --comment "exporter-fw-localhost"
        ensure_rule -p tcp --dport 9187 -s "$$PRIMARY_CIDR" -j ACCEPT \
            -m comment --comment "exporter-fw-primary"
        echo "replica-firewall: rules applied for PRIMARY_CIDR=$$PRIMARY_CIDR"
        iptables -L DOCKER-USER -n -v --line-numbers | head -10
        # Hourly re-apply self-heals against external table flush
        # (manual ops, dockerd reload).
        while true; do
            sleep 3600
            ensure_rule -p tcp --dport 9187 -j DROP -m comment --comment "exporter-fw-deny"
            ensure_rule -p tcp --dport 9187 -s 127.0.0.1/8 -j ACCEPT -m comment --comment "exporter-fw-localhost"
            ensure_rule -p tcp --dport 9187 -s "$$PRIMARY_CIDR" -j ACCEPT -m comment --comment "exporter-fw-primary"
        done
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
