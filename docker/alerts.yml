# Prometheus alerting rules for the SKU Forecasting platform.
#
# Philosophy
# ──────────
#  • Each alert has a severity (critical | warning) and a runbook_url —
#    keep runbooks short, linked here and nowhere else.
#  • `for:` gives enough time to filter flaps; don't wake on-call for a
#    single stuck request.
#  • Labels `team: forecasting` route to the right Alertmanager receiver.
#
# Metrics we rely on come from src/api/main.py:
#   forecast_requests_total{client_id, status}
#   forecast_latency_seconds_bucket{client_id}
#   fallback_model_used_total{client_id}

groups:

  - name: api-availability
    rules:
      - alert: ApiDown
        # `up` is 1 when Prometheus successfully scraped the target in
        # the last window, 0 otherwise. Missing target for 2 min → page.
        expr:  up{job="sku-forecasting-api"} == 0
        for:   2m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "API /metrics is unreachable for 2m"
          description: "No successful scrape of api:8000 since {{ $value }}. Check container health, /readyz."

      - alert: ApiHighErrorRate
        # ratio of error responses to all responses in the last 5m
        expr: |
          (sum(rate(forecast_requests_total{status="error"}[5m]))
           /
           clamp_min(sum(rate(forecast_requests_total[5m])), 0.001))
          > 0.05
        for:   10m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "API error rate >5% for 10m"
          description: "Current error ratio is {{ $value | humanizePercentage }}."

      - alert: ApiPredictSlow
        # p95 latency above 2s sustained
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(forecast_latency_seconds_bucket[10m]))
          ) > 2
        for:   15m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Predict p95 latency >2s (15m)"
          description: "p95 = {{ $value }}s. Check model load / feature build path."

      - alert: FallbackModelInUse
        # Fallback firing more than 5x/min means the primary model is
        # broken, not just warming up.
        expr:  rate(fallback_model_used_total[5m]) > 5/60
        for:   10m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Fallback model active for 10m"
          description: "Clients: check primary model load logs."

  - name: workers
    rules:
      - alert: WorkerQueueBacklog
        # rq-exporter exposes rq_scheduler_jobs + rq_queue_jobs{status="queued"}
        expr: |
          sum by (queue) (rq_queue_jobs{status="queued"}) > 100
        for:   20m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Queue {{ $labels.queue }} has >100 pending jobs"
          description: "Consider scaling the matching worker."

  - name: storage
    rules:
      - alert: MinioDiskFillingUp
        expr:  minio_cluster_disk_free_bytes / minio_cluster_disk_total_bytes < 0.15
        for:   30m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "MinIO free space <15%"
          description: "Free = {{ $value | humanizePercentage }}. Prune old uploads / backups."

      - alert: MinioDiskCritical
        expr:  minio_cluster_disk_free_bytes / minio_cluster_disk_total_bytes < 0.05
        for:   10m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "MinIO free space <5%"

  - name: database
    rules:
      - alert: PostgresDown
        expr:  up{job="postgres"} == 0
        for:   2m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "Postgres exporter unreachable"

      - alert: PostgresConnectionsHigh
        expr: |
          pg_stat_activity_count / pg_settings_max_connections > 0.8
        for:   10m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Postgres connections >80% of max_connections"

      # The self-signed cert that backs the primary→replica WAL TLS
      # is valid 1 year. Fire well before expiry so rotation can be
      # done in business hours, not at 3am when streaming dies.
      - alert: PgReplicationCertExpiringSoon
        expr: |
          (ssl_cert_not_after{job="ssl-pg-tls"} - time()) / 86400 < 30
        for:   1h
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "PG replication TLS cert expires in <30 days ({{ $value | printf \"%.0f\" }} days left)"
          description: "Self-signed cert at /srv/backend/secrets/pg-ssl/server.crt expires soon. Rotate via the Setup PG Replication (Primary) workflow with force_regen_cert=true; runbook in deploy/REPLICATION.md → 'SSL cert rotation'."

      - alert: PgReplicationCertExpired
        expr: |
          (ssl_cert_not_after{job="ssl-pg-tls"} - time()) / 86400 < 0
        for:   5m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "PG replication TLS cert HAS EXPIRED — replica streaming will break on next reconnect"
          description: "Rotate immediately. Runbook in deploy/REPLICATION.md."

  - name: replication
    rules:
      - alert: PgReplicaLagHigh
        # If the replica falls more than 60s behind primary, alert.
        # Lag in seconds = now - last replayed transaction's timestamp.
        expr: |
          pg_replication_lag_seconds{job="postgres-replica"} > 60
        for:   10m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Replica is {{ $value | printf \"%.0f\" }}s behind primary"
          description: "Check pg_stat_wal_receiver on replica + pg_stat_replication on primary. Network or WAL apply bottleneck."

      - alert: PgReplicaWalReceiverDown
        # Replica disconnected from primary's WAL stream entirely.
        # pg_replication_is_replica=1 + pg_up=1 should always coincide
        # with active wal_receiver. If pg_up flips to 0 here, the
        # exporter itself is down (different alert: ReplicaExporterDown).
        expr: |
          pg_up{job="postgres-replica"} == 0
        for:   2m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "Replica's postgres-exporter unreachable for 2m"
          description: "Either replica VPS is down, replica-firewall sidecar dropped its rules, or the exporter container died. SSH to db-replica.testcore.ru and inspect."

  - name: slo
    rules:
      # SLO: 99.9% availability of /forecast endpoint over 30 days.
      # Error budget = 0.1% = 43.2 min/30d.
      #
      # Multi-window burn-rate alerting per Google SRE pattern:
      # alert when current error rate would consume the budget faster
      # than the SLO window allows.
      #
      # Fast burn (14.4×): if current 1h error rate keeps up, the
      #   monthly budget is consumed in 30d/14.4 = ≈2 days. Page now.
      # Slow burn (6×):    if current 6h error rate keeps up, budget
      #   is gone in 30d/6 = 5 days. Page within hours.
      #
      # Both fire only when BOTH the long-window AND short-window burn
      # rates are over threshold (so a transient spike doesn't page).
      - alert: SloErrorBudgetFastBurn
        expr: |
          (
            sum(rate(forecast_requests_total{status="error"}[1h]))
            /
            clamp_min(sum(rate(forecast_requests_total[1h])), 0.001)
          ) > 0.0144
          and
          (
            sum(rate(forecast_requests_total{status="error"}[5m]))
            /
            clamp_min(sum(rate(forecast_requests_total[5m])), 0.001)
          ) > 0.0144
        for: 2m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "SLO error budget burning fast (14.4× — 2-day burn-down)"
          description: "Forecast endpoint error rate >1.44% sustained for 1h AND 5m windows. At this rate the 30-day error budget is gone in 2 days. Investigate immediately."

      - alert: SloErrorBudgetSlowBurn
        expr: |
          (
            sum(rate(forecast_requests_total{status="error"}[6h]))
            /
            clamp_min(sum(rate(forecast_requests_total[6h])), 0.001)
          ) > 0.006
          and
          (
            sum(rate(forecast_requests_total{status="error"}[30m]))
            /
            clamp_min(sum(rate(forecast_requests_total[30m])), 0.001)
          ) > 0.006
        for: 15m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "SLO error budget burning slowly (6× — 5-day burn-down)"
          description: "Forecast endpoint error rate >0.6% sustained for 6h AND 30m windows. At this rate the 30-day error budget is gone in 5 days. Diagnose during business hours."

  - name: backup
    rules:
      # backup.sh pushes sku_backup_last_success_timestamp_seconds to
      # pushgateway after successful upload. Cron runs at 02:10 UTC,
      # so any healthy day the metric is < 24h old. 25h threshold gives
      # 1h slack for cron drift / upload time / scrape delay.
      #
      # Two failure modes covered by the same expression:
      #   • metric exists but is stale  → backup ran, then stopped running
      #   • metric absent (`absent()`)  → never ran, OR pushgateway was
      #     wiped, OR backup script never reached the push step
      - alert: BackupStale
        expr: |
          (time() - sku_backup_last_success_timestamp_seconds > 25 * 3600)
            or absent(sku_backup_last_success_timestamp_seconds)
        for:   15m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "Postgres backup is stale or missing (>25h)"
          description: "No fresh dump pushed to pushgateway in 25h. Trigger the Diagnose Backup → Restart Backup workflows."

      # base_backup.sh runs weekly (Sun 03:30 UTC) — pushes
      # sku_base_backup_last_success_timestamp_seconds. Without a fresh
      # base, PITR's restore window starts shrinking: WAL archived
      # before the last surviving base becomes useless. 9d threshold
      # gives 7d cadence + 2d slack for one missed run before alerting.
      # 16d would mean two consecutive failures — by then PITR is at
      # serious risk of losing its restore window when WAL retention
      # (14d, see scripts/init_s3_lifecycle.sh) catches up.
      - alert: BaseBackupStale
        expr: |
          (time() - sku_base_backup_last_success_timestamp_seconds > 9 * 86400)
            or absent(sku_base_backup_last_success_timestamp_seconds)
        for:   1h
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "Postgres weekly base backup stale or missing (>9d)"
          description: "pg_basebackup hasn't pushed a success ts in 9 days. PITR window will start shrinking once WAL retention (14d) catches up. Check backup container cron + S3 base/ prefix."

  - name: container-lifecycle
    rules:
      # Crash loop — `container_start_time_seconds` changes on every
      # container start; if it changes >5 times in 15min that's a clear
      # restart-loop. Would have caught the mlflow OOM episode
      # (RestartCount=10458 over 3d before mem_limit 1g→2g fix).
      - alert: ContainerRestartLoop
        expr: |
          count by (name) (changes(container_start_time_seconds{name=~"docker-.+"}[15m])) > 5
        for:   5m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "Container {{ $labels.name }} restart-looping (>5 starts/15m)"
          description: "Container is restarting too fast for the unless-stopped policy to be normal recovery. Common causes: OOM (check mem_limit + actual usage), bad config, dependency unhealthy. ExitCode=0 + Docker restart-policy hides this from `docker inspect` — only metric-side detection works."

      # OOM-killed — cAdvisor exposes `container_oom_events_total`.
      # Counter resets on container recreate, so alert on rate, not value.
      - alert: ContainerOOMKilled
        expr: |
          increase(container_oom_events_total[10m]) > 0
        for:   1m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Container {{ $labels.name }} OOM-killed"
          description: "Out-of-memory kill in last 10m. Bump mem_limit or investigate leak."

  - name: monitoring-pipeline
    rules:
      # Pushgateway is a single point for all push-based metrics
      # (backup, base_backup). If it's down, BackupStale and
      # BaseBackupStale go silent — and if pushgateway dies right after
      # a successful backup push, we'd never know subsequent pushes
      # failed because the metric stays "fresh" until pushgateway loses
      # state. Fire on any down state immediately.
      - alert: PushgatewayDown
        expr:  up{job="pushgateway"} == 0
        for:   5m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "Pushgateway is down — batch metrics blind"
          description: "BackupStale / BaseBackupStale / future push-metrics depend on this. Restart docker-pushgateway-1 and verify it accepts pushes."

      # Loki rejecting log entries — promtail re-tailing old logs after
      # restart, ingester OOM, network partition. Metric:
      # `loki_distributor_bytes_dropped_total`.
      - alert: LokiPushFailure
        expr: |
          rate(loki_distributor_bytes_dropped_total[5m]) > 0
        for:   10m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Loki dropping log bytes for 10m"
          description: "{{ $value | humanize }}B/s being rejected. Check promtail positions persistence (#198 fix) and loki ingester health."

  - name: certificates
    rules:
      # LE certs for public endpoints. ssl-exporter `ssl_cert_not_after`
      # is unix-timestamp seconds. <14d → warn, <3d → critical.
      - alert: LeCertExpiringSoon
        expr: |
          (ssl_cert_not_after{job="ssl-https"} - time()) / 86400 < 14
        for:   1h
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "LE cert {{ $labels.instance }} expires in <14d ({{ $value | printf \"%.1f\" }}d)"
          description: "Certbot should auto-renew at 30d remaining. If we're at 14d, cron isn't firing or renewal is failing. Inspect certbot container logs."

      - alert: LeCertExpiringCritical
        expr: |
          (ssl_cert_not_after{job="ssl-https"} - time()) / 86400 < 3
        for:   15m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "LE cert {{ $labels.instance }} expires in <3 DAYS"
          description: "User-facing TLS will break. Run certbot manually now and check renewal cron."

  - name: host-resources
    rules:
      # Postgres pg_wal/ lives on the host's data volume. If S3 archive
      # fails (e.g. Beget S3 outage), WAL backs up locally — uncapped.
      # Filling the volume = postgres stops accepting writes = api error
      # surge. Alert at 80% so ops has time to either restore S3 access
      # or evacuate WAL manually before postgres locks up.
      - alert: HostDiskFillingUp
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint="/"}
                    / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint="/"})
          > 80
        for:   15m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Host disk usage >80% on {{ $labels.instance }}"
          description: "Filesystem at {{ $labels.mountpoint }} is {{ $value | printf \"%.1f\" }}% full. Likely cause: pg_wal backup if S3 archive_command failing, or container logs / docker images bloat. Run `docker system df` and check S3 archive health."

      # Critical at 92% — postgres starts to fail at ~95%.
      - alert: HostDiskCritical
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint="/"}
                    / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint="/"})
          > 92
        for:   5m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "Host disk usage >92% on {{ $labels.instance }} — postgres at risk"
          description: "Postgres will stop accepting writes when the disk fills. Evacuate large files NOW. {{ $value | printf \"%.1f\" }}% used."

      # Sustained memory pressure — a leaking container can OOM-kill
      # neighbours when host memory fills.
      - alert: HostMemoryHigh
        expr: |
          100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
          > 90
        for:   30m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Host memory >90% used for 30m on {{ $labels.instance }}"
          description: "{{ $value | printf \"%.1f\" }}% used. Check for memory-leak suspects (mlflow has had crash loops; api / worker can spike during training)."
