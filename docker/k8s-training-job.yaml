apiVersion: batch/v1
kind: Job
metadata:
  name: sku-training-{{ client_id }}
  namespace: forecasting
  labels:
    app: sku-forecasting
    component: training
    client: "{{ client_id }}"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: sku-forecasting
        component: training
        client: "{{ client_id }}"
    spec:
      restartPolicy: Never
      # Pod-level security: run as non-root, drop all Linux capabilities,
      # block privilege escalation. The worker image must be built with a
      # user matching this UID (Dockerfile.worker creates `sku` uid 1000).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: trainer
          image: sku-forecasting-worker:latest
          imagePullPolicy: Always       # always refresh; don't cache "latest"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - python
            - -m
            - src.pipeline.train
            - --data
            - /data/raw/{{ client_id }}/data.csv
            - --config
            - /configs/config.yaml
            - --client
            - "{{ client_id }}"
            - --output
            - /data/artifacts
          env:
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: tracking_uri
            - name: PYTHONPATH
              value: /app
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: data-volume
              mountPath: /data
            - name: config-volume
              mountPath: /configs
            # readOnlyRootFilesystem requires an explicit writable mount
            # for anything that needs to write (logs, temp files, ML libs
            # that memmap models into /tmp).
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/sku
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: sku-data-pvc
        - name: config-volume
          configMap:
            name: sku-forecasting-config
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: home
          emptyDir:
            sizeLimit: 1Gi
      # Isolate client workloads
      nodeSelector:
        workload: forecasting
      tolerations:
        - key: "forecasting"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
---
apiVersion: v1
kind: Namespace
metadata:
  name: forecasting
  labels:
    app: sku-forecasting
