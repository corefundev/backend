global:
  scrape_interval:     15s
  evaluation_interval: 15s
  # external_labels propagate to every metric, alert and federation
  # sample. Lets alertmanager group by cluster + lets us route
  # staging alerts visibly differently from prod (see template in
  # alertmanager.yml). Override to "staging" via prometheus.staging.yml.
  external_labels:
    cluster: prod

# Alerting rules (in alerts.yml) evaluate against freshly scraped metrics.
# Alertmanager fans out to Slack / PagerDuty / email via its own config.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml
  # Prod-only rules (postgres-replica, ssl-pg-tls cert expiry, off-region
  # backup mirror staleness). Staging mounts the prometheus/ directory via
  # `docker-compose.staging.yml`'s `!override volumes:` which lists only
  # `alerts.yml` — so this file is automatically excluded on staging even
  # though it lives in the same directory. See alerts.production.yml
  # header for the design rationale.
  - /etc/prometheus/alerts.production.yml

scrape_configs:
  - job_name: "sku-forecasting-api"
    # R10-S6 — scrape /metrics with a bearer token. The api gate
    # (_require_metrics_token) enforces it only once METRICS_TOKEN is
    # set on the api; until then the token file is empty and the api
    # ignores the header, so this is rollout-safe. The file is provided
    # by the /run/metrics_token bind-mount (docker-compose.yml) — it
    # always exists in the prometheus container spec, so this config
    # never references a missing path.
    authorization:
      type: Bearer
      credentials_file: /run/metrics_token
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Worker queues — rq exposes metrics only when the rq-exporter sidecar
  # is running. Optional; rule referencing rq_* no-ops if no data.
  - job_name: "rq-exporter"
    static_configs:
      - targets: ["rq-exporter:9726"]
    honor_labels: true
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "^go_|^process_"
        action: drop

  # Postgres — via postgres_exporter (LOCAL: primary's own DB)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # SSL cert expiry probing — ssl-exporter upgrades a TCP connection
  # to the replication endpoint via PostgreSQL StartTLS, then exposes
  # `ssl_cert_not_after` (unix-time of cert's Not After). Targets are
  # TCP host:port; module name picks the prober config in
  # docker/ssl-exporter.yml.
  - job_name: "ssl-pg-tls"
    metrics_path: /probe
    params:
      module: [postgres]
    static_configs:
      - targets:
          - "postgres:5432"             # primary's postgres (in-stack)
          # Replica doesn't terminate TLS itself — it CONSUMES the
          # primary's cert. So we only probe the primary endpoint here;
          # one cert, one alert.
    relabel_configs:
      - source_labels: [__address__]
        target_label:  __param_target
      - source_labels: [__param_target]
        target_label:  instance
      - target_label: __address__
        replacement:   ssl-exporter:9219
    scrape_interval: 1m

  # Postgres — replica VPS (db-replica.testcore.ru, default IP
  # 212.8.226.233). Replica runs its own postgres-exporter sidecar
  # (see docker/docker-compose.replica.yml). Replica-firewall sidecar
  # there restricts source IP to this primary, so anyone else gets
  # DROPed.
  #
  # IMPORTANT: the host part of the target is the docker-compose
  # `extra_hosts` alias `postgres-replica.internal`, NOT a hardcoded
  # IP. The real IP lives in env `REPLICA_EXPORTER_HOST` so it can
  # rotate on failover without a code change. See compose.yml for
  # the alias declaration.
  - job_name: "postgres-replica"
    static_configs:
      - targets: ["postgres-replica.internal:9187"]
        labels:
          replica: "1"
          host:    "db-replica.testcore.ru"
    scrape_interval: 15s
    scrape_timeout:  10s
  # NOTE: minio scrape removed — production uses Beget S3, not MinIO.
  # The corresponding MinIO alerts in alerts.yml are likewise harmless
  # (they reference metrics that never get produced).

  # Pushgateway — receives metrics from batch jobs (backup.sh).
  # honor_labels: true so the `instance` / `job` labels pushed by the
  # job survive (otherwise prometheus overwrites them with the scrape
  # target's pushgateway:9091).
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  # node_exporter — host filesystem / memory / cpu metrics (#198).
  # Runs on the docker network with pid:host so it sees real host
  # processes/filesystems via /host/* binds. Reachable as
  # `node-exporter:9100` from the prometheus service.
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "api.testcore.ru"

  # cAdvisor — per-container start_time / cpu / mem (#203 alerts).
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Loki internal metrics — distributor lines/bytes received vs dropped.
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  # Promtail scrape — external health check (image has no tools for
  # docker-side HC). `up{job="promtail"}` is the "is it reachable" signal.
  - job_name: "promtail"
    static_configs:
      - targets: ["promtail:9080"]

  # ssl-exporter https probes — LE cert TTL for public endpoints.
  - job_name: "ssl-https"
    metrics_path: /probe
    params:
      module: [https]
    static_configs:
      - targets:
          - "https://api.testcore.ru"
          - "https://skusystem.ru"
          # MIGR-1 #424 Phase 3: sprosly.com hosts (one SAN cert on the
          # frontend + the expanded api cert). skusystem.ru stays probed
          # through the transition — its cert keeps renewing for the 301
          # host.
          - "https://api.sprosly.com"
          - "https://sprosly.com"
          - "https://www.sprosly.com"
          - "https://news.sprosly.com"
          - "https://help.sprosly.com"
          # APP-1 #495: рабочая зона
          - "https://app.sprosly.com"
    relabel_configs:
      - source_labels: [__address__]
        target_label:  __param_target
      - source_labels: [__param_target]
        target_label:  instance
      - target_label: __address__
        replacement:   ssl-exporter:9219
    scrape_interval: 5m
