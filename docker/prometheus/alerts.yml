# Prometheus alerting rules for the SKU Forecasting platform.
#
# Philosophy
# ──────────
#  • Each alert has a severity (critical | warning) and a runbook_url —
#    keep runbooks short, linked here and nowhere else.
#  • `for:` gives enough time to filter flaps; don't wake on-call for a
#    single stuck request.
#  • Labels `team: forecasting` route to the right Alertmanager receiver.
#
# Metrics we rely on come from src/api/main.py:
#   forecast_requests_total{client_id, status}
#   forecast_latency_seconds_bucket{client_id}
#   fallback_model_used_total{client_id}

groups:

  - name: api-availability
    rules:
      - alert: ApiDown
        # `up` is 1 when Prometheus successfully scraped the target in
        # the last window, 0 otherwise. Missing target for 2 min → page.
        expr:  up{job="sku-forecasting-api"} == 0
        for:   2m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "API /metrics is unreachable for 2m"
          description: "No successful scrape of api:8000 since {{ $value }}. Check container health, /readyz."

      - alert: ApiHighErrorRate
        # ratio of error responses to all responses in the last 5m
        expr: |
          (sum(rate(forecast_requests_total{status="error"}[5m]))
           /
           clamp_min(sum(rate(forecast_requests_total[5m])), 0.001))
          > 0.05
        for:   10m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "API error rate >5% for 10m"
          description: "Current error ratio is {{ $value | humanizePercentage }}."

      - alert: ApiPredictSlow
        # p95 latency above 2s sustained
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(forecast_latency_seconds_bucket[10m]))
          ) > 2
        for:   15m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Predict p95 latency >2s (15m)"
          description: "p95 = {{ $value }}s. Check model load / feature build path."

      - alert: FallbackModelInUse
        # Fallback firing more than 5x/min means the primary model is
        # broken, not just warming up.
        expr:  rate(fallback_model_used_total[5m]) > 5/60
        for:   10m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Fallback model active for 10m"
          description: "Clients: check primary model load logs."

  - name: workers
    rules:
      - alert: WorkerQueueBacklog
        # rq-exporter v3.1.0 (mdawar/rq-exporter image we deploy) emits
        # `rq_jobs{queue=...,status=...}` — NOT `rq_queue_jobs`. The
        # original expression referenced a phantom metric; alert silent
        # since deploy. Caught 2026-05-27 in the R10 alert-audit pass,
        # same phantom-metric class as R5-12 RqWorkerSilent / R5-13
        # PgReplicaLagHigh. Verified against prod tsdb: rq_jobs series
        # carry both `queue` (sku-scan, sku-process, ...) and `status`
        # (queued, started, finished, failed).
        expr: |
          sum by (queue) (rq_jobs{status="queued"}) > 100
        for:   20m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Queue {{ $labels.queue }} has >100 pending jobs"
          description: "Consider scaling the matching worker."

  # NOTE: MinIO alerts removed 2026-05-13 (audit M6). Production uses
  # Beget S3 for backups + Beget S3 for the four data zones, not MinIO.
  # The corresponding scrape job was already removed from prometheus.yml
  # (see comment line 86); the rules here referenced metrics that never
  # got produced. S3 bucket fullness is monitored via Beget's own panel
  # + the BackupStale/BaseBackupStale alerts which fire if push to S3
  # actually stops working — that's the failure mode we care about.

  - name: database
    rules:
      - alert: PostgresDown
        expr:  up{job="postgres"} == 0
        for:   2m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "Postgres exporter unreachable"

      - alert: PostgresConnectionsHigh
        expr: |
          pg_stat_activity_count / pg_settings_max_connections > 0.8
        for:   10m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Postgres connections >80% of max_connections"

      # NOTE: PgReplicationCertExpiringSoon + PgReplicationCertExpired
      # (TLS cert backing primary→replica WAL streaming) and the entire
      # `replication` group (PgReplicaLagHigh, PgReplicaWalReceiverDown,
      # PgReplicaScrapeFailed) live in alerts.production.yml — those
      # metrics are produced only on prod (postgres-replica scrape +
      # ssl-pg-tls scrape are prod-cluster-only by design). Split out
      # of this file 2026-05-27; design + decisions in the header of
      # alerts.production.yml.

  - name: slo
    rules:
      # SLO: 99.9% availability of /forecast endpoint over 30 days.
      # Error budget = 0.1% = 43.2 min/30d.
      #
      # Multi-window burn-rate alerting per Google SRE pattern:
      # alert when current error rate would consume the budget faster
      # than the SLO window allows.
      #
      # Fast burn (14.4×): if current 1h error rate keeps up, the
      #   monthly budget is consumed in 30d/14.4 = ≈2 days. Page now.
      # Slow burn (6×):    if current 6h error rate keeps up, budget
      #   is gone in 30d/6 = 5 days. Page within hours.
      #
      # Both fire only when BOTH the long-window AND short-window burn
      # rates are over threshold (so a transient spike doesn't page).
      - alert: SloErrorBudgetFastBurn
        expr: |
          (
            sum(rate(forecast_requests_total{status="error"}[1h]))
            /
            clamp_min(sum(rate(forecast_requests_total[1h])), 0.001)
          ) > 0.0144
          and
          (
            sum(rate(forecast_requests_total{status="error"}[5m]))
            /
            clamp_min(sum(rate(forecast_requests_total[5m])), 0.001)
          ) > 0.0144
        for: 2m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "SLO error budget burning fast (14.4× — 2-day burn-down)"
          description: "Forecast endpoint error rate >1.44% sustained for 1h AND 5m windows. At this rate the 30-day error budget is gone in 2 days. Investigate immediately."

      - alert: SloErrorBudgetSlowBurn
        expr: |
          (
            sum(rate(forecast_requests_total{status="error"}[6h]))
            /
            clamp_min(sum(rate(forecast_requests_total[6h])), 0.001)
          ) > 0.006
          and
          (
            sum(rate(forecast_requests_total{status="error"}[30m]))
            /
            clamp_min(sum(rate(forecast_requests_total[30m])), 0.001)
          ) > 0.006
        for: 15m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "SLO error budget burning slowly (6× — 5-day burn-down)"
          description: "Forecast endpoint error rate >0.6% sustained for 6h AND 30m windows. At this rate the 30-day error budget is gone in 5 days. Diagnose during business hours."

  - name: backup
    rules:
      # backup.sh pushes sku_backup_last_success_timestamp_seconds to
      # pushgateway after successful upload. Cron runs at 02:10 UTC,
      # so any healthy day the metric is < 24h old. 25h threshold gives
      # 1h slack for cron drift / upload time / scrape delay.
      #
      # Two failure modes covered by the same expression:
      #   • metric exists but is stale  → backup ran, then stopped running
      #   • metric absent (`absent()`)  → never ran, OR pushgateway was
      #     wiped, OR backup script never reached the push step
      - alert: BackupStale
        expr: |
          (time() - sku_backup_last_success_timestamp_seconds > 25 * 3600)
            or absent(sku_backup_last_success_timestamp_seconds)
        for:   15m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "Postgres backup is stale or missing (>25h)"
          description: "No fresh dump pushed to pushgateway in 25h. Trigger the Diagnose Backup → Restart Backup workflows."

      # base_backup.sh runs weekly (Sun 03:30 UTC) — pushes
      # sku_base_backup_last_success_timestamp_seconds. Without a fresh
      # base, PITR's restore window starts shrinking: WAL archived
      # before the last surviving base becomes useless. 9d threshold
      # gives 7d cadence + 2d slack for one missed run before alerting.
      # 16d would mean two consecutive failures — by then PITR is at
      # serious risk of losing its restore window when WAL retention
      # (14d, see scripts/init_s3_lifecycle.sh) catches up.
      - alert: BaseBackupStale
        expr: |
          (time() - sku_base_backup_last_success_timestamp_seconds > 9 * 86400)
            or absent(sku_base_backup_last_success_timestamp_seconds)
        for:   1h
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "Postgres weekly base backup stale or missing (>9d)"
          description: "pg_basebackup hasn't pushed a success ts in 9 days. PITR window will start shrinking once WAL retention (14d) catches up. Check backup container cron + S3 base/ prefix."

      # NOTE: BackupMirrorStale + BaseBackupMirrorStale (off-region
      # Selectel `uz-2` mirror of primary Beget backups, R7-9 2026-05-20)
      # live in alerts.production.yml — the mirror is prod-only by
      # design (staging is non-customer-facing, no PII, no DR-grade
      # posture). Split out of this file 2026-05-27.

      # Pre-warmup at 8d — surfaces a missed run BEFORE we hit the 9d
      # critical threshold. Audit M7 (2026-05-13) caught that without
      # this, ops only learns of a problem after 9d, by which time PITR
      # has lost 1-2 days of restore window (WAL retention is 14d, so
      # every day past the last base shrinks the recoverable window).
      # `warning` severity routes to the business-hours channel — not
      # an after-hours page, just "fix it before it turns red".
      - alert: BaseBackupWarning
        expr: |
          (time() - sku_base_backup_last_success_timestamp_seconds > 8 * 86400)
            or absent(sku_base_backup_last_success_timestamp_seconds)
        for:   1h
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Postgres weekly base backup is overdue (>8d)"
          description: "Backup hasn't been pushed in 8 days — one day short of the 9d critical threshold. Inspect backup container logs while there's still a healthy PITR window. Suppressed by BaseBackupStale once it fires (see alertmanager inhibit rules)."

      # R10 audit C1 (2026-05-28) — audit_log_retention.sh runs daily
      # 04:00 UTC, pushes `sku_audit_log_retention_last_success_timestamp_seconds`.
      # Before the R10 audit caught D1, this script had been silently
      # NOT RUNNING for 20+ days on prod (backup container image was
      # built 2026-05-07 before commit bf24fb1 added the audit_log
      # retention cron line, and CD didn't `--build` the backup image —
      # closed by PR #37). With the script now running, this alert is
      # the success-side staleness check.
      #
      # Threshold 48h = 2 missed daily runs. audit_log growth is gradual
      # (currently 27 rows / 128KB on prod), so warning-severity not
      # critical. The retention is 730 days (per migration 012); the
      # script doesn't need to be exactly on-time to maintain audit
      # integrity.
      - alert: AuditLogRetentionStale
        expr: |
          (time() - sku_audit_log_retention_last_success_timestamp_seconds > 48 * 3600)
            or absent(sku_audit_log_retention_last_success_timestamp_seconds)
        for:   1h
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "audit_log retention script hasn't pushed success in >48h"
          description: "`scripts/audit_log_retention.sh` runs daily 04:00 UTC from the backup container, calling postgres function `prune_audit_log()` and pushing a success timestamp. Stale metric means either (a) the cron didn't fire — see `BackupContainerCronSilent` or `AuditLogRetentionCronSilent` for that orthogonal signal — or (b) the script ran but failed (likely DB connectivity / permissions). Check `docker exec docker-backup-1 tail /var/log/audit_log_retention.log`."

      # R10 audit B3 (2026-05-28) — per-cron-job "fired" metric, pushed
      # by `scripts/cron_wrapper.sh` BEFORE the wrapped script runs.
      # Independent of the wrapped script's success — bumps every time
      # cron actually fires, regardless of outcome.
      #
      # Purpose: detect cron-infrastructure drift that the existing
      # *Stale alerts MISS when an operator runs the script manually.
      # Sunday 5-24 was the only true cron-time base_backup in May
      # (per `mc ls` audit); earlier Sundays had silent cron failures
      # masked by Tuesday/Wednesday manual recovery runs. With the
      # cron-fired metric, those manual recoveries would NOT have
      # silenced this alert.
      #
      # Threshold 8d = 1 missed Sunday cron + 1d slack. Pairs with
      # BaseBackupWarning (also 8d) — but the two diverge in shape:
      # this fires if cron didn't fire AT ALL, BaseBackupWarning
      # fires if no base was pushed even with manual recovery.
      # NOTE: deliberately NO `or absent()` here (unlike the success-side
      # *Stale alerts). The cron_fired metric does not exist until the
      # FIRST cron tick after a fresh backup-image deploy (cron_wrapper.sh
      # only ships in the image as of 2026-05-28). An `absent()` branch
      # would fire this warning for up to a full week (until the next
      # Sunday 03:30) on every deploy that rebuilds the backup image —
      # pure noise. The absent-forever failure mode (cron_wrapper.sh
      # broken / never pushes) is covered by the success-side
      # BaseBackupStale + BaseBackupWarning, which DO carry absent()
      # defence: if cron_fired never lands, the wrapped base_backup.sh
      # also never ran, so the success metric goes absent → those fire.
      # This alert only needs to catch "cron fired before, but has gone
      # silent since" — which requires the metric to exist first.
      - alert: BaseBackupCronSilent
        expr: |
          time() - sku_base_backup_cron_fired_timestamp_seconds > 8 * 86400
        for:   1h
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Weekly base_backup cron hasn't fired in >8d"
          description: "The Sunday 03:30 UTC cron line for base_backup.sh inside docker-backup-1 has not pushed a `sku_base_backup_cron_fired_timestamp_seconds` in 8+ days. If `BaseBackupStale` is GREEN this means an operator has been running base_backup.sh manually to recover, which masks the cron drift. Investigate: `docker exec docker-backup-1 crontab -l` (line present?), `docker exec docker-backup-1 ps -e | grep crond` (daemon alive?), `docker logs docker-backup-1 --since 24h`."

      # Same shape as BaseBackupCronSilent but for the daily backup
      # cron. Threshold 25h = 1 missed daily + 1h slack (same as
      # BackupStale's threshold).
      # No `or absent()` — same rationale as BaseBackupCronSilent above.
      # absent-forever is caught by BackupStale (success-side, has
      # absent() defence). This catches only "fired before, gone silent".
      - alert: BackupDailyCronSilent
        expr: |
          time() - sku_backup_cron_fired_timestamp_seconds > 25 * 3600
        for:   30m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Daily backup cron hasn't fired in >25h"
          description: "The 02:10 UTC cron line for backup.sh inside docker-backup-1 has not pushed a `sku_backup_cron_fired_timestamp_seconds` in 25+ hours. Pairs with `BackupStale` which catches the script-success side; this one catches the cron-infrastructure side. Same triage: crontab + crond + container logs."

      # Same shape, for audit_log_retention daily cron. 25h threshold
      # symmetric with BackupDailyCronSilent.
      # No `or absent()` — same rationale. absent-forever is caught by
      # AuditLogRetentionStale (success-side, has absent() defence).
      - alert: AuditLogRetentionCronSilent
        expr: |
          time() - sku_audit_log_retention_cron_fired_timestamp_seconds > 25 * 3600
        for:   30m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "audit_log_retention cron hasn't fired in >25h"
          description: "The 04:00 UTC cron line for audit_log_retention.sh inside docker-backup-1 has not pushed a `sku_audit_log_retention_cron_fired_timestamp_seconds` in 25+ hours. Pairs with `AuditLogRetentionStale`. Same triage."

      # R5-17 (2026-05-17) — WAL archive_command failure surfacing.
      # `wal_archive.sh` pushes each WAL segment to S3; postgres retries
      # on failure (data is safe in pg_wal/), but the retry loop grows
      # pg_wal/ until the host disk fills. Without this alert, the
      # operator only finds out via a HostDiskFillingUp ~hours later.
      # Mirrors the silent-alert fix pattern (RqWorkerSilent → real
      # metrics, R5-12 cAdvisor OOM, R5-13 pg replica lag).
      # Both branches gate on `absent(...)` so a broken pg_stat_archiver
      # scrape surfaces too.
      - alert: WalArchiveFailing
        expr: |
          increase(pg_stat_archiver_failed_count{job="postgres"}[5m]) > 0
            or absent(pg_stat_archiver_failed_count{job="postgres"})
        for:   5m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "Postgres WAL archive_command failing or exporter silent"
          description: "wal_archive.sh is failing to push to S3 (or postgres-exporter is down). WAL accumulates in pg_wal/ on the postgres data volume until the host disk fills. Inspect: `docker logs docker-postgres-1 --tail 50 | grep archive`; `docker exec docker-postgres-1 psql -U sku -c 'SELECT * FROM pg_stat_archiver'`. Likely causes: S3 outage, Beget key rotation, Lockbox SA expiry, or backup bucket policy change."

      # R5-17 — sibling stale-archive alert. archive_timeout=60s only
      # forces a WAL switch when there's been WAL ACTIVITY since the
      # last switch — on a completely quiet DB (no writes), postgres
      # never auto-switches and `last_archive_age` grows monotonically.
      #
      # History:
      #   2026-05-17 13:30 UTC — fired during Sunday-afternoon traffic
      #     dip (sku_forecasting xact_commit ≈ 0 for ~20min). Healthy
      #     archiver, false positive. Post-mortem: threshold 10m → 30m,
      #     for-window 0m → 15m (commit 7f22fa2).
      #   2026-05-18 10:18 UTC — fired AGAIN. Same root cause (Monday
      #     morning, ~17h since last commit on sku_forecasting). The
      #     "longer threshold" fix didn't actually solve the false-
      #     positive — it just delayed it. Manual pg_switch_wal()
      #     showed archive_command healthy: archived_count 100→101,
      #     failed_count=0, last_failed_time=NULL.
      #
      # Enterprise fix iteration 2 (2026-05-18 — same day):
      # First iteration AND'd with `xact_commit` rate to filter quiet
      # DB. Caught the WEEKEND/IDLE case but not the daytime
      # READ-ONLY case: a healthy SELECT-heavy workload bumps
      # `xact_commit` (every autocommit-SELECT increments it) but
      # writes ZERO WAL — so the alert fired falsely on the next
      # weekday with 3662 commits/30m but 0 real tuple writes.
      #
      # The TRUE business invariant is:
      #   "Archive is stale WHILE write activity has been generating WAL"
      #
      # Write activity = sum of (inserted + updated + deleted) tuples.
      # Read-only SELECTs don't increment any of those, so a SELECT-
      # heavy day no longer triggers. Threshold 10 writes / 30m (well
      # below any production workload — even housekeeping audit-log
      # inserts cross this; well above scrape noise).
      #
      # `on()` joins across differently-labeled metrics; `job=postgres`
      # on the inner filter excludes the replica's mirrored counters.
      #
      # WalArchiveFailing (increase(failed_count) > 0) remains the
      # canonical "archive_command broken" page; this stale-side
      # rule is a backup signal layered with the AND, so neither
      # quiet-DB nor read-heavy-DB false-positives can fire here.
      - alert: WalArchiveStale
        expr: |
          (
            pg_stat_archiver_last_archive_age{job="postgres"} > 1800
            and on()
            (
                  increase(pg_stat_database_tup_inserted{datname="sku_forecasting",job="postgres"}[30m])
                + increase(pg_stat_database_tup_updated{datname="sku_forecasting",job="postgres"}[30m])
                + increase(pg_stat_database_tup_deleted{datname="sku_forecasting",job="postgres"}[30m])
            ) > 10
          )
          or absent(pg_stat_archiver_last_archive_age{job="postgres"})
        for:   15m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Postgres WAL archive idle >30 min while DB has WRITE activity"
          description: "No new WAL segment archived in 30 min AND `sku_forecasting` saw >10 row writes (inserted+updated+deleted) in the same window — archive_command may be stuck retrying. Inspect: `docker exec docker-postgres-1 psql -U sku -d postgres -c 'SELECT * FROM pg_stat_archiver'`. If failed_count > 0, switch to WalArchiveFailing for the canonical diagnosis. If failed_count = 0 but archive is genuinely stale on a write-active DB, suspect S3 outage / Beget key rotation / Lockbox SA expiry. Quiet-DB AND read-only-DB false positives can no longer fire here (R5-17 enterprise fix iteration 2, 2026-05-18)."

  - name: container-lifecycle
    rules:
      # Crash loop — `container_start_time_seconds` changes on every
      # container start; if it changes >5 times in 15min that's a clear
      # restart-loop. Would have caught the mlflow OOM episode
      # (RestartCount=10458 over 3d before mem_limit 1g→2g fix).
      - alert: ContainerRestartLoop
        # 2026-05-28 (R10 G1) — was `count by (name) (changes(...))`,
        # which is a BUG: `count` returns the NUMBER OF SERIES per
        # name (always 1, since each container emits one
        # container_start_time_seconds), so the expression was
        # effectively `1 > 5` and NEVER fired — even during the
        # mlflow OOM restart-loop this alert was written to catch
        # (RestartCount=10458). `max by (name)` returns the actual
        # change-count value. Caught by the promtool acceptance test
        # (tests/prometheus/alerts_acceptance_test.yml) — the static
        # unit test could not see this. Same phantom/broken-alert
        # class as R5-12 / R10 A1-A3.
        expr: |
          max by (name) (changes(container_start_time_seconds{name=~"docker-.+"}[15m])) > 5
        for:   5m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "Container {{ $labels.name }} restart-looping (>5 starts/15m)"
          description: "Container is restarting too fast for the unless-stopped policy to be normal recovery. Common causes: OOM (check mem_limit + actual usage), bad config, dependency unhealthy. ExitCode=0 + Docker restart-policy hides this from `docker inspect` — only metric-side detection works."

      # OOM-killed — cAdvisor exposes `container_oom_events_total`.
      # Counter resets on container recreate, so alert on rate, not value.
      - alert: ContainerOOMKilled
        expr: |
          increase(container_oom_events_total[10m]) > 0
        for:   1m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Container {{ $labels.name }} OOM-killed"
          description: "Out-of-memory kill in last 10m. Bump mem_limit or investigate leak."

  - name: monitoring-pipeline
    rules:
      # Pushgateway is a single point for all push-based metrics
      # (backup, base_backup). If it's down, BackupStale and
      # BaseBackupStale go silent — and if pushgateway dies right after
      # a successful backup push, we'd never know subsequent pushes
      # failed because the metric stays "fresh" until pushgateway loses
      # state. Fire on any down state immediately.
      - alert: PushgatewayDown
        expr:  up{job="pushgateway"} == 0
        for:   5m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "Pushgateway is down — batch metrics blind"
          description: "BackupStale / BaseBackupStale / future push-metrics depend on this. Restart docker-pushgateway-1 and verify it accepts pushes."

      # Loki rejecting log entries — promtail re-tailing old logs after
      # restart, ingester OOM, network partition.
      #
      # Loki 3.0 (released 2024-04) renamed
      # `loki_distributor_bytes_dropped_total` →
      # `loki_discarded_bytes_total{reason}` (plus `loki_discarded_
      # samples_total{reason}` for the line count). The original
      # expression here referenced the pre-3.0 name; alert silent since
      # the Loki 2→3 upgrade. Caught 2026-05-27 in the R10 alert-audit
      # pass. Verified `loki_discarded_bytes_total` is registered on
      # prod (currently 0 series because no drops have occurred — the
      # metric is lazily labeled per `reason` and only emits once a
      # discard event happens, which is the correct semantics for
      # `rate(...) > 0`).
      - alert: LokiPushFailure
        expr: |
          rate(loki_discarded_bytes_total[5m]) > 0
        for:   10m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Loki dropping log bytes for 10m"
          description: "{{ $value | humanize }}B/s being rejected (reason={{ $labels.reason }}). Check promtail positions persistence (#198 fix) and loki ingester health."

      # Promtail unreachable — image is distroless so no docker healthcheck;
      # prometheus scrape is the only liveness signal we have.
      - alert: PromtailDown
        expr:  up{job="promtail"} == 0
        for:   5m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Promtail :9080 unreachable for 5m"
          description: "All container logs flowing to Loki stop. Restart docker-promtail-1; positions persist via volume so no replay flood."

  - name: certificates
    rules:
      # LE certs for public endpoints. ssl-exporter `ssl_cert_not_after`
      # is unix-timestamp seconds. <14d → warn, <3d → critical.
      - alert: LeCertExpiringSoon
        expr: |
          (ssl_cert_not_after{job="ssl-https"} - time()) / 86400 < 14
        for:   1h
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "LE cert {{ $labels.instance }} expires in <14d ({{ $value | printf \"%.1f\" }}d)"
          description: "Certbot should auto-renew at 30d remaining. If we're at 14d, cron isn't firing or renewal is failing. Inspect certbot container logs."

      - alert: LeCertExpiringCritical
        expr: |
          (ssl_cert_not_after{job="ssl-https"} - time()) / 86400 < 3
        for:   15m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "LE cert {{ $labels.instance }} expires in <3 DAYS"
          description: "User-facing TLS will break. Run certbot manually now and check renewal cron."

  - name: host-resources
    rules:
      # Postgres pg_wal/ lives on the host's data volume. If S3 archive
      # fails (e.g. Beget S3 outage), WAL backs up locally — uncapped.
      # Filling the volume = postgres stops accepting writes = api error
      # surge. Alert at 80% so ops has time to either restore S3 access
      # or evacuate WAL manually before postgres locks up.
      - alert: HostDiskFillingUp
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint="/"}
                    / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint="/"})
          > 80
        for:   15m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Host disk usage >80% on {{ $labels.instance }}"
          description: "Filesystem at {{ $labels.mountpoint }} is {{ $value | printf \"%.1f\" }}% full. Likely cause: pg_wal backup if S3 archive_command failing, or container logs / docker images bloat. Run `docker system df` and check S3 archive health."

      # Critical at 92% — postgres starts to fail at ~95%.
      - alert: HostDiskCritical
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint="/"}
                    / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint="/"})
          > 92
        for:   5m
        labels:
          severity: critical
          team:     forecasting
        annotations:
          summary:     "Host disk usage >92% on {{ $labels.instance }} — postgres at risk"
          description: "Postgres will stop accepting writes when the disk fills. Evacuate large files NOW. {{ $value | printf \"%.1f\" }}% used."

      # Sustained memory pressure — a leaking container can OOM-kill
      # neighbours when host memory fills.
      - alert: HostMemoryHigh
        expr: |
          100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
          > 90
        for:   30m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "Host memory >90% used for 30m on {{ $labels.instance }}"
          description: "{{ $value | printf \"%.1f\" }}% used. Check for memory-leak suspects (mlflow has had crash loops; api / worker can spike during training)."

  # Security-event alerts (audit R2-8, 2026-05-15).
  #
  # These fire on PATTERNS in audit_log + log volume that suggest
  # active attacks — coordinated brute force, token-replay attempts,
  # OAuth CSRF probes, worker silence after a deploy gone bad. All
  # routed to the same Telegram severity-lanes as the rest.
  - name: security-events
    rules:
      # R2-8 / R4-20 — removed JwtDecodeFailureSpike. The original
      # expression used LogQL syntax (`{logger_name=...} |~ "regex"`) in
      # a Prometheus alert rule, which Prometheus rejects with a
      # parse error and refuses to load ANY rules from this file. The
      # alert silently never worked since R2-8, and on the next CD with
      # a real-tag prometheus pull (R4-20) the whole rule-set failed
      # to load → container restart-loop. To restore: move this alert
      # to a Loki ruler config (Loki ruler supports LogQL natively),
      # not back into Prometheus.

      # OTP brute-force: a single canonical email producing >10 failed
      # OTP verify events over 10 min is well past the per-row attempt
      # cap (5) AND the audit-log lockout window (15-min sliding). If
      # this fires, the lockout is firing too — but the alert surfaces
      # WHICH email is being targeted so ops can pro-actively block.
      - alert: OtpBruteForce
        expr: |
          sum by (actor_email) (
            increase(audit_log_event_failure_total{event_type=~"login|otp_verify"}[10m])
          ) > 10
        for:   2m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "OTP brute force against {{ $labels.actor_email }} (>10 fails / 10m)"
          description: "The audit-log lockout will block this email automatically. Verify in audit_log: `SELECT * FROM audit_log WHERE actor_email='{{ $labels.actor_email }}' AND ts > NOW() - INTERVAL '10 minutes' ORDER BY ts DESC;`"

      # R2-8 / R4-20 — removed OauthStateRejectedSpike (same LogQL-in-
      # PromQL bug as JwtDecodeFailureSpike above). Move to Loki ruler.

      # RQ worker silence — workers running but NOT consuming queued
      # jobs (stuck/deadlocked). Refactored 2026-05-17 after a real
      # incident exposed TWO compounding bugs in the original alert:
      #
      #   1. The original referenced `rq_jobs_finished_total` and
      #      `rq_queue_jobs_count` — neither metric exists in the
      #      mdawar/rq-exporter:v3.1.0 image the project actually
      #      runs. The exporter emits per-worker counters
      #      (`rq_workers_success_total{name,queues}`) and a gauge
      #      with queue+status labels (`rq_jobs{queue,status}`),
      #      not those aggregate names. Both `absent()` branches
      #      always returned true → alert fired permanently for
      #      ~the full life of R2-8.
      #   2. Even after correcting the names, the silent branch
      #      (`<1`) fires unconditionally during idle / zero-traffic
      #      periods (`0 < 1` is true regardless of whether jobs
      #      are stuck or merely absent).
      #
      # Real expression — `absent(rq_workers)` catches a fully-down
      # rq-exporter (workers metric is present whenever the scrape
      # succeeded). The silent branch ANDs `< 1` with
      # `rq_jobs{status="queued"} > 0` so the alert ONLY fires when
      # there are jobs waiting AND none were finished in the last
      # 30 minutes. Plain idle = no alert.
      - alert: RqWorkerSilent
        expr: |
          absent(rq_workers)
            or (
              sum(increase(rq_workers_success_total[30m])) < 1
              and sum(rq_jobs{status="queued"}) > 0
            )
        for:   30m
        labels:
          severity: warning
          team:     forecasting
        annotations:
          summary:     "RQ workers not consuming queued jobs (or rq-exporter down)"
          description: "Either rq-exporter is silent (DNS-cache-stale after redis recreate? see 2026-05-17 incident; restart docker-rq-exporter-1) OR queued jobs are not being picked up. Inspect: `docker logs docker-worker-1 --tail 50`. If workers running but idle while queue non-empty, restart: `docker compose restart worker scan-worker process-worker`."

      # R2-8 / R4-20 — removed LockboxBootstrapFailed (same LogQL-in-
      # PromQL bug as above). The CRITICAL-severity intent is preserved
      # — once Loki ruler is configured, re-add this rule there.
      # Until then, container logs at WARN/ERROR level for
      # "Lockbox bootstrap failed" are still in Loki and discoverable
      # via grafana query; the alert wiring is the only thing missing.
