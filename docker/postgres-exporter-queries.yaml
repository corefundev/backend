# ─────────────────────────────────────────────────────────────────────────
# Custom queries for prometheuscommunity/postgres_exporter v0.15.0.
#
# R5-13 (2026-05-17) — `alerts.production.yml::PgReplicaLagHigh` (split
# out of `alerts.yml` on 2026-05-27 — see that file's header) referenced
# `pg_replication_lag_seconds` which the default postgres_exporter
# collector set does NOT emit. The alert was silently broken (same
# phantom-metric pattern as the just-fixed RqWorkerSilent).
#
# This file adds the missing series via a custom SQL query — mounted
# into the postgres-exporter container and registered via the
# --extend.query-path flag (see docker-compose.replica.yml).
#
# Naming: custom-query metrics get the format
# `pg_<query_name>_<column_name>`. So query name `replication_lag` +
# column `seconds` produces `pg_replication_lag_seconds`, matching the
# alert.
#
# Behaviour:
#   On the replica, `pg_last_xact_replay_timestamp()` returns the
#   wall-clock at which the last applied WAL record was generated on
#   primary. `now() - that` is the apply lag in seconds. Zero / NULL
#   on primary (recovery mode is off there).
# ─────────────────────────────────────────────────────────────────────────

pg_replication_lag:
  query: |
    SELECT
        CASE
            WHEN pg_is_in_recovery()
            THEN EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp()))::int
            ELSE 0
        END AS seconds
  master: false
  metrics:
    - seconds:
        usage: "GAUGE"
        description: "Replication apply lag in seconds (replica-side; 0 on primary)"

# ─────────────────────────────────────────────────────────────────────────
# R11-#80 (2026-06-06) — WAL-archiving ENABLED gauge.
#
# WalArchiveFailing keys on `pg_stat_archiver_failed_count` and WalArchiveStale
# on archive age + write activity. BOTH stay quiet when archive_mode is simply
# OFF — nothing archives, so nothing fails and nothing ages. A stale-config
# deploy set archive_mode=off on 2026-06-06 and both WAL alerts FALSE-RESOLVED
# while the WAL→S3 stream was dead (a silent PITR/durability gap).
#
# This emits `pg_archive_mode_enabled` = 1 when archiving is on, 0 otherwise;
# alert PostgresArchiveModeOff fires on 0. Naming: `pg_archive_mode` + column
# `enabled` → metric `pg_archive_mode_enabled`.
#
# master: false — MUST match the working pg_replication_lag query above. With
# this exporter's config `master: true` is NOT honored and the query silently
# never runs (verified live 2026-06-08: pg_replication_lag_seconds[master:false]
# emitted while a master:true pg_archive_mode emitted nothing). The query runs
# on every scraped server; the alert filters job="postgres" so it keys on the
# PRIMARY only (a standby's pg_archive_mode_enabled{job="postgres-replica"} is
# ignored by the rule).
# ─────────────────────────────────────────────────────────────────────────

pg_archive_mode:
  query: |
    SELECT CASE WHEN setting = 'on' THEN 1 ELSE 0 END AS enabled
    FROM pg_settings WHERE name = 'archive_mode'
  master: false
  metrics:
    - enabled:
        usage: "GAUGE"
        description: "1 if postgres archive_mode=on (WAL archiving to S3 enabled), else 0"
