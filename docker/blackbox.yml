# blackbox-exporter modules — used by Prometheus to probe TLS endpoints
# and emit `probe_ssl_earliest_cert_expiry` and friends.
#
# The pg_starttls module speaks the postgres SSLRequest handshake,
# upgrades the connection to TLS, and lets blackbox introspect the
# server cert. We use it to expose cert expiry for the replication
# port (5432), so PgReplicationCertExpiringSoon can fire well before
# the annual rotation deadline.

modules:
  pg_starttls:
    prober: tcp
    timeout: 5s
    tcp:
      # PostgreSQL StartTLS handshake:
      #   1. Plaintext connect.
      #   2. Send 8-byte SSLRequest (length=8 + magic 80877103 = 0x04d2162f).
      #   3. Server replies with single byte 'S' (0x53) to accept TLS,
      #      'N' (0x4E) to reject.
      #   4. UPGRADE connection to TLS via starttls:true on this step
      #      (NOT tls:true at top level — that would TLS-on-dial which
      #      postgres reads as garbage and closes with EOF).
      query_response:
        - send: "\x00\x00\x00\x08\x04\xd2\x16\x2f"
          expect: "^S$"
          starttls: true
      tls_config:
        # Checking cert EXPIRY, not chain validity (the cert is self-
        # signed; chain check would always fail). Expiry value comes
        # from the cert blackbox sees during the upgraded handshake.
        insecure_skip_verify: true
