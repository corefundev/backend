# ───────────────────────────────────────────────────────────────────────
# Override for production VPS:
#   • mlflow → sqlite backend (no psycopg2)
#   • scan/process-worker — drop minio dep
#   • sandbox-broker — group_add for /var/run/docker.sock access (R11-#66:
#     the socket moved here from process-worker)
#   • alertmanager — bound to 127.0.0.1 only (admin via SSH tunnel)
#   • postgres / redis — host port mapping removed (internal only)
#   • prometheus / grafana / mlflow — bind to 127.0.0.1 only (SSH tunnel access)
#
# Deploy with all three -f files:
#   docker compose -f docker/docker-compose.yml \
#                  -f docker/docker-compose.prod.yml \
#                  -f docker/docker-compose.minimal.yml \
#                  --env-file .env up -d <services>
# ───────────────────────────────────────────────────────────────────────
services:
  mlflow:
    # R8-12 — the SQLite-backend + local-FS-artifacts override was the
    # root cause of empty mlflow_run_id on prod (worker had no /mlflow
    # mount, so writes to --default-artifact-root /mlflow/artifacts hit
    # Errno 13). Base docker-compose.yml now carries the real proxy
    # config (postgres backend + S3 via --serve-artifacts + Lockbox-
    # injected S3_MLFLOW_*). All this overlay does now is narrow the
    # host port to 127.0.0.1 only — admin reaches mlflow via SSH tunnel.
    ports: !override
      - "127.0.0.1:5000:5000"

  scan-worker:
    depends_on: !override
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy

  process-worker:
    depends_on: !override
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      sandbox-broker:
        condition: service_healthy
    environment:
      # The staging dir must be a real HOST directory bind-mounted at
      # the SAME path in process-worker AND sandbox-broker: the broker
      # passes these paths to the docker daemon, which resolves them on
      # the HOST — a named volume at /var/lib/sku-sandbox would be
      # invisible to the spawned sandbox ("input file not found").
      SANDBOX_WORK_DIR: /srv/backend/sandbox-staging
    volumes:
      - /srv/backend/sandbox-staging:/srv/backend/sandbox-staging
    # One-time setup on each VPS:
    #     mkdir -p /srv/backend/sandbox-staging && chmod 1777 …

  sandbox-broker:
    # docker gid on both VPS hosts — the broker is now the only app
    # service touching /var/run/docker.sock (R11-#66).
    group_add:
      - "988"
    environment:
      # Same host-path trick as process-worker above — the broker hands
      # these paths to the host docker daemon when spawning the sandbox.
      SANDBOX_WORK_DIR: /srv/backend/sandbox-staging
    volumes:
      - /srv/backend/sandbox-staging:/srv/backend/sandbox-staging

  alertmanager:
    ports: !override
      - "127.0.0.1:9093:9093"

  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"

  grafana:
    ports: !override
      - "127.0.0.1:3000:3000"

  backup:
    environment:
      # Default to empty — backup container fetches DATABASE_URL from
      # Lockbox at startup via lockbox_bootstrap.sh. Without :- compose
      # warns when host .env doesn't have DATABASE_URL (which is the
      # whole point of removing it from .env).
      DATABASE_URL: "${DATABASE_URL:-}"
    depends_on: !override
      postgres:
        condition: service_healthy

