# ─────────────────────────────────────────────────────────────────────────────
# Overlay: Yandex Lockbox as the secret source (alternative to Vault).
#
# Apply:
#   docker compose \
#       -f docker/docker-compose.yml \
#       -f docker/docker-compose.prod.yml \
#       -f docker/docker-compose.lockbox.yml \
#       up -d
#
# What it does:
#   • Mounts the service-account authorised-key JSON read-only into
#     api/worker/scan-worker/process-worker as /run/secrets/yc-sa-key.json.
#   • Sets YC_SA_KEY_FILE + YC_LOCKBOX_SECRET_ID in those containers.
#   • Clears all secret-bearing env vars to empty string so lockbox_agent
#     can inject them at startup (the agent skips already-set keys to
#     respect explicit overrides — empty string is treated as "not set").
#
# Prerequisite on host:
#   • Place the downloaded `authorized_key.json` at ./secrets/yc-sa-key.json
#   • chmod 644 ./secrets/yc-sa-key.json
#   • Parent dir ./secrets/ MUST be `chmod 700 deploy:deploy` — that's
#     the actual protective layer (other UIDs can't `ls` to find the
#     filename even if they could `cat` it).
#
# R5-21 post-mortem (2026-05-17) — tried chmod 600 thinking 644 was
# unnecessary world-read; that broke the migrate / api / alertmanager
# / postgres-exporter containers (uids 999 sku and 65534 nobody can't
# read 600-owned-by-deploy files; only root-entrypoint containers
# bypass the perm check). Reverted to 644 after CD prod deploy
# failure. To actually tighten beyond 644 needs either Linux ACLs
# (`setfacl -m u:999:r,u:65534:r`) or Dockerfile changes — neither
# done. The parent-dir-700 + single-deploy-user VPS threat model
# makes 644 acceptable under enterprise rule "match defence to actual
# attacker shape".
#
# The file NEVER gets rebuilt into images and NEVER gets checked into git
# (add ./secrets/ to .gitignore).
# ─────────────────────────────────────────────────────────────────────────────

# Anchor: blank-out every var that should come from Lockbox.
# Without this, x-common-env's hardcoded fallbacks (e.g. DATABASE_URL=
# postgresql://sku:sku@…) would beat Lockbox's truthy-check.
x-lockbox-blanks: &lockbox-blanks
  YC_SA_KEY_FILE:                  /run/secrets/yc-sa-key.json
  YC_LOCKBOX_SECRET_ID:            "${YC_LOCKBOX_SECRET_ID:?ERROR: set YC_LOCKBOX_SECRET_ID in .env}"
  DATABASE_URL:                    ""
  AWS_ACCESS_KEY_ID:               ""
  AWS_SECRET_ACCESS_KEY:           ""
  S3_UNTRUSTED_ACCESS_KEY_ID:      ""
  S3_UNTRUSTED_SECRET_ACCESS_KEY:  ""
  S3_UNTRUSTED_BUCKET:             ""
  S3_UNTRUSTED_ENDPOINT_URL:       ""
  S3_UNTRUSTED_REGION:             ""
  S3_QUARANTINE_ACCESS_KEY_ID:     ""
  S3_QUARANTINE_SECRET_ACCESS_KEY: ""
  S3_QUARANTINE_BUCKET:            ""
  S3_QUARANTINE_ENDPOINT_URL:      ""
  S3_QUARANTINE_REGION:            ""
  S3_PROCESSED_ACCESS_KEY_ID:      ""
  S3_PROCESSED_SECRET_ACCESS_KEY:  ""
  S3_PROCESSED_BUCKET:             ""
  S3_PROCESSED_ENDPOINT_URL:       ""
  S3_PROCESSED_REGION:             ""
  S3_BACKUP_ACCESS_KEY_ID:         ""
  S3_BACKUP_SECRET_ACCESS_KEY:     ""
  S3_BACKUP_BUCKET:                ""
  S3_BACKUP_ENDPOINT_URL:          ""
  S3_BACKUP_REGION:                ""
  S3_MLFLOW_BUCKET:                ""  # R8-12 — dedicated mlflow S3
  S3_MLFLOW_ENDPOINT_URL:          ""  # R8-12
  S3_MLFLOW_ACCESS_KEY_ID:         ""  # R8-12
  S3_MLFLOW_SECRET_ACCESS_KEY:     ""  # R8-12
  S3_MLFLOW_REGION:                ""  # R8-12
  S3_BUCKET:                       ""
  S3_ENDPOINT_URL:                 ""
  AWS_DEFAULT_REGION:              ""
  JWT_SECRET_KEY:                  ""
  API_KEY:                         ""
  ADMIN_API_KEY:                   ""
  MODEL_SIGNING_KEY:               ""
  METRICS_TOKEN:                   ""  # R10-S6 — bearer token for the /metrics scrape gate
  AUDIT_LOG_HMAC_KEY:              ""  # 32-byte hex; tamper-evidence chain over audit_log (H4)
  BACKUP_PASSPHRASE:               ""
  GRAFANA_PASSWORD:                ""
  POSTGRES_PASSWORD:               ""
  AIRFLOW_FERNET_KEY:              ""
  AIRFLOW_SECRET_KEY:              ""
  AIRFLOW_PASSWORD:                ""
  TELEGRAM_ALERT_BOT_TOKEN:        ""
  TELEGRAM_ALERT_CHAT_ID:          ""
  RESEND_API_KEY:                  ""
  SMTP_PASSWORD:                   ""
  TURNSTILE_SECRET_KEY:            ""
  OAUTH_GOOGLE_CLIENT_ID:          ""
  OAUTH_GOOGLE_CLIENT_SECRET:      ""
  OAUTH_YANDEX_CLIENT_ID:          ""
  OAUTH_YANDEX_CLIENT_SECRET:      ""

services:
  # Migration init-job needs the same Lockbox secrets (DATABASE_URL +
  # the YC SA key for vault_agent.bootstrap_secrets) so the migrate
  # script can connect.
  migrate:
    environment:
      <<: *lockbox-blanks
    volumes:
      - ../secrets/yc-sa-key.json:/run/secrets/yc-sa-key.json:ro

  api:
    environment:
      <<: *lockbox-blanks
    volumes:
      - ../secrets/yc-sa-key.json:/run/secrets/yc-sa-key.json:ro

  worker:
    environment:
      <<: *lockbox-blanks
    volumes:
      - ../secrets/yc-sa-key.json:/run/secrets/yc-sa-key.json:ro

  scan-worker:
    environment:
      <<: *lockbox-blanks
    volumes:
      - ../secrets/yc-sa-key.json:/run/secrets/yc-sa-key.json:ro

  process-worker:
    environment:
      <<: *lockbox-blanks
    volumes:
      - ../secrets/yc-sa-key.json:/run/secrets/yc-sa-key.json:ro

  # Backup container's lockbox_bootstrap.sh (cron wrapper) needs the
  # SA key mounted + YC_SA_KEY_FILE / YC_LOCKBOX_SECRET_ID set. Without
  # this overlay block, backup falls back to compose-time interpolation
  # of ${BACKUP_PASSPHRASE:-} etc., which is empty in Lockbox-mode.
  backup:
    environment:
      <<: *lockbox-blanks
    volumes:
      - ../secrets/yc-sa-key.json:/run/secrets/yc-sa-key.json:ro

  # Alertmanager (custom image) bootstraps TELEGRAM_ALERT_BOT_TOKEN +
  # TELEGRAM_ALERT_CHAT_ID from Lockbox at startup via the same
  # JWT-PS256/IAM/payload chain as the backup container. The bot token
  # never lands in /srv/backend/.env this way.
  #
  # *Not* using <<: *lockbox-blanks here — alertmanager only needs 2 of
  # the 80+ keys, and we explicitly gate via LOCKBOX_ALLOWED_KEYS so
  # lockbox_bootstrap.sh skips the rest. Container env stays minimal,
  # an attacker who pwns alertmanager still can't read secrets the
  # service has no business seeing (defence-in-depth — the SA key on
  # disk would still let them refetch the full payload, that's a
  # separate hardening step).
  alertmanager:
    environment:
      YC_SA_KEY_FILE:       /run/secrets/yc-sa-key.json
      YC_LOCKBOX_SECRET_ID: "${YC_LOCKBOX_SECRET_ID:?ERROR: set YC_LOCKBOX_SECRET_ID in .env}"
      LOCKBOX_ALLOWED_KEYS: "TELEGRAM_ALERT_BOT_TOKEN TELEGRAM_ALERT_CHAT_ID"
      TELEGRAM_ALERT_BOT_TOKEN: ""
      TELEGRAM_ALERT_CHAT_ID:   ""
    volumes:
      - ../secrets/yc-sa-key.json:/run/secrets/yc-sa-key.json:ro

  # postgres-exporter (custom image) bootstraps DATABASE_URL from
  # Lockbox — closes the last plaintext-secret hole in /srv/backend/.env
  # (the postgres password used to live there because upstream's
  # exporter image is distroless and couldn't run lockbox_bootstrap.sh).
  # Same allowlist pattern as alertmanager: only DATABASE_URL.
  postgres-exporter:
    environment:
      YC_SA_KEY_FILE:       /run/secrets/yc-sa-key.json
      YC_LOCKBOX_SECRET_ID: "${YC_LOCKBOX_SECRET_ID:?ERROR: set YC_LOCKBOX_SECRET_ID in .env}"
      LOCKBOX_ALLOWED_KEYS: "DATABASE_URL"
      DATABASE_URL: ""
    volumes:
      - ../secrets/yc-sa-key.json:/run/secrets/yc-sa-key.json:ro

  # postgres (custom image — Dockerfile.postgres) bootstraps S3_BACKUP_*
  # from Lockbox so the WAL archive_command (#183) can push to S3 with
  # no plaintext creds in /srv/backend/.env. Allowlist gates the
  # injection — postgres only sees the S3 backup keypair, not the
  # other 80+ secrets in the Lockbox payload.
  postgres:
    environment:
      YC_SA_KEY_FILE:       /run/secrets/yc-sa-key.json
      YC_LOCKBOX_SECRET_ID: "${YC_LOCKBOX_SECRET_ID:?ERROR: set YC_LOCKBOX_SECRET_ID in .env}"
      LOCKBOX_ALLOWED_KEYS: "S3_BACKUP_BUCKET S3_BACKUP_ENDPOINT_URL S3_BACKUP_ACCESS_KEY_ID S3_BACKUP_SECRET_ACCESS_KEY S3_BACKUP_REGION"
      S3_BACKUP_BUCKET: ""
      S3_BACKUP_ENDPOINT_URL: ""
      S3_BACKUP_ACCESS_KEY_ID: ""
      S3_BACKUP_SECRET_ACCESS_KEY: ""
      S3_BACKUP_REGION: ""
    volumes:
      - ../secrets/yc-sa-key.json:/run/secrets/yc-sa-key.json:ro

  # pgbouncer (custom image — Dockerfile.pgbouncer) needs POSTGRES_PASSWORD
  # to (a) authenticate against postgres for the SCRAM-secret bootstrap
  # query and (b) handle SCRAM exchange to upstream once running. The
  # password is the same one postgres receives — also via Lockbox — so
  # both containers stay in lockstep when it rotates.
  pgbouncer:
    environment:
      YC_SA_KEY_FILE:       /run/secrets/yc-sa-key.json
      YC_LOCKBOX_SECRET_ID: "${YC_LOCKBOX_SECRET_ID:?ERROR: set YC_LOCKBOX_SECRET_ID in .env}"
      LOCKBOX_ALLOWED_KEYS: "POSTGRES_PASSWORD"
      POSTGRES_PASSWORD: ""
    volumes:
      - ../secrets/yc-sa-key.json:/run/secrets/yc-sa-key.json:ro

  # prometheus (custom image — Dockerfile.prometheus) bootstraps
  # METRICS_TOKEN from Lockbox so the `sku-forecasting-api` scrape job
  # can present a bearer token to the /metrics gate (R10-S6). The token
  # is written to /run/metrics_token by scripts/prometheus_entrypoint.sh
  # — it never lands in /srv/backend/.env. Allowlist gates the injection:
  # prometheus only ever sees METRICS_TOKEN, not the other 80+ secrets.
  prometheus:
    environment:
      YC_SA_KEY_FILE:       /run/secrets/yc-sa-key.json
      YC_LOCKBOX_SECRET_ID: "${YC_LOCKBOX_SECRET_ID:?ERROR: set YC_LOCKBOX_SECRET_ID in .env}"
      LOCKBOX_ALLOWED_KEYS: "METRICS_TOKEN"
      METRICS_TOKEN: ""
    volumes:
      - ../secrets/yc-sa-key.json:/run/secrets/yc-sa-key.json:ro

  # mlflow (custom image — Dockerfile.mlflow) bootstraps the 5
  # S3_MLFLOW_* keys from Lockbox at startup. The mlflow_entrypoint.sh
  # then renames them to AWS_* + MLFLOW_S3_ENDPOINT_URL IN-PROCESS so
  # the mlflow server's S3 client picks them up — the api/worker AWS_*
  # (different bucket — main client-data) remain untouched. Allowlist
  # gates the injection: mlflow sees ONLY its 5 keys, not the other 89.
  # Closes R8-12 — replaces the broken local-FS artifact path + the
  # never-deployed MinIO endpoint.
  mlflow:
    environment:
      YC_SA_KEY_FILE:       /run/secrets/yc-sa-key.json
      YC_LOCKBOX_SECRET_ID: "${YC_LOCKBOX_SECRET_ID:?ERROR: set YC_LOCKBOX_SECRET_ID in .env}"
      LOCKBOX_ALLOWED_KEYS: "S3_MLFLOW_BUCKET S3_MLFLOW_ENDPOINT_URL S3_MLFLOW_ACCESS_KEY_ID S3_MLFLOW_SECRET_ACCESS_KEY S3_MLFLOW_REGION"
      S3_MLFLOW_BUCKET: ""
      S3_MLFLOW_ENDPOINT_URL: ""
      S3_MLFLOW_ACCESS_KEY_ID: ""
      S3_MLFLOW_SECRET_ACCESS_KEY: ""
      S3_MLFLOW_REGION: ""
    volumes:
      - ../secrets/yc-sa-key.json:/run/secrets/yc-sa-key.json:ro
