
# ── Shared log-driver caps (audit R2-20, 2026-05-15) ────────────
# Default docker json-file driver has NO rotation — a verbose
# container can fill `/var/lib/docker/containers/` until the host
# disk runs out. Cap each file at 100 MB and keep 10 rotations =
# 1 GB per service ceiling. Services that opt-in via YAML anchor.
# Services NOT using this anchor inherit daemon defaults — that's
# fine for low-volume services (postgres, redis, etc.) but the
# anchor is applied to api / worker / scan-worker / process-worker /
# mlflow which have all caused log-bloat incidents historically.
x-log-rotation: &log-rotation
  driver: json-file
  options:
    max-size: "100m"
    max-file: "10"


# ── Shared environment for all Python services ──────────────────
x-common-env: &common-env
  PYTHONPATH: /app
  CONFIG_PATH: configs/config.yaml
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}       # "local" or "s3"
  ARTIFACTS_DIR: /data/artifacts
  # S3 / MinIO (used when STORAGE_BACKEND=s3)
  S3_BUCKET: ${S3_BUCKET:-sku-forecasting}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_USER:-minioadmin}}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_PASSWORD:-minioadmin}}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  # Per-zone Beget S3 (пустые поля наследуются от AWS_* / S3_*)
  S3_UNTRUSTED_BUCKET:            ${S3_UNTRUSTED_BUCKET:-sku-forecasting-untrusted}
  S3_UNTRUSTED_ENDPOINT_URL:      ${S3_UNTRUSTED_ENDPOINT_URL:-}
  S3_UNTRUSTED_ACCESS_KEY_ID:     ${S3_UNTRUSTED_ACCESS_KEY_ID:-}
  S3_UNTRUSTED_SECRET_ACCESS_KEY: ${S3_UNTRUSTED_SECRET_ACCESS_KEY:-}
  S3_UNTRUSTED_REGION:            ${S3_UNTRUSTED_REGION:-}
  S3_UNTRUSTED_KEY_PREFIX:        ${S3_UNTRUSTED_KEY_PREFIX:-}
  S3_QUARANTINE_BUCKET:            ${S3_QUARANTINE_BUCKET:-sku-forecasting-quarantine}
  S3_QUARANTINE_ENDPOINT_URL:      ${S3_QUARANTINE_ENDPOINT_URL:-}
  S3_QUARANTINE_ACCESS_KEY_ID:     ${S3_QUARANTINE_ACCESS_KEY_ID:-}
  S3_QUARANTINE_SECRET_ACCESS_KEY: ${S3_QUARANTINE_SECRET_ACCESS_KEY:-}
  S3_QUARANTINE_REGION:            ${S3_QUARANTINE_REGION:-}
  S3_QUARANTINE_KEY_PREFIX:        ${S3_QUARANTINE_KEY_PREFIX:-}
  S3_PROCESSED_BUCKET:            ${S3_PROCESSED_BUCKET:-}
  S3_PROCESSED_ENDPOINT_URL:      ${S3_PROCESSED_ENDPOINT_URL:-}
  S3_PROCESSED_ACCESS_KEY_ID:     ${S3_PROCESSED_ACCESS_KEY_ID:-}
  S3_PROCESSED_SECRET_ACCESS_KEY: ${S3_PROCESSED_SECRET_ACCESS_KEY:-}
  S3_PROCESSED_REGION:            ${S3_PROCESSED_REGION:-}
  S3_PROCESSED_KEY_PREFIX:        ${S3_PROCESSED_KEY_PREFIX:-}
  # Auth
  API_KEY: "${API_KEY:-}"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:-}"
  MODEL_SIGNING_KEY: "${MODEL_SIGNING_KEY:-}"
  # PostgreSQL client registry — primary, accepts writes.
  # Audit R3-13 strict — every DSN reads bare ${POSTGRES_PASSWORD} (no
  # `:-sku` fallback). The postgres service block below enforces the
  # var via `:?` strict so compose fails fast if it's unset. The
  # deploy path populates /srv/backend/.env via cd_deploy.sh's
  # inject_lockbox_key BEFORE compose-up — Lockbox value when
  # populated, `sku` migration seed otherwise (with a loud warn). A
  # single .env line now rotates the password across api/worker/
  # pgbouncer/mlflow/airflow/backup. vault_agent rewrites host:port
  # at runtime; user+password come from this env-driven URL.
  DATABASE_URL: postgresql://sku:${POSTGRES_PASSWORD}@postgres:5432/sku_forecasting
  # Optional read-replica DSN. When set, read-heavy queries (audit-log
  # listings, training-run history) use this instead of DATABASE_URL.
  # Falls back to primary when unset OR replica unreachable. Defaults
  # empty so dev environments without a replica keep working unchanged.
  DATABASE_URL_REPLICA: "${DATABASE_URL_REPLICA:-}"
  # Redis — audit R3-15.
  # The default URL omits credentials so dev (REDIS_PASSWORD unset)
  # keeps working unchanged. When REDIS_PASSWORD is provided (Lockbox
  # in staging/prod), override REDIS_URL in .env to
  #   REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
  # That single override flips every consumer (jwt_auth, task_queue,
  # redis_pool, signup_rate_limit, telegram) to the authenticated path.
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  # ClamAV
  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310
  # Upload limits
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
  # Sandbox — R4-1 default is now the CD-built GHCR image (tag set via
  # SANDBOX_IMAGE_TAG, populated by cd_deploy.sh in lockstep with
  # API_IMAGE_TAG / WORKER_IMAGE_TAG). The local `sku-forecasting-sandbox`
  # tag is gone — used to be built by the one-shot `sandbox-image`
  # compose service (docker:26-cli + docker.sock bind-mount), which CD
  # never reran AND exposed the host docker daemon. Override the whole
  # ref via SANDBOX_IMAGE if needed (e.g., local dev with `docker build`).
  SANDBOX_IMAGE: ${SANDBOX_IMAGE:-ghcr.io/corefundev/sku-forecasting-sandbox:${SANDBOX_IMAGE_TAG:-main}}
  SANDBOX_TIMEOUT_SEC: ${SANDBOX_TIMEOUT_SEC:-30}
  SANDBOX_MEM_LIMIT: ${SANDBOX_MEM_LIMIT:-512m}
  SANDBOX_CPUS: ${SANDBOX_CPUS:-1.0}
  SANDBOX_MAX_ROWS: ${SANDBOX_MAX_ROWS:-5000000}
  SANDBOX_MAX_COLUMNS: ${SANDBOX_MAX_COLUMNS:-64}
  SANDBOX_WORK_DIR: /var/lib/sku-sandbox
  # MLflow
  MLFLOW_TRACKING_URI: http://mlflow:5000
  # OTel — api/worker emit traces here. tempo accepts OTLP/gRPC on 4317.
  # When unset, src/monitoring/tracing.py falls back to a console exporter.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317

services:

  # ── DB migrations (one-shot, runs before everything else) ─────
  # Applies pending SQL files from /app/migrations/ via the script
  # at /app/scripts/migrate.py. Exits 0 on success, non-zero on first
  # failure; api/worker/scan-worker/process-worker block on
  # service_completed_successfully so they never start against an
  # outdated schema. Replaces in-process DDL that used to race on
  # pg_type during multi-worker startup.
  migrate:
    image: ghcr.io/corefundev/sku-forecasting-api:${API_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "scripts/migrate.py"]
    environment:
      <<: *common-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # ── Inference API ─────────────────────────────────────────────
  # Image is published to GHCR by .github/workflows/cd.yml. Local dev
  # also works: `docker compose build api` produces an image with the
  # same tag so `up` reuses it without pulling. Pin the tag via env
  # var API_IMAGE_TAG=<sha>; defaults to :main for dev (R4-21 — `:latest`
  # is no longer pushed by CD, narrowing the attack surface of the
  # unbounded `:latest` namespace; `:main` always tracks main-tip).
  api:
    image: ghcr.io/corefundev/sku-forecasting-api:${API_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    logging: *log-rotation
    mem_limit: 768m
    cpus: 1.5
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      # PgBouncer cutover step 5 of #186 — process-worker (step 4) ran
      # 5000+ transactions clean over 21h soak. Now api + worker +
      # scan-worker join the pool. vault_agent rewrites DATABASE_URL
      # host:port post-Lockbox-inject. Rollback: remove these three
      # lines, recreate, traffic returns to postgres:5432 directly.
      DB_HOST_OVERRIDE: "pgbouncer:6432"
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      postgres:  { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      redis:     { condition: service_healthy }
      migrate:   { condition: service_completed_successfully }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Training worker (rq worker) ───────────────────────────────
  worker:
    image: ghcr.io/corefundev/sku-forecasting-worker:${WORKER_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    logging: *log-rotation
    mem_limit: 1500m   # training: lightgbm + pandas frames can spike
    cpus: 2.0
    command: rq worker sku-training --url redis://redis:6379
    environment:
      <<: *common-env
      DB_HOST_OVERRIDE: "pgbouncer:6432"   # #186 step 5 — see api block
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      redis:     { condition: service_healthy }
      postgres:  { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      migrate:   { condition: service_completed_successfully }
    restart: unless-stopped
    # Healthcheck: worker has no HTTP endpoint, so we verify it can reach
    # Redis (its only hard dependency). If Redis is gone, the worker is
    # useless and docker will restart it.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3).ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Upload pipeline: scan worker ──────────────────────────────
  # Streams untrusted bytes into ClamAV; never writes attacker data to disk.
  scan-worker:
    image: ghcr.io/corefundev/sku-forecasting-worker:${WORKER_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    logging: *log-rotation
    mem_limit: 256m
    cpus: 0.5
    command: rq worker sku-scan --url redis://redis:6379
    environment:
      <<: *common-env
      DB_HOST_OVERRIDE: "pgbouncer:6432"   # #186 step 5 — see api block
    depends_on:
      redis:     { condition: service_healthy }
      postgres:  { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      # service_started (not service_healthy) — clamav freshclam reloads
      # transiently flap the healthcheck; we don't want one stuck-unhealthy
      # event to block scan-worker recreate during a deploy. scan-worker's
      # job code already gracefully fails individual scan tasks if clamav
      # is unreachable. autoheal restarts clamav anyway.
      clamav:    { condition: service_started }
      minio:     { condition: service_healthy }
      migrate:   { condition: service_completed_successfully }
    restart: unless-stopped
    # Scan worker additionally needs ClamAV; we probe both.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import os,redis,socket
          redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3).ping()
          s=socket.create_connection((os.environ.get('CLAMAV_HOST','clamav'), int(os.environ.get('CLAMAV_PORT',3310))), timeout=3)
          s.close()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Upload pipeline: sandbox/process worker ───────────────────
  # Needs access to the Docker socket to launch secure_parser containers.
  # Run on a dedicated node in prod; treat as privileged.
  process-worker:
    image: ghcr.io/corefundev/sku-forecasting-worker:${WORKER_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    logging: *log-rotation
    mem_limit: 768m   # sandbox parsing — large CSV/parquet → spike
    cpus: 1.0
    command: rq worker sku-process --url redis://redis:6379
    environment:
      <<: *common-env
      # PgBouncer cutover, step 4 of #186 — process-worker is the most
      # isolated service (no LISTEN/NOTIFY, no long-lived sessions, no
      # admin queries), so it cuts over first to validate the txn-pool
      # path under real workload before we move api + other workers.
      # vault_agent rewrites DATABASE_URL host:port post-Lockbox-inject.
      DB_HOST_OVERRIDE: "pgbouncer:6432"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock       # launch sandbox containers
      - sandbox_staging:/var/lib/sku-sandbox
    depends_on:
      redis:     { condition: service_healthy }
      postgres:  { condition: service_healthy }
      pgbouncer: { condition: service_healthy }   # cutover dependency — see DB_HOST_OVERRIDE
      minio:     { condition: service_healthy }
      migrate:   { condition: service_completed_successfully }
    restart: unless-stopped
    # Process worker checks: Redis + Docker socket reachability.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import os,redis,socket
          redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3).ping()
          s=socket.socket(socket.AF_UNIX, socket.SOCK_STREAM); s.settimeout(3)
          s.connect('/var/run/docker.sock'); s.close()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── ClamAV antivirus ──────────────────────────────────────────
  clamav:
    # R4-20 digest-pinned 2026-05-17 — floating :1.4 could silently
    # ship a different layer set after a Docker Hub re-push. Pin to the
    # observed prod digest; bump intentionally with a fresh `docker
    # manifest inspect clamav/clamav:1.4`.
    image: clamav/clamav:1.4@sha256:2859f99b97a70f84fb524faf54fdd7e3a5d8ac084e79f03a704b334526106923
    # Opt into autoheal — clamd socket transiently drops during freshclam
    # signature reloads (~hourly); without autoheal the container ends up
    # in "unhealthy" forever and blocks scan-worker recreate via depends_on.
    labels:
      autoheal: "true"
    mem_limit: 1500m   # baseline ~1G (sig db loaded), spikes during scan
    cpus: 1.0
    ports: []        # no host ports — internal only
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamav_db:/var/lib/clamav
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s          # signature DB download on first boot

  # ── Sandbox image — R4-1 ──────────────────────────────────────
  # Removed: the previous `sandbox-image` one-shot service built the image
  # locally on the VPS via `docker:26-cli` with /var/run/docker.sock bind-
  # mounted. Two problems closed by the removal:
  #   1) CD never reran the one-shot, so Dockerfile.sandbox changes
  #      (apt-upgrade Trivy patches, requirements-sandbox.txt bumps)
  #      silently failed to land on prod.
  #   2) docker.sock bind-mount + a CLI-only container exposed the host
  #      docker daemon to a service whose only job was to call docker.
  # Replacement: cd.yml `Build + push sandbox image` step produces
  # ghcr.io/corefundev/sku-forecasting-sandbox:${SANDBOX_IMAGE_TAG} per
  # commit; cd_deploy.sh pulls it explicitly; process-worker reads the
  # SANDBOX_IMAGE env (default above) to invoke `docker run`.

  # ── Redis ─────────────────────────────────────────────────────
  # Audit R3-15 — when REDIS_PASSWORD is set, the server starts with
  # --requirepass; redis-cli picks up REDISCLI_AUTH for the healthcheck.
  # When empty, falls back to no-auth (legacy behaviour) but logs a
  # loud warning so ops sees the gap. Production overrides REDIS_PASSWORD
  # via Lockbox (key listed in LOCKBOX_ALLOWED_KEYS).
  redis:
    # R4-20 digest-pinned 2026-05-17
    image: redis:7.2-alpine@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDISCLI_AUTH:  ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD"
        else
          echo "[R3-15] WARN: REDIS_PASSWORD unset — Redis starting WITHOUT auth (dev only)" >&2
          exec redis-server
        fi
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── PostgreSQL (client registry) ──────────────────────────────
  # Custom image — postgres:16-alpine + mc + lockbox_bootstrap.sh so the
  # WAL archive_command (#183) can push to S3 without any creds living
  # in /srv/backend/.env. Same pattern as alertmanager / postgres-
  # exporter / backup. See docker/Dockerfile.postgres + scripts/
  # postgres_entrypoint.sh + scripts/wal_archive.sh.
  postgres:
    build:
      context: ..
      dockerfile: docker/Dockerfile.postgres
    image: docker-postgres:custom
    mem_limit: 1500m   # shared_buffers + work_mem for ~10 concurrent
    cpus: 1.5
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sku
      # Audit R3-13 — strict `:?` gate (2026-05-16, follow-up to the
      # graceful-fallback shipped in 5b13ea0). Any deploy that reaches
      # compose-up without POSTGRES_PASSWORD set in env fails fast at
      # compose load time with the explicit message below. The deploy
      # path (cd_deploy.sh::inject_lockbox_key) writes POSTGRES_PASSWORD
      # to /srv/backend/.env BEFORE compose-up — pulled from Lockbox
      # when populated, seeded with the `sku` migration default
      # otherwise (and emits a `::warning::` so the ops gap is loud).
      # Compose then ALWAYS sees the var set; the :? gate guards against
      # a future foot-gun where someone unsets POSTGRES_PASSWORD in
      # .env and the old `:-sku` would have silently re-introduced
      # the weak credential.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required — run cd_deploy.sh inject_lockbox_key or add the line manually to /srv/backend/.env}
      POSTGRES_DB: sku_forecasting
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sku -d sku_forecasting"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PgBouncer (transaction-mode connection pool, #186) ────────
  # Sits between app pools and Postgres. Apps point at pgbouncer:6432
  # instead of postgres:5432; PgBouncer reuses a small pool of real PG
  # connections across many client connections. transaction-mode is
  # safe here because the codebase has no LISTEN/NOTIFY, advisory
  # locks, server-side prepared statements (asyncpg cache disabled),
  # WITH HOLD cursors or session-level SET — see #186 audit notes.
  #
  # Image choice: edoburu/pgbouncer (alpine-based, community-maintained).
  # We're not on bitnami/* because Bitnami pulled all free-tier images
  # off Docker Hub in 2025 (bitnami/pgbouncer:1.22.1 returns 404).
  #
  # Side-by-side rollout: postgres:5432 stays open. Cutover happens
  # one app at a time by repointing DATABASE_URL → pgbouncer:6432.
  pgbouncer:
    # Custom image — alpine + pgbouncer + postgresql16-client, with an
    # entrypoint that pulls the SCRAM secret out of pg_authid into
    # userlist.txt at start time. Off-the-shelf images (edoburu, bitnami-
    # legacy) generate userlist.txt with md5 hashes which don't match
    # PG14+'s default scram-sha-256 storage.
    build:
      context: ..
      dockerfile: docker/Dockerfile.pgbouncer
    image: docker-pgbouncer:custom
    mem_limit: 128m
    cpus: 0.5
    # Hardening: read-only rootfs + tmpfs for /etc/pgbouncer means
    # userlist.txt (which holds the SCRAM secret) lives in RAM and is
    # gone the moment the container stops — no on-disk persistence of
    # the hash, no rotation-residue, no host-side leak via docker cp.
    # cap_drop: ALL + no-new-privileges close the standard escalation
    # surfaces; pgbouncer needs no caps beyond network bind.
    read_only: true
    # mode=1777 (world-writable + sticky) matches normal /tmp semantics —
    # compose tmpfs short syntax doesn't reliably honor uid=/gid= across
    # docker versions, so the safe portable cell is "everyone can write,
    # only owner can rm" like the kernel's default. /etc/pgbouncer needs
    # a higher mode because the entrypoint chown'd it to postgres at
    # build time and now that chown lives only in the immutable rootfs;
    # tmpfs mount overrides it back to default ownership.
    tmpfs:
      - /etc/pgbouncer:mode=1777
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      DB_HOST:           postgres
      DB_PORT:           "5432"
      DB_USER:           sku
      # Audit R3-13 — references the required var from postgres service.
      DB_PASSWORD:       ${POSTGRES_PASSWORD}
      DB_NAME:           sku_forecasting
      LISTEN_PORT:       "6432"
      AUTH_TYPE:         scram-sha-256
      POOL_MODE:         transaction
      # 25 real PG conns multiplexed across up to 200 client conns —
      # 8× headroom over today's ~50 active conns, room to add another
      # api instance without touching postgres max_connections.
      DEFAULT_POOL_SIZE:    "25"
      MAX_CLIENT_CONN:      "200"
      MAX_DB_CONNECTIONS:   "50"
      # Wait up to 30s for a free server conn before erroring — matches
      # api command_timeout. Without this, bursty traffic would surface
      # as "no more connections allowed" instead of just queuing.
      QUERY_WAIT_TIMEOUT:   "30"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    # Auth-aware healthcheck: actually authenticate as DB_USER and SELECT 1
    # via pgbouncer:6432. Catches userlist.txt corruption / SCRAM mismatch
    # which the prior pg_isready test would silently miss. Reads password
    # from /etc/pgbouncer/.healthcheck-pw which the entrypoint stashes
    # in tmpfs (Docker healthchecks don't inherit Lockbox-bootstrapped
    # runtime env from PID 1, only Config.Env from container start).
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$(cat /etc/pgbouncer/.healthcheck-pw 2>/dev/null) psql -h 127.0.0.1 -p 6432 -U \"$$DB_USER\" -d \"$$DB_NAME\" -tAc 'SELECT 1' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── MinIO (local S3-compatible storage — DEV ONLY) ────────────
  # R4-13 marked MinIO as dead-in-prod (Beget S3 is the actual
  # backend); R4-20/R4-21 close the residual exposure by
  # profile-gating + digest-pinning. With `profiles: ["dev"]` the
  # service is excluded from the default compose stack and only
  # starts when explicitly requested via `--profile dev`. Prod CD
  # never enables that profile, so prod can no longer accidentally
  # boot MinIO via a stray `compose up`.
  minio:
    profiles: ["dev"]
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z@sha256:0bd79595dbcf155782860716abf4cf79d5ee32a9508b60fa1a88793bbe55b245
    ports:
      - "9000:9000"
      - "9001:9001"       # MinIO Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}  # Задайте в .env для production
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}  # Задайте в .env для production
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Creates all three zone buckets on startup.
  # NOTE: bucket policies in MinIO are set via `mc anonymous` / `mc policy`;
  # in real S3 (Beget/AWS), use IAM per-role policies as documented in
  # .env.example. The MinIO policies below just block anonymous access.
  # R4-20/R4-21 — profile-gated + digest-pinned alongside minio above.
  minio-init:
    profiles: ["dev"]
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_USER:-minioadmin} $${MINIO_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/$${S3_BUCKET:-sku-forecasting};
        mc mb --ignore-existing local/$${S3_UNTRUSTED_BUCKET:-sku-forecasting-untrusted};
        mc mb --ignore-existing local/$${S3_QUARANTINE_BUCKET:-sku-forecasting-quarantine};
        mc anonymous set none local/$${S3_BUCKET:-sku-forecasting};
        mc anonymous set none local/$${S3_UNTRUSTED_BUCKET:-sku-forecasting-untrusted};
        mc anonymous set none local/$${S3_QUARANTINE_BUCKET:-sku-forecasting-quarantine};
        echo 'Buckets ready';
      "
    environment:
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-sku-forecasting}
      S3_UNTRUSTED_BUCKET: ${S3_UNTRUSTED_BUCKET:-sku-forecasting-untrusted}
      S3_QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:-sku-forecasting-quarantine}
    restart: "no"

  # ── MLflow tracking server ────────────────────────────────────
  mlflow:
    # v3.x clears the 2.x CVE bundle (path traversal, command exec,
    # auth bypass) — see requirements.txt for the matching client pin.
    #
    # mem_limit 2g (was 1g): mlflow 3.x with uvicorn defaults to 4
    # workers × ~250-500MB each. At 1g we sat at 78% on cold start and
    # OOM-killed the moment any artifact streamed → restart loop with
    # ExitCode=0 (Docker masks the OOM after the kill if reaped fast).
    # 2g + --workers 1 keeps the math comfortably under: ~600MB peak
    # observed.
    # R4-20 digest-pinned 2026-05-17
    image: ghcr.io/mlflow/mlflow:v3.11.1@sha256:6cb0a22c0d4d722a793c2e93d89ba28b10b6b27d4c1e60ab2533a8e081ffca2d
    logging: *log-rotation
    mem_limit: 2g
    cpus: 1.0
    ports:
      - "5000:5000"
    environment:
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://sku-forecasting/mlflow/
      AWS_ACCESS_KEY_ID: ${MINIO_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    # Audit R3-13 — `command:` is interpolated at compose-load, so
    # ${POSTGRES_PASSWORD} resolves to the same value as the postgres
    # service environment (validated by the :? in that block).
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --workers 1
      --backend-store-uri postgresql://sku:${POSTGRES_PASSWORD}@postgres:5432/sku_forecasting
      --default-artifact-root s3://sku-forecasting/mlflow/
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
    restart: unless-stopped
    # MLflow 2.x exposes /health on the server port.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── Airflow ───────────────────────────────────────────────────
  airflow-webserver:
    # R4-20 digest-pinned 2026-05-17 (airflow stack is NOT enabled in
    # prod cd_deploy.sh, but pinning keeps the definition consistent).
    image: apache/airflow:2.9.1@sha256:2514cee14aae54733f68d0e03680ab74112ac51524c9990377f6cc8a8af949cb
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sku:${POSTGRES_PASSWORD}@postgres:5432/sku_forecasting
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-}"
      AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY:-}"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      PYTHONPATH: /app
      <<: *common-env
    volumes:
      - ../dags:/opt/airflow/dags
      - ../src:/app/src
      - ../configs:/app/configs
      - airflow_logs:/opt/airflow/logs
      - artifacts:/data/artifacts
    command: webserver
    depends_on:
      postgres: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    # R4-20 digest-pinned 2026-05-17 (airflow stack is NOT enabled in
    # prod cd_deploy.sh, but pinning keeps the definition consistent).
    image: apache/airflow:2.9.1@sha256:2514cee14aae54733f68d0e03680ab74112ac51524c9990377f6cc8a8af949cb
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sku:${POSTGRES_PASSWORD}@postgres:5432/sku_forecasting
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-}"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /app
      <<: *common-env
    volumes:
      - ../dags:/opt/airflow/dags
      - ../src:/app/src
      - ../configs:/app/configs
      - airflow_logs:/opt/airflow/logs
      - artifacts:/data/artifacts
    command: scheduler
    depends_on:
      postgres: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }
    restart: unless-stopped
    # Official Airflow scheduler health check — reports stale if the
    # scheduler loop hasn't run for >30s.
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$(hostname)\" --local || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # One-time DB init for Airflow
  airflow-init:
    # R4-20 digest-pinned 2026-05-17 (airflow stack is NOT enabled in
    # prod cd_deploy.sh, but pinning keeps the definition consistent).
    image: apache/airflow:2.9.1@sha256:2514cee14aae54733f68d0e03680ab74112ac51524c9990377f6cc8a8af949cb
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sku:${POSTGRES_PASSWORD}@postgres:5432/sku_forecasting
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-}"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    command: version
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # ── Prometheus ────────────────────────────────────────────────
  # ── Postgres exporter (Prometheus target) ──────────────────────
  # Exports pg_stat_database, pg_stat_activity, etc. for the alert rules
  # (PostgresDown, PostgresConnectionsHigh).
  #
  # Custom image — bakes lockbox_bootstrap.sh so DATABASE_URL gets
  # fetched from Lockbox at container startup. Without this we'd have
  # to keep the postgres password in /srv/backend/.env (upstream image
  # is distroless, can't run a shell-based loader).
  postgres-exporter:
    build:
      context: ..
      dockerfile: docker/Dockerfile.postgres-exporter
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/postgres_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ssl-exporter — TLS endpoint probing for cert-expiry alerts.
  # Used by the PgReplicationCertExpiringSoon alert to surface
  # `ssl_cert_not_after` for the replication TLS endpoint well before
  # the annual self-signed cert needs rotating. Has native postgres
  # StartTLS support (blackbox's YAML-byte-encoding broke the 8-byte
  # SSLRequest handshake — see commit history).
  ssl-exporter:
    # R4-20 digest-pinned 2026-05-17
    image: ribbybibby/ssl-exporter:2.4.3@sha256:f6812639a073f8eedc922e0423a57becd6302ccd04a4182108523e4ff83a2bc1
    restart: unless-stopped
    volumes:
      - ./ssl-exporter.yml:/config/ssl_exporter.yml:ro
    command:
      - "--config.file=/config/ssl_exporter.yml"
    # No healthcheck: image is distroless (no shell, no curl, no wget,
    # only /ssl_exporter binary itself). Container-level probe would
    # need a sidecar. Prometheus monitors the /probe endpoint as a
    # scrape target — that's the SLO check that matters.
    # Bounded log rotation — without this Docker uses the unbounded
    # default and historical config-parse errors stick around forever.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  # ── RQ exporter (queue metrics) ────────────────────────────────
  # Polls Redis for RQ queue stats (jobs_total, queue_size, worker_count).
  # No secrets needed — just a Redis URL.
  rq-exporter:
    # R4-20 digest-pinned 2026-05-17
    image: mdawar/rq-exporter:v3.1.0@sha256:d82dd3c4f8f385ad167688d87ff37aa9e0eeeb7dcaf331998310b2c85c2969d6
    environment:
      RQ_REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Functional healthcheck (incident 2026-05-17): the previous probe
    # was an HTTP 200 check on /metrics, but Flask returns 200 even
    # when rq-exporter has lost its Redis connection — it just emits
    # an empty `rq_*` series. As a result the exporter ran "healthy"
    # for 12 days while emitting zero data (DNS cache stale after a
    # redis container recreate). Probe now asserts that at least one
    # `rq_workers` line is in the response body, which can only be
    # true if the Redis scrape succeeded. When this fails for 3
    # consecutive 30-second intervals, autoheal restarts the container
    # → DNS cache clears → metrics resume.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9726/metrics',timeout=3).read().decode(); sys.exit(0 if 'rq_workers{' in r else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      # autoheal restarts containers with status=unhealthy; the rq-
      # exporter's DNS-cache-stale failure mode is exactly what autoheal
      # is for, but only with a functional healthcheck above to surface
      # the underlying failure.
      autoheal: "true"
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Pushgateway (for batch-job metrics — backup, etc.) ────────
  # Backup runs once a night. Without pushgateway we'd have to hack
  # textfile-collector or external freshness probes to know the dump
  # is fresh. With pushgateway, backup.sh ends with a one-line curl
  # to push sku_backup_last_success_timestamp_seconds, and Prometheus
  # picks it up on its next scrape. The BackupStale alert fires if
  # that timestamp is more than 25h old.
  pushgateway:
    # R4-20 digest-pinned 2026-05-17
    image: prom/pushgateway:v1.9.0@sha256:98a458415f8f5afcfd45622d289a0aa67063563bec0f90d598ebc76783571936
    restart: unless-stopped
    # Internal-only — backup pushes from inside docker network,
    # prometheus scrapes from inside docker network.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  prometheus:
    # R4-20 — R2-29 declared v2.59.1 but that tag never existed on
    # Docker Hub, so `compose pull` silently failed and prod stayed
    # on v2.51.2 since 2024-Q1 (CD never recreated the container).
    # Bump to v2.55.1 (latest 2.x stable on Docker Hub, includes all
    # security patches accrued since v2.51) AND digest-pin so the
    # observed identity matches what's documented in the file.
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"   # allows reload via HTTP POST /-/reload
    # DNS indirection for replica postgres-exporter. prometheus.yml
    # scrapes `postgres-replica.internal:9187`; we resolve that alias
    # here so the replica IP can be rotated via REPLICA_EXPORTER_HOST
    # in .env / Lockbox without editing checked-in YAML. Default falls
    # back to the current prod replica IP for backward compat.
    extra_hosts:
      - "postgres-replica.internal:${REPLICA_EXPORTER_HOST:-212.8.226.233}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── autoheal — auto-restart any unhealthy container ─────────────
  # Watches docker events, restarts containers stuck in `unhealthy`
  # state. Closes a long-tail of "X stuck unhealthy after weeks of
  # uptime" issues — clamav specifically did this 3 times in a single
  # session (clamd socket transiently drops during signature reloads,
  # healthcheck retries fail, container shows unhealthy but Docker's
  # restart-policy doesn't react to healthcheck — only crash). Without
  # autoheal, the only recovery path was manual `docker restart`.
  #
  # Picks up only containers labeled `autoheal=true` (we'll opt-in
  # narrowly to avoid surprise restarts of services that consider
  # unhealthy a soft state).
  autoheal:
    # R4-20 digest-pinned 2026-05-17
    image: willfarrell/autoheal:1.2.0@sha256:31f580ef0279eaced5b38d631b08c474d70d8403c1c2fdd6ddcf2e879d5f3f7c
    mem_limit: 32m
    cpus: 0.1
    environment:
      AUTOHEAL_CONTAINER_LABEL: "autoheal"
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # ── cAdvisor (per-container metrics — restart loops, CPU/mem/IO) ─
  # Source for ContainerRestartLoop alert — exposes
  # `container_start_time_seconds`, which changes on every restart, so
  # `count(changes(container_start_time_seconds[15m]) > 5)` catches
  # crash-loops like the mlflow OOM episode (RestartCount=10458 in 3
  # days before the 1g→2g fix). Read-only mounts only — cAdvisor never
  # writes to the host.
  cadvisor:
    # R4-20 digest-pinned 2026-05-17
    image: gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    mem_limit: 256m
    cpus: 0.3
    privileged: true        # cAdvisor needs CAP_SYS_PTRACE for /proc/N/ns
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.compose.service"
      # Disable noisy collectors that produce no actionable signal —
      # we only want container-level lifecycle + resource metrics.
      - "--disable_metrics=disk,diskIO,tcp,udp,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl"
      # R5-12 (2026-05-17) — opt-in to the `oom_event` collector so
      # cAdvisor emits `container_oom_events_total`. Without this flag
      # cAdvisor v0.47+ doesn't publish the OOM series and the
      # `ContainerOOMKilled` alert in docker/alerts.yml is silently
      # broken (same class as the just-fixed RqWorkerSilent —
      # phantom-metric alert). Cost: negligible, the collector parses
      # kernel /dev/kmsg events that are already streamed in.
      - "--enable_metrics=oom_event"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── node_exporter (host filesystem + memory + cpu metrics) ────
  # Closes #198 — pg_wal disk-pressure alert needs filesystem metrics
  # for the postgres data volume mountpoint. Runs on the docker network
  # (so other containers can scrape it as `node-exporter:9100`) but with
  # pid:host + a read-only bind of /, /proc, /sys so it reports HOST
  # filesystems and processes. Not exposing :9100 on the host so it
  # stays internal to the docker network.
  node-exporter:
    # R4-20 digest-pinned 2026-05-17
    image: prom/node-exporter:v1.8.1@sha256:fa7fa12a57eff607176d5c363d8bb08dfbf636b36ac3cb5613a202f3c61a6631
    pid: host
    mem_limit: 64m
    cpus: 0.2
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/metrics 2>/dev/null | grep -q node_filesystem_avail_bytes"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Nightly Postgres backup ───────────────────────────────────
  # Runs at 02:10 UTC daily via busybox crond. Uses backup.sh with
  # pg_dump + AES-256 encryption + S3 upload. The same container can be
  # exec'd to run restore.sh interactively.
  backup:
    # Custom image: deps baked at build time (no runtime apk-add hangs)
    # + scripts/lockbox_bootstrap.sh as a cron wrapper that fetches
    # secrets from Lockbox before each backup run. See
    # docker/Dockerfile.backup for full rationale.
    build:
      context: ..
      dockerfile: docker/Dockerfile.backup
    # tini as PID 1, crond as its child. Without init:true crond runs
    # as PID 1 and its setpgid() calls fail with "Operation not
    # permitted" because PID 1 is its own session leader and can't
    # call setpgid on itself. Symptom: container restart-loops with
    # `setpgid: Operation not permitted` in logs.
    init: true
    environment:
      # Audit R3-13 — env-driven, no hardcoded sku:sku.
      DATABASE_URL:          postgresql://sku:${POSTGRES_PASSWORD}@postgres:5432/sku_forecasting
      # Backup S3 — отдельный аккаунт / keypair. Backup-скрипт смотрит
      # СНАЧАЛА на S3_BACKUP_* , потом fallback на общие AWS_* (dev/MinIO).
      S3_BACKUP_BUCKET:               ${S3_BACKUP_BUCKET:-sku-forecasting-backups}
      S3_BACKUP_ENDPOINT_URL:         ${S3_BACKUP_ENDPOINT_URL:-}
      S3_BACKUP_ACCESS_KEY_ID:        ${S3_BACKUP_ACCESS_KEY_ID:-}
      S3_BACKUP_SECRET_ACCESS_KEY:    ${S3_BACKUP_SECRET_ACCESS_KEY:-}
      S3_BACKUP_REGION:               ${S3_BACKUP_REGION:-}
      # Fallbacks на случай, если per-backup креды не заданы (dev + MinIO).
      S3_ENDPOINT_URL:       http://minio:9000
      AWS_ACCESS_KEY_ID:     ${MINIO_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-minioadmin}
      BACKUP_PASSPHRASE: "${BACKUP_PASSPHRASE:-}"
    volumes:
      - ../scripts:/scripts:ro
      - backups:/tmp/backup
    # No entrypoint override — Dockerfile.backup CMD echoes the
    # "backup cron installed" sentinel then exec's crond. Crontab entry
    # uses lockbox_bootstrap.sh as a wrapper to fetch fresh secrets
    # from Lockbox before each backup run.
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Alertmanager ──────────────────────────────────────────────
  alertmanager:
    # Custom image: alpine + lockbox_bootstrap.sh so the container fetches
    # TELEGRAM_ALERT_BOT_TOKEN / TELEGRAM_ALERT_CHAT_ID from YC Lockbox at
    # startup. The bot token never touches /srv/backend/.env — see
    # docker/Dockerfile.alertmanager + scripts/alertmanager_entrypoint.sh.
    #
    # In Lockbox-mode (prod), docker-compose.lockbox.yml mounts the SA
    # key + sets YC_SA_KEY_FILE / YC_LOCKBOX_SECRET_ID. In dev (no
    # Lockbox), set TELEGRAM_ALERT_* directly via .env — entrypoint
    # falls through to render-with-env if YC_SA_KEY_FILE is unset.
    build:
      context: ..
      dockerfile: docker/Dockerfile.alertmanager
    volumes:
      # Template — contains ${TELEGRAM_ALERT_BOT_TOKEN} and
      # ${TELEGRAM_ALERT_CHAT_ID} placeholders, rendered at startup.
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml.tpl:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Grafana ───────────────────────────────────────────────────
  # ── Tempo (distributed tracing — OTLP backend) ────────────────
  # Receives spans from api/worker via OTEL_EXPORTER_OTLP_ENDPOINT
  # (set in their env, points at tempo:4317 gRPC). Filesystem-backed,
  # 7-day retention. Internal-only — query via Grafana → Explore →
  # Tempo. Loki's derivedField for trace_id auto-links to traces.
  tempo:
    # R4-20 digest-pinned 2026-05-17
    image: grafana/tempo:2.5.0@sha256:f0200a9bff6d14eb3a4332194f7b77c37ee1a3535e7e41db024d95aab6f1b4e8
    restart: unless-stopped
    volumes:
      - ./tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready 2>/dev/null | grep -q ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Loki + Promtail (logs aggregation) ────────────────────────
  # Loki is the storage / query side; promtail tails docker container
  # logs via the local docker socket and ships them to Loki. Both
  # internal-only — query via Grafana → Explore → Loki datasource.
  # Retention 30 days (loki-config.yaml).
  loki:
    # R4-20 digest-pinned 2026-05-17
    image: grafana/loki:3.0.0@sha256:757b5fadf816a1396f1fea598152947421fa49cb8b2db1ddd2a6e30fae003253
    restart: unless-stopped
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      # Loki ruler — rules under /loki/rules/<tenant>/. tenant=fake
      # for auth_enabled=false setups. Ports the 3 log-based alerts
      # that R2-8 originally tried (and failed) to express in
      # prometheus alerts.yml. See loki-config.yaml `ruler:` block.
      - ./loki-rules.yml:/loki/rules/fake/loki-rules.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready 2>/dev/null | grep -q ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  promtail:
    # R4-20 digest-pinned 2026-05-17
    image: grafana/promtail:3.0.0@sha256:d3de3da9431cfbe74a6a94555050df5257f357e827be8e63f8998d509c37af8b
    restart: unless-stopped
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
      # Container logs (json-file driver writes here).
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Docker socket for SD (discovers running containers + their labels).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persistent positions file. Without this, every container recreate
      # makes promtail re-read all docker container logs from offset 0,
      # which floods loki with timestamps older than its 7d acceptance
      # window — Loki then logs "timestamp too old" errors for every
      # rejected entry. Anonymous volume keeps positions across restarts.
      - promtail_positions:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      loki:
        condition: service_healthy
    # No docker healthcheck — grafana/promtail:3.0.0 is distroless-ish:
    # no wget/curl/nc/bash in the image, so any CMD-SHELL fails. Health
    # is monitored externally via the prometheus `promtail` scrape job
    # → `up{job="promtail"} == 0` alert (PromtailDown). Same approach
    # used for ssl-exporter for the same reason.

  grafana:
    # R4-20 digest-pinned 2026-05-17
    image: grafana/grafana:10.4.2@sha256:7d5faae481a4c6f436c99e98af11534f7fd5e8d3e35213552dd1dd02bc393d2e
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      # Datasource provisioning — Prometheus (default) + Loki.
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  artifacts:
  loki_data:
  redis_data:
  tempo_data:
  postgres_data:
  minio_data:
  mlflow_data:
  airflow_logs:
  prometheus_data:
  grafana_data:
  clamav_db:
  sandbox_staging:
  alertmanager_data:
  backups:
  promtail_positions:
