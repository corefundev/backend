
# ── Shared log-driver caps (audit R2-20, 2026-05-15) ────────────
# Default docker json-file driver has NO rotation — a verbose
# container can fill `/var/lib/docker/containers/` until the host
# disk runs out. Cap each file at 100 MB and keep 10 rotations =
# 1 GB per service ceiling. Services that opt-in via YAML anchor.
# Services NOT using this anchor inherit daemon defaults — that's
# fine for low-volume services (postgres, redis, etc.) but the
# anchor is applied to api / worker / scan-worker / process-worker /
# mlflow which have all caused log-bloat incidents historically.
x-log-rotation: &log-rotation
  driver: json-file
  options:
    max-size: "100m"
    max-file: "10"


# ── Shared environment for all Python services ──────────────────
x-common-env: &common-env
  PYTHONPATH: /app
  CONFIG_PATH: configs/config.yaml
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}       # "local" or "s3"
  ARTIFACTS_DIR: /data/artifacts
  # S3 / MinIO (used when STORAGE_BACKEND=s3)
  S3_BUCKET: ${S3_BUCKET:-sku-forecasting}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_USER:-minioadmin}}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_PASSWORD:-minioadmin}}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  # Per-zone Beget S3 (пустые поля наследуются от AWS_* / S3_*)
  S3_UNTRUSTED_BUCKET:            ${S3_UNTRUSTED_BUCKET:-sku-forecasting-untrusted}
  S3_UNTRUSTED_ENDPOINT_URL:      ${S3_UNTRUSTED_ENDPOINT_URL:-}
  S3_UNTRUSTED_ACCESS_KEY_ID:     ${S3_UNTRUSTED_ACCESS_KEY_ID:-}
  S3_UNTRUSTED_SECRET_ACCESS_KEY: ${S3_UNTRUSTED_SECRET_ACCESS_KEY:-}
  S3_UNTRUSTED_REGION:            ${S3_UNTRUSTED_REGION:-}
  S3_UNTRUSTED_KEY_PREFIX:        ${S3_UNTRUSTED_KEY_PREFIX:-}
  S3_QUARANTINE_BUCKET:            ${S3_QUARANTINE_BUCKET:-sku-forecasting-quarantine}
  S3_QUARANTINE_ENDPOINT_URL:      ${S3_QUARANTINE_ENDPOINT_URL:-}
  S3_QUARANTINE_ACCESS_KEY_ID:     ${S3_QUARANTINE_ACCESS_KEY_ID:-}
  S3_QUARANTINE_SECRET_ACCESS_KEY: ${S3_QUARANTINE_SECRET_ACCESS_KEY:-}
  S3_QUARANTINE_REGION:            ${S3_QUARANTINE_REGION:-}
  S3_QUARANTINE_KEY_PREFIX:        ${S3_QUARANTINE_KEY_PREFIX:-}
  S3_PROCESSED_BUCKET:            ${S3_PROCESSED_BUCKET:-}
  S3_PROCESSED_ENDPOINT_URL:      ${S3_PROCESSED_ENDPOINT_URL:-}
  S3_PROCESSED_ACCESS_KEY_ID:     ${S3_PROCESSED_ACCESS_KEY_ID:-}
  S3_PROCESSED_SECRET_ACCESS_KEY: ${S3_PROCESSED_SECRET_ACCESS_KEY:-}
  S3_PROCESSED_REGION:            ${S3_PROCESSED_REGION:-}
  S3_PROCESSED_KEY_PREFIX:        ${S3_PROCESSED_KEY_PREFIX:-}
  # Auth
  API_KEY: "${API_KEY:-}"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:-}"
  MODEL_SIGNING_KEY: "${MODEL_SIGNING_KEY:-}"
  # PostgreSQL client registry — primary, accepts writes.
  # R10 Phase 0-B PR-C (2026-05-31) — DATABASE_URL / DATABASE_URL_REPLICA
  # are NO LONGER set here via compose-time `${POSTGRES_PASSWORD}`
  # interpolation. That pattern only worked because the lockbox-blanks
  # overlay used to blank them back to "", letting vault_agent's
  # bootstrap_secrets() inject the real value from Lockbox into the
  # running process's env. PR-C dropped both the composed Lockbox entry
  # AND the lockbox-blanks override; removing the compose-time
  # interpolation here closes the root anti-pattern (a fake DSN with
  # a placeholder password sitting in env until runtime overrides it
  # — see [[feedback_no_secrets_in_env]]).
  #
  # The DSN is now composed inside the Python process by
  # `src/auth/vault_agent.py::_compose_database_urls_from_components`
  # from POSTGRES_PASSWORD + DB_HOST/PORT/NAME/USER components, which
  # come from Lockbox (prod/staging) or .env (dev). POSTGRES_PASSWORD
  # is the single source of truth. .env still carries the placeholder
  # POSTGRES_PASSWORD=_LOCKBOX_NOT_INJECTED_DO_NOT_USE_PG_PASSWORD so
  # the postgres service block's `:?`-strict gate is satisfied and a
  # mis-configured-Lockbox attempt fails LOUD (SCRAM-rejected — see
  # tests/integration/test_placeholder_pg_auth_rejected.py).
  # Redis — audit R3-15.
  # The default URL omits credentials so dev (REDIS_PASSWORD unset)
  # keeps working unchanged. When REDIS_PASSWORD is provided (Lockbox
  # in staging/prod), override REDIS_URL in .env to
  #   REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
  # That single override flips every consumer (jwt_auth, task_queue,
  # redis_pool, signup_rate_limit, telegram) to the authenticated path.
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  # ClamAV
  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310
  # Upload limits
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
  # Sandbox — R4-1 default is now the CD-built GHCR image (tag set via
  # SANDBOX_IMAGE_TAG, populated by cd_deploy.sh in lockstep with
  # API_IMAGE_TAG / WORKER_IMAGE_TAG). The local `sku-forecasting-sandbox`
  # tag is gone — used to be built by the one-shot `sandbox-image`
  # compose service (docker:26-cli + docker.sock bind-mount), which CD
  # never reran AND exposed the host docker daemon. Override the whole
  # ref via SANDBOX_IMAGE if needed (e.g., local dev with `docker build`).
  SANDBOX_IMAGE: ${SANDBOX_IMAGE:-ghcr.io/corefundev/sku-forecasting-sandbox:${SANDBOX_IMAGE_TAG:-main}}
  SANDBOX_TIMEOUT_SEC: ${SANDBOX_TIMEOUT_SEC:-30}
  SANDBOX_MEM_LIMIT: ${SANDBOX_MEM_LIMIT:-512m}
  SANDBOX_CPUS: ${SANDBOX_CPUS:-1.0}
  SANDBOX_MAX_ROWS: ${SANDBOX_MAX_ROWS:-5000000}
  SANDBOX_MAX_COLUMNS: ${SANDBOX_MAX_COLUMNS:-64}
  SANDBOX_WORK_DIR: /var/lib/sku-sandbox
  # MLflow
  MLFLOW_TRACKING_URI: http://mlflow:5000
  # OTel — api/worker emit traces here. tempo accepts OTLP/gRPC on 4317.
  # When unset, src/monitoring/tracing.py falls back to a console exporter.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317

services:

  # ── DB migrations (one-shot, runs before everything else) ─────
  # Applies pending SQL files from /app/migrations/ via the script
  # at /app/scripts/migrate.py. Exits 0 on success, non-zero on first
  # failure; api/worker/scan-worker/process-worker block on
  # service_completed_successfully so they never start against an
  # outdated schema. Replaces in-process DDL that used to race on
  # pg_type during multi-worker startup.
  migrate:
    image: ghcr.io/corefundev/sku-forecasting-api:${API_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "scripts/migrate.py"]
    # R11-M14: bound the one-shot migrate job (escaped the R5-M9 resource
    # sweep). Matches the api image's footprint; a runaway DDL can't OOM
    # the host.
    mem_limit: 512m
    cpus: 1.0
    # R11-#65 — app tier runs as USER sku (non-root, Dockerfile) and needs
    # no Linux capabilities: pure-Python, no privileged ports, no chown.
    # cap_drop ALL + no-new-privileges across api/workers/migrate.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      <<: *common-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    logging: *log-rotation   # R5-M10

  # ── Inference API ─────────────────────────────────────────────
  # Image is published to GHCR by .github/workflows/cd.yml. Local dev
  # also works: `docker compose build api` produces an image with the
  # same tag so `up` reuses it without pulling. Pin the tag via env
  # var API_IMAGE_TAG=<sha>; defaults to :main for dev (R4-21 — `:latest`
  # is no longer pushed by CD, narrowing the attack surface of the
  # unbounded `:latest` namespace; `:main` always tracks main-tip).
  api:
    image: ghcr.io/corefundev/sku-forecasting-api:${API_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    logging: *log-rotation
    mem_limit: 768m
    cpus: 1.5
    security_opt:                 # R11-#65
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      # PgBouncer cutover step 5 of #186 — process-worker (step 4) ran
      # 5000+ transactions clean over 21h soak. Now api + worker +
      # scan-worker join the pool. vault_agent rewrites DATABASE_URL
      # host:port post-Lockbox-inject. Rollback: remove these three
      # lines, recreate, traffic returns to postgres:5432 directly.
      DB_HOST_OVERRIDE: "pgbouncer:6432"
      # R10-S6 — METRICS_TOKEN is delivered by Lockbox bootstrap
      # (docker-compose.lockbox.yml blanks it; bootstrap_secrets injects
      # it at startup). NOT set here — secrets never go in compose env.
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      postgres:  { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      redis:     { condition: service_healthy }
      migrate:   { condition: service_completed_successfully }
    restart: unless-stopped
    # Opt into autoheal — api is the request path. /health probes the
    # actual deps (redis + postgres), so unhealthy = real deps gone or
    # a stuck worker pool. A restart cleanly recovers either case.
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Training worker (rq worker) ───────────────────────────────
  worker:
    image: ghcr.io/corefundev/sku-forecasting-worker:${WORKER_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    logging: *log-rotation
    mem_limit: 1500m   # training: lightgbm + pandas frames can spike
    cpus: 2.0
    security_opt:                 # R11-#65
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: rq worker sku-training --url redis://redis:6379
    environment:
      <<: *common-env
      DB_HOST_OVERRIDE: "pgbouncer:6432"   # #186 step 5 — see api block
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      redis:     { condition: service_healthy }
      postgres:  { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      migrate:   { condition: service_completed_successfully }
    restart: unless-stopped
    # Healthcheck: worker has no HTTP endpoint, so we verify it can reach
    # Redis (its only hard dependency). If Redis is gone, the worker is
    # useless and docker will restart it.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3).ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Upload pipeline: scan worker ──────────────────────────────
  # Streams untrusted bytes into ClamAV; never writes attacker data to disk.
  scan-worker:
    image: ghcr.io/corefundev/sku-forecasting-worker:${WORKER_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    logging: *log-rotation
    mem_limit: 256m
    cpus: 0.5
    security_opt:                 # R11-#65
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: rq worker sku-scan --url redis://redis:6379
    environment:
      <<: *common-env
      DB_HOST_OVERRIDE: "pgbouncer:6432"   # #186 step 5 — see api block
    depends_on:
      redis:     { condition: service_healthy }
      postgres:  { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      # service_started (not service_healthy) — clamav freshclam reloads
      # transiently flap the healthcheck; we don't want one stuck-unhealthy
      # event to block scan-worker recreate during a deploy. scan-worker's
      # job code already gracefully fails individual scan tasks if clamav
      # is unreachable. autoheal restarts clamav anyway.
      clamav:    { condition: service_started }
      minio:     { condition: service_healthy }
      migrate:   { condition: service_completed_successfully }
    restart: unless-stopped
    # Scan worker additionally needs ClamAV; we probe both.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import os,redis,socket
          redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3).ping()
          s=socket.create_connection((os.environ.get('CLAMAV_HOST','clamav'), int(os.environ.get('CLAMAV_PORT',3310))), timeout=3)
          s.close()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Upload pipeline: sandbox/process worker ───────────────────
  # R11-#66 — NO Docker socket here anymore: secure_parser containers
  # are spawned by the sandbox-broker service (below) over a dedicated
  # internal network. This worker only stages files into the shared
  # sandbox dir and reads results back from it.
  process-worker:
    image: ghcr.io/corefundev/sku-forecasting-worker:${WORKER_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    logging: *log-rotation
    mem_limit: 768m   # sandbox parsing — large CSV/parquet → spike
    cpus: 1.0
    security_opt:                 # R11-#65 (sock already gone via #66)
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: rq worker sku-process --url redis://redis:6379
    environment:
      <<: *common-env
      # PgBouncer cutover, step 4 of #186 — process-worker is the most
      # isolated service (no LISTEN/NOTIFY, no long-lived sessions, no
      # admin queries), so it cuts over first to validate the txn-pool
      # path under real workload before we move api + other workers.
      # vault_agent rewrites DATABASE_URL host:port post-Lockbox-inject.
      DB_HOST_OVERRIDE: "pgbouncer:6432"
      SANDBOX_BROKER_URL: "http://sandbox-broker:8100"
    volumes:
      - sandbox_staging:/var/lib/sku-sandbox
    networks:
      - default
      - sandbox-broker
    depends_on:
      redis:     { condition: service_healthy }
      postgres:  { condition: service_healthy }
      pgbouncer: { condition: service_healthy }   # cutover dependency — see DB_HOST_OVERRIDE
      minio:     { condition: service_healthy }
      migrate:   { condition: service_completed_successfully }
      sandbox-broker: { condition: service_healthy }
    restart: unless-stopped
    # Process worker checks: Redis + sandbox-broker reachability.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import os,redis,urllib.request
          redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3).ping()
          urllib.request.urlopen(os.environ['SANDBOX_BROKER_URL'].rstrip('/') + '/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Sandbox broker — the ONLY holder of docker.sock for sandbox work ──
  # R11-#66: a raw RW socket in process-worker was host-root-equivalent,
  # and a path-filtering socket proxy can't fix that (container CREATE,
  # which the worker legitimately needs, accepts an arbitrary HostConfig
  # — privileged, host mounts). The broker inverts the trust: it exposes
  # exactly one capability over a dedicated internal network — run the
  # pinned secure_parser profile (sandbox.spawn_and_wait) on a file
  # inside the shared staging dir. No DB, no Redis, no Lockbox SA key —
  # the broker never sees a secret.
  sandbox-broker:
    image: ghcr.io/corefundev/sku-forecasting-worker:${WORKER_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    logging: *log-rotation
    mem_limit: 256m
    cpus: 0.5
    command: python -m uvicorn src.storage.sandbox_broker:app --host 0.0.0.0 --port 8100
    # Deliberately NOT *common-env (no DSN/secrets here) — so the
    # sandbox knobs the broker needs must be passed explicitly. Same
    # expressions as the x-common-env block above.
    environment:
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-ghcr.io/corefundev/sku-forecasting-sandbox:${SANDBOX_IMAGE_TAG:-main}}
      SANDBOX_TIMEOUT_SEC: ${SANDBOX_TIMEOUT_SEC:-30}
      SANDBOX_MEM_LIMIT: ${SANDBOX_MEM_LIMIT:-512m}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1.0}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runc}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_staging:/var/lib/sku-sandbox
    networks:
      - sandbox-broker
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import urllib.request
          urllib.request.urlopen('http://localhost:8100/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── ClamAV antivirus ──────────────────────────────────────────
  clamav:
    # R4-20 digest-pinned 2026-05-17 — floating :1.4 could silently
    # ship a different layer set after a Docker Hub re-push. Pin to the
    # observed prod digest; bump intentionally with a fresh `docker
    # manifest inspect clamav/clamav:1.4`.
    image: clamav/clamav:1.4@sha256:2859f99b97a70f84fb524faf54fdd7e3a5d8ac084e79f03a704b334526106923
    # Opt into autoheal — clamd socket transiently drops during freshclam
    # signature reloads (~hourly); without autoheal the container ends up
    # in "unhealthy" forever and blocks scan-worker recreate via depends_on.
    labels:
      autoheal: "true"
    mem_limit: 1500m   # baseline ~1G (sig db loaded), spikes during scan
    cpus: 1.0
    ports: []        # no host ports — internal only
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamav_db:/var/lib/clamav
    # R11-#97 data-tier hardening — clamav stays root (its /init MUST run as
    # root: chowns the db volume, creates /run/clamav, then clamd+freshclam
    # drop to the clamav user via their own `--user=clamav`). cap_drop ALL +
    # no-new-privileges removes ~all ambient power; the 5 caps below are the
    # minimum the real startup needs — each empirically confirmed on staging
    # (fresh-volume clamd reached `clamdcheck OK` in ~15s, both daemons running
    # as the clamav user; dropping any one of them broke startup):
    #   CHOWN        — /init: `chown -R clamav /var/lib/clamav` + `install -o
    #                  clamav /run/clamav`
    #   FOWNER       — /init: `install -m 775` chmods the clamav-owned /run/clamav
    #   DAC_OVERRIDE — clamd/freshclam open their clamav-owned 0640 logfiles
    #                  (/var/log/clamav/*.log shipped by the image) WHILE STILL
    #                  ROOT, before the --user drop → root needs DAC_OVERRIDE to
    #                  write a file it doesn't own. Without it both daemons die
    #                  "Failed to open log file … Permission denied".
    #   SETGID/SETUID— clamd+freshclam `--user=clamav`: setgid()+initgroups()+
    #                  setuid() (initgroups→setgroups(2) needs CAP_SETGID even
    #                  for root). Without them the privilege drop fails.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # R5-M10 — bound docker json-log file size to avoid filling host disk on chatty service.
    logging: *log-rotation
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s          # signature DB download on first boot

  # ── Sandbox image — R4-1 ──────────────────────────────────────
  # Removed: the previous `sandbox-image` one-shot service built the image
  # locally on the VPS via `docker:26-cli` with /var/run/docker.sock bind-
  # mounted. Two problems closed by the removal:
  #   1) CD never reran the one-shot, so Dockerfile.sandbox changes
  #      (apt-upgrade Trivy patches, requirements-sandbox.txt bumps)
  #      silently failed to land on prod.
  #   2) docker.sock bind-mount + a CLI-only container exposed the host
  #      docker daemon to a service whose only job was to call docker.
  # Replacement: cd.yml `Build + push sandbox image` step produces
  # ghcr.io/corefundev/sku-forecasting-sandbox:${SANDBOX_IMAGE_TAG} per
  # commit; cd_deploy.sh pulls it explicitly; process-worker reads the
  # SANDBOX_IMAGE env (default above) to invoke `docker run`.

  # ── Redis ─────────────────────────────────────────────────────
  # Audit R3-15 — when REDIS_PASSWORD is set, the server starts with
  # --requirepass; redis-cli picks up REDISCLI_AUTH for the healthcheck.
  # When empty, falls back to no-auth (legacy behaviour) but logs a
  # loud warning so ops sees the gap. Production overrides REDIS_PASSWORD
  # via Lockbox (key listed in LOCKBOX_ALLOWED_KEYS).
  # R11-#97 — one-shot: pre-own redis_data as redis (999:1000) before the
  # now-non-root redis starts. Historically redis ran as ROOT (the compose
  # `command:` wraps redis-server in `sh -c`, so $1!='redis-server' and the
  # image entrypoint's setpriv-to-redis drop never triggered), so the existing
  # dump.rdb is root:root mode 0600. Switching redis to user 999 under
  # cap_drop ALL (no CAP_DAC_OVERRIDE) means it could not overwrite that
  # root-owned RDB → BGSAVE would fail silently and persistence would break.
  # This init chowns the volume so redis-999 owns its RDB. Same pattern as
  # pushgateway-init. (Fresh volumes already inherit redis:redis from the
  # image's /data, but existing prod/staging volumes carry root-owned files.)
  redis-init:
    image: redis:7.2-alpine@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
    entrypoint: ["sh", "-c", "chown -R 999:1000 /data"]
    volumes:
      - redis_data:/data
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *log-rotation

  redis:
    # R4-20 digest-pinned 2026-05-17
    image: redis:7.2-alpine@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
    mem_limit: 256m
    cpus: 0.5
    # R11-#97 — run as the redis user (999:1000) instead of root, with ALL caps
    # dropped + no-new-privileges. redis-server binds the unprivileged 6379 and
    # writes only its own (now redis-owned) /data, so it needs zero Linux caps.
    # This also fixes the pre-existing "redis runs as root" gap (the sh -c
    # command wrapper defeated the image entrypoint's auto-drop). Waits for
    # redis-init to chown the volume first.
    user: "999:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis-init:
        condition: service_completed_successfully
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDISCLI_AUTH:  ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD"
        else
          echo "[R3-15] WARN: REDIS_PASSWORD unset — Redis starting WITHOUT auth (dev only)" >&2
          exec redis-server
        fi
    restart: unless-stopped
    # R5-M10 — bound docker json-log file size to avoid filling host disk on chatty service.
    logging: *log-rotation
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── PostgreSQL (client registry) ──────────────────────────────
  # Custom image — postgres:16-alpine + mc + lockbox_bootstrap.sh so the
  # WAL archive_command (#183) can push to S3 without any creds living
  # in /srv/backend/.env. Same pattern as alertmanager / postgres-
  # exporter / backup. See docker/Dockerfile.postgres + scripts/
  # postgres_entrypoint.sh + scripts/wal_archive.sh.
  postgres:
    build:
      context: ..
      dockerfile: docker/Dockerfile.postgres
    image: docker-postgres:custom
    mem_limit: 1500m   # shared_buffers + work_mem for ~10 concurrent
    cpus: 1.5
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sku
      # Audit R3-13 — strict `:?` gate (2026-05-16, follow-up to the
      # graceful-fallback shipped in 5b13ea0). Any deploy that reaches
      # compose-up without POSTGRES_PASSWORD set in env fails fast at
      # compose-config time with the explicit message below.
      #
      # `.env` carries a STRUCTURAL PLACEHOLDER value
      # (`POSTGRES_PASSWORD=_LOCKBOX_NOT_INJECTED_DO_NOT_USE_PG_PASSWORD`).
      # The placeholder is set ONCE at VPS bootstrap and is NEVER the
      # real password — its only purpose is to satisfy this strict-
      # gate at compose-config time. The real value lives only in
      # Yandex Lockbox + is injected per-container at runtime: Python
      # `bootstrap_secrets()` for api/worker/scan-worker/process-
      # worker; shell `lockbox_bootstrap.sh` entrypoint for
      # postgres-exporter / pgbouncer / mlflow / alertmanager / backup
      # / postgres. The format is enforced by
      # `tests/integration/test_placeholder_pg_auth_rejected.py` which
      # asserts postgres SCRAM REJECTS this exact string — so even if
      # some future bug routes the placeholder through to an actual
      # auth attempt, postgres refuses it.
      #
      # The historical `cd_deploy.sh:inject_lockbox_key` mechanism that
      # tried to refresh .env from Lockbox at deploy time was removed
      # 2026-05-27 — it was a functional no-op (host-vs-container SA-
      # path mismatch + redundant with runtime injection). See
      # cd_deploy.sh's R3-13/R10 Phase 0-C NOTE for the full reasoning.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD placeholder missing — add `POSTGRES_PASSWORD=_LOCKBOX_NOT_INJECTED_DO_NOT_USE_PG_PASSWORD` to /srv/backend/.env (one-time VPS bootstrap; this is a STRUCTURAL placeholder, not the real password — real value lives in Lockbox and is injected per-container at runtime; see comment block above)}
      POSTGRES_DB: sku_forecasting
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *log-rotation   # R5-M10
    # 2026-05-30 — STABLE IP. pgbouncer's c-ares resolver wedges when
    # postgres is recreated with a NEW IP under a running pgbouncer
    # ("DNS lookup failed: postgres: result=0", non-self-healing; see
    # the order note in cd_deploy.sh). Pinning postgres to a static IP
    # in the static half of the subnet (the top-level `networks:` block
    # at the end of this file reserves 172.18.128.0/17 for dynamic
    # allocation, leaving 172.18.0.0/17 free for statics) means a
    # postgres recreate reclaims the SAME IP — pgbouncer's cached
    # resolution stays valid → wedge eliminated on EVERY path (CD,
    # manual `up -d --build postgres`, crash-restart, reboot).
    networks:
      default:
        ipv4_address: 172.18.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sku -d sku_forecasting"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PgBouncer (transaction-mode connection pool, #186) ────────
  # Sits between app pools and Postgres. Apps point at pgbouncer:6432
  # instead of postgres:5432; PgBouncer reuses a small pool of real PG
  # connections across many client connections. transaction-mode is
  # safe here because the codebase has no LISTEN/NOTIFY, advisory
  # locks, server-side prepared statements (asyncpg cache disabled),
  # WITH HOLD cursors or session-level SET — see #186 audit notes.
  #
  # Image choice: edoburu/pgbouncer (alpine-based, community-maintained).
  # We're not on bitnami/* because Bitnami pulled all free-tier images
  # off Docker Hub in 2025 (bitnami/pgbouncer:1.22.1 returns 404).
  #
  # Side-by-side rollout: postgres:5432 stays open. Cutover happens
  # one app at a time by repointing DATABASE_URL → pgbouncer:6432.
  pgbouncer:
    # Custom image — alpine + pgbouncer + postgresql16-client, with an
    # entrypoint that pulls the SCRAM secret out of pg_authid into
    # userlist.txt at start time. Off-the-shelf images (edoburu, bitnami-
    # legacy) generate userlist.txt with md5 hashes which don't match
    # PG14+'s default scram-sha-256 storage.
    build:
      context: ..
      dockerfile: docker/Dockerfile.pgbouncer
    image: docker-pgbouncer:custom
    mem_limit: 128m
    cpus: 0.5
    # Hardening: read-only rootfs + tmpfs for /etc/pgbouncer means
    # userlist.txt (which holds the SCRAM secret) lives in RAM and is
    # gone the moment the container stops — no on-disk persistence of
    # the hash, no rotation-residue, no host-side leak via docker cp.
    # cap_drop: ALL + no-new-privileges close the standard escalation
    # surfaces; pgbouncer needs no caps beyond network bind.
    read_only: true
    # mode=1777 (world-writable + sticky) matches normal /tmp semantics —
    # compose tmpfs short syntax doesn't reliably honor uid=/gid= across
    # docker versions, so the safe portable cell is "everyone can write,
    # only owner can rm" like the kernel's default. /etc/pgbouncer needs
    # a higher mode because the entrypoint chown'd it to postgres at
    # build time and now that chown lives only in the immutable rootfs;
    # tmpfs mount overrides it back to default ownership.
    tmpfs:
      - /etc/pgbouncer:mode=1777
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      DB_HOST:           postgres
      DB_PORT:           "5432"
      DB_USER:           sku
      # Audit R3-13 — references the required var from postgres service.
      DB_PASSWORD:       ${POSTGRES_PASSWORD}
      DB_NAME:           sku_forecasting
      LISTEN_PORT:       "6432"
      AUTH_TYPE:         scram-sha-256
      POOL_MODE:         transaction
      # 25 real PG conns multiplexed across up to 200 client conns —
      # 8× headroom over today's ~50 active conns, room to add another
      # api instance without touching postgres max_connections.
      DEFAULT_POOL_SIZE:    "25"
      MAX_CLIENT_CONN:      "200"
      MAX_DB_CONNECTIONS:   "50"
      # Wait up to 30s for a free server conn before erroring — matches
      # api command_timeout. Without this, bursty traffic would surface
      # as "no more connections allowed" instead of just queuing.
      QUERY_WAIT_TIMEOUT:   "30"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    logging: *log-rotation   # R5-M10
    # Opt into autoheal — pgbouncer is the pool layer on every DB query.
    # 2026-05-30: even with the static-postgres-IP root fix (#51), other
    # unhealthy paths exist (auth-state drift, userlist corruption,
    # deadlocks on overload). Healthcheck is auth-aware (real SELECT 1
    # through the pool), so unhealthy = the pool is genuinely broken →
    # a restart cleanly recovers.
    labels:
      autoheal: "true"
    # Auth-aware healthcheck: actually authenticate as DB_USER and SELECT 1
    # via pgbouncer:6432. Catches userlist.txt corruption / SCRAM mismatch
    # which the prior pg_isready test would silently miss. Reads password
    # from /etc/pgbouncer/.healthcheck-pw which the entrypoint stashes
    # in tmpfs (Docker healthchecks don't inherit Lockbox-bootstrapped
    # runtime env from PID 1, only Config.Env from container start).
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$(cat /etc/pgbouncer/.healthcheck-pw 2>/dev/null) psql -h 127.0.0.1 -p 6432 -U \"$$DB_USER\" -d \"$$DB_NAME\" -tAc 'SELECT 1' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── MinIO (local S3-compatible storage — DEV ONLY) ────────────
  # R4-13 marked MinIO as dead-in-prod (Beget S3 is the actual
  # backend); R4-20/R4-21 close the residual exposure by
  # profile-gating + digest-pinning. With `profiles: ["dev"]` the
  # service is excluded from the default compose stack and only
  # starts when explicitly requested via `--profile dev`. Prod CD
  # never enables that profile, so prod can no longer accidentally
  # boot MinIO via a stray `compose up`.
  minio:
    profiles: ["dev"]
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z@sha256:0bd79595dbcf155782860716abf4cf79d5ee32a9508b60fa1a88793bbe55b245
    ports:
      - "9000:9000"
      - "9001:9001"       # MinIO Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}  # Задайте в .env для production
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}  # Задайте в .env для production
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Creates all three zone buckets on startup.
  # NOTE: bucket policies in MinIO are set via `mc anonymous` / `mc policy`;
  # in real S3 (Beget/AWS), use IAM per-role policies as documented in
  # .env.example. The MinIO policies below just block anonymous access.
  # R4-20/R4-21 — profile-gated + digest-pinned alongside minio above.
  minio-init:
    profiles: ["dev"]
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_USER:-minioadmin} $${MINIO_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/$${S3_BUCKET:-sku-forecasting};
        mc mb --ignore-existing local/$${S3_UNTRUSTED_BUCKET:-sku-forecasting-untrusted};
        mc mb --ignore-existing local/$${S3_QUARANTINE_BUCKET:-sku-forecasting-quarantine};
        mc anonymous set none local/$${S3_BUCKET:-sku-forecasting};
        mc anonymous set none local/$${S3_UNTRUSTED_BUCKET:-sku-forecasting-untrusted};
        mc anonymous set none local/$${S3_QUARANTINE_BUCKET:-sku-forecasting-quarantine};
        echo 'Buckets ready';
      "
    environment:
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-sku-forecasting}
      S3_UNTRUSTED_BUCKET: ${S3_UNTRUSTED_BUCKET:-sku-forecasting-untrusted}
      S3_QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:-sku-forecasting-quarantine}
    restart: "no"

  # ── MLflow tracking server ────────────────────────────────────
  mlflow:
    # v3.x clears the 2.x CVE bundle (path traversal, command exec,
    # auth bypass) — see requirements.txt for the matching client pin.
    #
    # mem_limit 2g (was 1g): mlflow 3.x with uvicorn defaults to 4
    # workers × ~250-500MB each. At 1g we sat at 78% on cold start and
    # OOM-killed the moment any artifact streamed → restart loop with
    # ExitCode=0 (Docker masks the OOM after the kill if reaped fast).
    # 2g + --workers 1 keeps the math comfortably under: ~600MB peak
    # observed.
    # R8-12 / R10 Phase 0 — custom Lockbox-aware image (Debian-slim base
    # + lockbox_bootstrap.sh): the entrypoint fetches S3_MLFLOW_* from
    # Yandex Lockbox at startup and serves artifacts via the proxy
    # (mlflow-artifacts:// scheme), so the worker HTTP-PUTs to mlflow:5000
    # instead of needing S3 creds itself. Upstream mlflow pinned to
    # v3.13.0 + digest inside docker/Dockerfile.mlflow (R11-#82 parity;
    # R4-20 digest discipline preserved).
    build:
      context: ..
      dockerfile: docker/Dockerfile.mlflow
    logging: *log-rotation
    mem_limit: 2g
    cpus: 1.0
    # R12-#86 — the entrypoint's root phase only reads the SA key, then
    # gosu-drops to the dedicated `mlflow` user. SETUID/SETGID are the
    # caps gosu needs for that drop; everything else is off the table.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    ports:
      - "5000:5000"
    # NB R8-12 / R10 Phase 0 — `--backend-store-uri` AND `--artifacts-
    # destination` are NOT here, both are built in the entrypoint at
    # runtime from Lockbox-injected values:
    #   * `--backend-store-uri`: compose interpolates ${POSTGRES_PASSWORD}
    #     from /srv/backend/.env at config-load, but by R3-13 design
    #     .env only carries the structural placeholder
    #     `_LOCKBOX_NOT_INJECTED_DO_NOT_USE_PG_PASSWORD` — the real
    #     value lives in Lockbox and is injected per-container at
    #     runtime by lockbox_bootstrap.sh.
    #   * `--artifacts-destination`: hardcoding `s3://sku-mlflow/mlflow/`
    #     here makes staging silently write to the prod bucket if
    #     Selectel IAM is permissive (bug observed 2026-05-26 during
    #     Phase 0-A — staging Lockbox returned staging creds, but those
    #     creds also had write-access to the prod bucket so the proxy
    #     upload succeeded into the wrong place). Composing in the
    #     entrypoint from S3_MLFLOW_BUCKET keeps each env in its own
    #     bucket even if IAM stays permissive.
    # See scripts/mlflow_entrypoint.sh for both compositions.
    # R8-3 — `--allowed-hosts` is REQUIRED on mlflow 3.x (DNS-rebinding
    # mitigation); without it, every worker→mlflow:5000 call returns 403.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --workers 1
      --allowed-hosts mlflow,mlflow:5000,localhost,127.0.0.1
      --default-artifact-root mlflow-artifacts:/
      --serve-artifacts
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    # Opt into autoheal — mlflow's tracking server is stateless (state
    # is in postgres + artifacts in S3); a restart resolves stuck states
    # without data loss. /health probes the live server, so unhealthy =
    # the server is genuinely hung.
    labels:
      autoheal: "true"
    # MLflow 2.x exposes /health on the server port.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── Airflow (profile-gated — orchestrates the DAGs in dags/, opt-in) ──
  # Profile `airflow` so a plain `docker compose up -d` does NOT bring
  # any of these up. The CD pipeline never enables it (cd_deploy.sh runs
  # the universal infra loop + the app tier, no `--profile airflow`),
  # which matches the long-standing operational intent. The 2026-05-30
  # network migration's full `up -d` accidentally surfaced these without
  # the profile gate — airflow-init failed auth (compose interpolates
  # the .env POSTGRES_PASSWORD placeholder, not the Lockbox-injected
  # value the entrypoint scripts use), airflow-webserver / -scheduler
  # then stayed `Created` blocked on the failed init. Profile-gating
  # closes the gap: definition stays in compose for the day someone
  # opts in (`up -d --profile airflow`) with real airflow secrets, but
  # is invisible to every other start path.
  airflow-webserver:
    profiles: [airflow]
    # R4-20 digest-pinned 2026-05-17 (airflow stack is NOT enabled in
    # prod cd_deploy.sh, but pinning keeps the definition consistent).
    image: apache/airflow:2.9.1@sha256:2514cee14aae54733f68d0e03680ab74112ac51524c9990377f6cc8a8af949cb
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sku:${POSTGRES_PASSWORD}@postgres:5432/sku_forecasting
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-}"
      AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY:-}"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      PYTHONPATH: /app
      <<: *common-env
    volumes:
      - ../dags:/opt/airflow/dags
      - ../src:/app/src
      - ../configs:/app/configs
      - airflow_logs:/opt/airflow/logs
      - artifacts:/data/artifacts
    command: webserver
    depends_on:
      postgres: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    profiles: [airflow]
    # R4-20 digest-pinned 2026-05-17 (airflow stack is NOT enabled in
    # prod cd_deploy.sh, but pinning keeps the definition consistent).
    image: apache/airflow:2.9.1@sha256:2514cee14aae54733f68d0e03680ab74112ac51524c9990377f6cc8a8af949cb
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sku:${POSTGRES_PASSWORD}@postgres:5432/sku_forecasting
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-}"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /app
      <<: *common-env
    volumes:
      - ../dags:/opt/airflow/dags
      - ../src:/app/src
      - ../configs:/app/configs
      - airflow_logs:/opt/airflow/logs
      - artifacts:/data/artifacts
    command: scheduler
    depends_on:
      postgres: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }
    restart: unless-stopped
    # Official Airflow scheduler health check — reports stale if the
    # scheduler loop hasn't run for >30s.
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$(hostname)\" --local || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # One-time DB init for Airflow
  airflow-init:
    profiles: [airflow]
    # R4-20 digest-pinned 2026-05-17 (airflow stack is NOT enabled in
    # prod cd_deploy.sh, but pinning keeps the definition consistent).
    image: apache/airflow:2.9.1@sha256:2514cee14aae54733f68d0e03680ab74112ac51524c9990377f6cc8a8af949cb
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sku:${POSTGRES_PASSWORD}@postgres:5432/sku_forecasting
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-}"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    command: version
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # ── Prometheus ────────────────────────────────────────────────
  # ── Postgres exporter (Prometheus target) ──────────────────────
  # Exports pg_stat_database, pg_stat_activity, etc. for the alert rules
  # (PostgresDown, PostgresConnectionsHigh).
  #
  # Custom image — bakes lockbox_bootstrap.sh so the postgres
  # credentials get fetched from Lockbox at container startup
  # (POSTGRES_PASSWORD + DB_HOST/PORT/NAME/USER; the entrypoint then
  # composes the DSN — R10 Phase 0-B PR-C). Without this we'd have to
  # keep the postgres password in /srv/backend/.env (upstream image is
  # distroless, can't run a shell-based loader).
  postgres-exporter:
    build:
      context: ..
      dockerfile: docker/Dockerfile.postgres-exporter
    mem_limit: 128m    # R5-M9
    cpus: 0.1        # R5-M9
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # R11-#97: already runs as USER nobody (Dockerfile.postgres-exporter), is
    # stateless (no data volume — just scrapes postgres over the network and
    # serves /metrics on the unprivileged port 9187), and the lockbox bootstrap
    # runs as nobody too. Needs zero Linux caps. (No gosu drop needed — unlike
    # the task's original assumption, the image already drops to nobody.)
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # R5-M10 — bound docker json-log file size to avoid filling host disk on chatty service.
    logging: *log-rotation
    healthcheck:
      test: ["CMD", "/bin/postgres_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ssl-exporter — TLS endpoint probing for cert-expiry alerts.
  # Used by the PgReplicationCertExpiringSoon alert to surface
  # `ssl_cert_not_after` for the replication TLS endpoint well before
  # the annual self-signed cert needs rotating. Has native postgres
  # StartTLS support (blackbox's YAML-byte-encoding broke the 8-byte
  # SSLRequest handshake — see commit history).
  ssl-exporter:
    # R4-20 digest-pinned 2026-05-17
    image: ribbybibby/ssl-exporter:2.4.3@sha256:f6812639a073f8eedc922e0423a57becd6302ccd04a4182108523e4ff83a2bc1
    mem_limit: 64m    # R5-M9
    cpus: 0.1        # R5-M9
    restart: unless-stopped
    # R11-#97: stateless distroless exporter — reads a config file, scrapes
    # TLS endpoints over the network. Needs zero Linux caps.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./ssl-exporter.yml:/config/ssl_exporter.yml:ro
    command:
      - "--config.file=/config/ssl_exporter.yml"
    # No healthcheck: image is distroless (no shell, no curl, no wget,
    # only /ssl_exporter binary itself). Container-level probe would
    # need a sidecar. Prometheus monitors the /probe endpoint as a
    # scrape target — that's the SLO check that matters.
    # Bounded log rotation — without this Docker uses the unbounded
    # default and historical config-parse errors stick around forever.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  # ── RQ exporter (queue metrics) ────────────────────────────────
  # Polls Redis for RQ queue stats (jobs_total, queue_size, worker_count).
  # No secrets needed — just a Redis URL.
  rq-exporter:
    # R4-20 digest-pinned 2026-05-17
    image: mdawar/rq-exporter:v3.1.0@sha256:d82dd3c4f8f385ad167688d87ff37aa9e0eeeb7dcaf331998310b2c85c2969d6
    mem_limit: 64m    # R5-M9
    cpus: 0.1        # R5-M9
    environment:
      RQ_REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # R11-#97: stateless exporter — polls Redis over the network, serves
    # /metrics. Needs zero Linux caps.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # R5-M10 — bound docker json-log file size to avoid filling host disk on chatty service.
    logging: *log-rotation
    # Functional healthcheck (incident 2026-05-17): the previous probe
    # was an HTTP 200 check on /metrics, but Flask returns 200 even
    # when rq-exporter has lost its Redis connection — it just emits
    # an empty `rq_*` series. As a result the exporter ran "healthy"
    # for 12 days while emitting zero data (DNS cache stale after a
    # redis container recreate). Probe now asserts that at least one
    # `rq_workers` line is in the response body, which can only be
    # true if the Redis scrape succeeded. When this fails for 3
    # consecutive 30-second intervals, autoheal restarts the container
    # → DNS cache clears → metrics resume.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9726/metrics',timeout=3).read().decode(); sys.exit(0 if 'rq_workers{' in r else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      # autoheal restarts containers with status=unhealthy; the rq-
      # exporter's DNS-cache-stale failure mode is exactly what autoheal
      # is for, but only with a functional healthcheck above to surface
      # the underlying failure.
      autoheal: "true"
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Pushgateway (for batch-job metrics — backup, etc.) ────────
  # Backup runs once a night. Without pushgateway we'd have to hack
  # textfile-collector or external freshness probes to know the dump
  # is fresh. With pushgateway, backup.sh ends with a one-line curl
  # to push sku_backup_last_success_timestamp_seconds, and Prometheus
  # picks it up on its next scrape. The BackupStale alert fires if
  # that timestamp is more than 25h old.
  # R11-#97 — one-shot: pre-own the pushgateway data volume as nobody:65534
  # BEFORE pushgateway (cap_drop ALL) starts. A freshly-created Docker named
  # volume is owned root:root; pushgateway runs as `nobody` and — now that it
  # has cap_drop: ALL — can neither write its --persistence.file there NOR
  # chown it. Without persistence the in-memory series are lost on every
  # recreate → BackupStale/BaseBackupStale fire on the gap (hit on staging
  # 2026-06-18). This init container owns the chown (cap_add: CHOWN only),
  # runs to completion, exits; idempotent (a no-op where the volume is already
  # nobody-owned, e.g. prod). See feedback_pushgateway_recreate_loses_metrics.
  pushgateway-init:
    # alpine pinned to the same digest used by docker/Dockerfile.postgres-exporter.
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    command: ["chown", "-R", "65534:65534", "/data"]
    volumes:
      - pushgateway_data:/data
    # Runs as root so the chown succeeds, but with ALL caps dropped except the
    # single CHOWN it needs — minimal privilege for a one-shot.
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *log-rotation

  pushgateway:
    # R4-20 digest-pinned 2026-05-17
    image: prom/pushgateway:v1.9.0@sha256:98a458415f8f5afcfd45622d289a0aa67063563bec0f90d598ebc76783571936
    mem_limit: 128m    # R5-M9
    cpus: 0.1        # R5-M9
    restart: unless-stopped
    # R11-#97 — wait for pushgateway-init to chown the data volume so the
    # cap-dropped pushgateway can write its --persistence.file.
    depends_on:
      pushgateway-init:
        condition: service_completed_successfully
    # R11-#97: stateless metrics cache — receives pushes, serves /metrics,
    # writes only its persistence file to a named volume. Needs zero caps.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # R5-M10 — bound docker json-log file size to avoid filling host disk on chatty service.
    logging: *log-rotation
    # R5-16 (2026-05-17) — persistence flag + named volume. The
    # pushgateway state is in-memory by default; every container
    # recreate wipes all pushed series and the metrics stay absent
    # until each producer pushes again at its next cron interval.
    # Observed twice in two hours (Phase 2 full recreate + R5-15
    # nginx-rebuild side-effect on pushgateway-1) — BackupStale +
    # BaseBackupStale fired on the gap until manual re-push. With
    # `--persistence.file=/data/pushgateway.dump` pushgateway writes
    # state to disk on every push + on graceful shutdown, and reads
    # it on startup. Survives container recreate. Trade-off: tiny
    # disk write per push (~10 metrics × few hundred bytes) +
    # `pushgateway_data` named volume (kB-scale).
    command:
      - "--persistence.file=/data/pushgateway.dump"
      # 2026-05-30 — tightened from 5m. A 5-minute window meant a
      # pushgateway crash / recreate within ~5m of a successful push
      # lost the metric until the next natural cron tick (24h for the
      # daily backup metric). 30s shrinks the in-flight-loss window to
      # noise; disk cost is bytes-per-write × every 30s = nothing on
      # the host. Combined with backup_metric_warmup.sh (now in the
      # backup container's CMD), even an empty/fresh volume gets
      # re-warmed from S3 within seconds of any restart.
      - "--persistence.interval=30s"
    volumes:
      - pushgateway_data:/data
    # Internal-only — backup pushes from inside docker network,
    # prometheus scrapes from inside docker network.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  prometheus:
    # R10-S6 — custom image (alpine + lockbox_bootstrap.sh): the
    # container fetches METRICS_TOKEN from YC Lockbox at startup and
    # writes it to /run/metrics_token for the api /metrics scrape job.
    # The token never touches /srv/backend/.env. Upstream prometheus is
    # pinned to v2.55.1 + digest inside docker/Dockerfile.prometheus
    # (the R4-20 / R2-29 version-history rationale is preserved there).
    build:
      context: ..
      dockerfile: docker/Dockerfile.prometheus
    mem_limit: 512m    # R5-M9
    cpus: 1.0        # R5-M9
    ports:
      - "9090:9090"
    volumes:
      # R6-5 (2026-05-18) — bind-mount the directory, not single files.
      # Docker bind-mounts single files at fixed inode at container
      # start; a host-side atomic rewrite (scp/cp/mv) replaces the
      # inode, but the container keeps reading the original. Directory
      # bind-mounts resolve paths on every syscall, so editing files
      # inside the directory propagates immediately — `/-/reload`
      # alone is enough, no restart needed. Overlay onto
      # /etc/prometheus/ (we don't use the image's default consoles/).
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
      # R10-S6 — the /metrics scrape-auth token is NOT a bind-mounted
      # host file: docker-compose.lockbox.yml mounts the YC SA key and
      # the custom entrypoint fetches METRICS_TOKEN from Lockbox, writing
      # /run/metrics_token inside the container. No secret on the host FS.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"   # allows reload via HTTP POST /-/reload
    # DNS indirection for replica postgres-exporter. prometheus.yml
    # scrapes `postgres-replica.internal:9187`; we resolve that alias
    # here so the replica IP can be rotated via REPLICA_EXPORTER_HOST
    # in .env / Lockbox without editing checked-in YAML. Default falls
    # back to the current prod replica IP for backward compat.
    extra_hosts:
      - "postgres-replica.internal:${REPLICA_EXPORTER_HOST:-212.8.226.233}"
    restart: unless-stopped
    # R11-#97: already runs as USER nobody (Dockerfile.prometheus) and the
    # lockbox bootstrap + /run/metrics_token write happen as nobody too —
    # needs zero Linux caps (TSDB writes to a volume it owns; port 9090 is
    # unprivileged). No *-init needed (unlike pushgateway): the custom image
    # does `chown -R nobody:nobody /prometheus`, so a fresh named volume
    # inherits nobody ownership via Docker's copy-on-first-mount. Verified
    # live: /prometheus is 65534:65534 on prod + staging.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # R5-M10 — bound docker json-log file size to avoid filling host disk on chatty service.
    logging: *log-rotation
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── docker-socket-proxy — least-privilege Docker API for autoheal ──
  # 2026-05-30: autoheal previously mounted the raw `/var/run/docker.sock`
  # read/write — full Docker daemon access. On a PII-tier SaaS that's a
  # critical surface: a compromised autoheal could exec into any
  # container, mount host paths, pull arbitrary images, write to the
  # daemon. The proxy reduces that surface to "GET containers" + "POST
  # container actions" (restart/start/stop/kill). All other Docker API
  # verbs are explicitly denied.
  #
  # autoheal connects over the docker network at tcp://docker-socket-proxy:2375
  # (internal-only — no host port exposed). The proxy itself mounts the
  # socket :ro and runs read_only/cap_drop ALL/no-new-privileges so even
  # the proxy can't write to the socket file or escalate.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    mem_limit: 32m
    cpus: 0.05
    environment:
      # Verbs explicitly listed (default-deny is the proxy's default,
      # but listing the dangerous ones documents intent + survives a
      # future proxy-version default change):
      CONTAINERS: 1   # GET /containers/* — list + inspect (autoheal's read path)
      POST: 1         # POST verbs — gated by other resource flags; here = container actions only
      # Everything else explicitly denied:
      BUILD:    0
      COMMIT:   0
      EXEC:     0     # KEY: blocks `docker exec` even if autoheal is compromised
      IMAGES:   0
      INFO:     0
      NETWORKS: 0
      VOLUMES:  0
      SECRETS:  0
      CONFIGS:  0
      PLUGINS:  0
      SERVICES: 0
      SWARM:    0
      SYSTEM:   0
      TASKS:    0
      NODES:    0
      SESSION:  0
      DISTRIBUTION: 0
      LOG_LEVEL: "warning"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro    # READ-only sock mount
    # 2026-05-30: tried `read_only: true` + tmpfs at /usr/local/etc/haproxy,
    # but tecnativa/docker-socket-proxy's HAProxy entrypoint runs
    # `sed -i …/haproxy.cfg.template > haproxy.cfg`, AND the template
    # itself lives at /usr/local/etc/haproxy/haproxy.cfg.template
    # (rootfs). A tmpfs on that directory masks the template →
    # "haproxy.cfg.template: No such file or directory" crash-loop
    # (observed prod 2026-05-30 after #56's tmpfs attempt).
    #
    # Dropped read_only on the rootfs. The remaining hardening is what
    # actually limits blast radius if the proxy is compromised:
    # cap_drop ALL (no NET_ADMIN/SYS_ADMIN/etc.), no-new-privileges
    # (kill SUID/setcap escalation), sock mounted :ro (proxy can't
    # corrupt the socket FILE), and the env-allowlist scopes the
    # Docker API surface to CONTAINERS=1 + POST=1 (~restart only).
    # Writable rootfs WITHOUT those layers would be worst-case; here
    # the worst case is "write to a per-container ephemeral rootfs"
    # that's gone on `docker rm` — bounded.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *log-rotation
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2375/_ping >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── autoheal — auto-restart any unhealthy container ─────────────
  # Watches docker events, restarts containers stuck in `unhealthy`
  # state. Closes a long-tail of "X stuck unhealthy after weeks of
  # uptime" issues — clamav specifically did this 3 times in a single
  # session (clamd socket transiently drops during signature reloads,
  # healthcheck retries fail, container shows unhealthy but Docker's
  # restart-policy doesn't react to healthcheck — only crash). Without
  # autoheal, the only recovery path was manual `docker restart`.
  #
  # Picks up only containers labeled `autoheal=true` (opt-in narrowly:
  # pgbouncer, api, mlflow, nginx, clamav, rq-exporter — stateless or
  # quick-to-recover services where restart=recovery; postgres / redis /
  # the monitoring stack are deliberately NOT opted in).
  #
  # 2026-05-30: replaced willfarrell/autoheal:1.2.0 with our own
  # 50-line sidecar (scripts/autoheal.py + Dockerfile.autoheal). The
  # upstream image was architecturally incompatible with TCP
  # DOCKER_SOCK — its autoheal logic is inline in /docker-entrypoint
  # (no separate `autoheal` binary) and is gated by `[ -e "$DOCKER_SOCK" ]`,
  # which fails on `tcp://...` and crash-loops with "autoheal: not found"
  # (verified prod 2026-05-30, PRs #54-#58). Reverting to a direct
  # /var/run/docker.sock mount would lose the hardening, so we replaced
  # the image instead. See [[feedback_no_revert_to_known_bad]].
  #
  # Net: same behavior (poll labeled containers, restart unhealthy),
  # PLUS the docker.sock attack surface is gone — a compromised autoheal
  # can only restart labeled containers (proxy verb allowlist), not
  # exec into them, mount host paths, or pull arbitrary images.
  autoheal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.autoheal
    image: docker-autoheal:custom
    mem_limit: 64m   # 32m was tight for python+docker-SDK; bumped
    cpus: 0.1
    environment:
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_LABEL:    "autoheal=true"
      AUTOHEAL_TIMEOUT:  "30"
      DOCKER_HOST:       "tcp://docker-socket-proxy:2375"
    # No /var/run/docker.sock mount — proxy is the only Docker API path.
    depends_on:
      docker-socket-proxy: { condition: service_healthy }
    restart: unless-stopped
    # Hardening: container is a single python process talking HTTP to
    # the proxy — needs nothing beyond network bind.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Writable scratch for the liveness heartbeat (read_only:true makes
    # the rest of the FS immutable). autoheal.py writes
    # /run/autoheal.heartbeat after each successful poll; the Dockerfile
    # HEALTHCHECK stats its mtime. tmpfs = in-memory, so the read_only
    # security posture is preserved (nothing lands on a real writable
    # layer). 1m is ample for a single epoch-timestamp file.
    #
    # mode=1777 is REQUIRED: docker mounts a tmpfs root-owned mode-0755
    # by default, but this container runs as USER 65534 (nobody) — it
    # couldn't create the heartbeat file (verified prod: `Permission
    # denied: /run/autoheal.heartbeat`). 1777 = world-writable + sticky
    # (same as /tmp), uid-agnostic so it survives a future USER change.
    tmpfs:
      - /run:size=1m,mode=1777
    # R5-M10 — bound docker json-log file size.
    logging: *log-rotation

  # ── cAdvisor (per-container metrics — restart loops, CPU/mem/IO) ─
  # Source for ContainerRestartLoop alert — exposes
  # `container_start_time_seconds`, which changes on every restart, so
  # `count(changes(container_start_time_seconds[15m]) > 5)` catches
  # crash-loops like the mlflow OOM episode (RestartCount=10458 in 3
  # days before the 1g→2g fix). Read-only mounts only — cAdvisor never
  # writes to the host.
  cadvisor:
    # R4-20 digest-pinned 2026-05-17
    image: gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    mem_limit: 256m
    cpus: 0.3
    # R11-M12: dropped `privileged: true` (all-caps + device access — a
    # host-wide blast radius on a cAdvisor CVE). cAdvisor runs
    # non-privileged with just CAP_SYS_PTRACE (for /proc/N/ns) + the
    # /dev/kmsg device + the read-only host mounts below — verified on
    # staging (2026-06-03) to emit the FULL container_* set
    # (memory/cpu/oom/start_time) under exactly this cap set.
    # NOTE: full container_* collection ALSO requires the host Docker to
    # use the classic `overlay2` storage driver. cAdvisor v0.49.1 cannot
    # read the containerd-snapshotter / `overlayfs` image layout (the
    # Docker 29 default) — it fails the container read-write-layer-ID
    # lookup and emits ZERO container metrics regardless of privilege
    # (google/cadvisor#3860). prod + staging pin overlay2 via
    # /etc/docker/daemon.json ({"storage-driver":"overlay2",
    # "features":{"containerd-snapshotter":false}}) for this reason.
    cap_drop: [ALL]
    cap_add: [SYS_PTRACE]
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.compose.service"
      # Disable noisy collectors that produce no actionable signal —
      # we only want container-level lifecycle + resource metrics.
      - "--disable_metrics=disk,diskIO,tcp,udp,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl"
      # Do NOT add `--enable_metrics=oom_event`. In cAdvisor
      # `--enable_metrics` is an ALLOWLIST that REPLACES the default
      # metric set — passing `oom_event` alone collapses collection to
      # that one collector and silently drops container_memory_* and
      # container_cpu_* entirely (root-caused on v0.49.1, 2026-06-03:
      # it was why mem/cpu series were missing even after the overlay2
      # migration). `container_oom_events_total` is already ON by
      # default in this version — it is NOT in the --disable_metrics
      # denylist above — so the OOM alert works without the flag
      # (verified: oom series present for all containers without it).
    restart: unless-stopped
    # R5-M10 — bound docker json-log file size to avoid filling host disk on chatty service.
    logging: *log-rotation
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── node_exporter (host filesystem + memory + cpu metrics) ────
  # Closes #198 — pg_wal disk-pressure alert needs filesystem metrics
  # for the postgres data volume mountpoint. Runs on the docker network
  # (so other containers can scrape it as `node-exporter:9100`) but with
  # pid:host + a read-only bind of /, /proc, /sys so it reports HOST
  # filesystems and processes. Not exposing :9100 on the host so it
  # stays internal to the docker network.
  node-exporter:
    # R4-20 digest-pinned 2026-05-17
    image: prom/node-exporter:v1.8.1@sha256:fa7fa12a57eff607176d5c363d8bb08dfbf636b36ac3cb5613a202f3c61a6631
    pid: host
    mem_limit: 64m
    cpus: 0.2
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    restart: unless-stopped
    # R11-#97: reads host /proc + /sys + / via read-only bind-mounts and the
    # host PID namespace (pid: host) — none of that needs a Linux capability,
    # so cap_drop ALL is safe. no-new-privileges blocks any escalation through
    # the (unprivileged) host visibility.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # R5-M10 — bound docker json-log file size to avoid filling host disk on chatty service.
    logging: *log-rotation
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/metrics 2>/dev/null | grep -q node_filesystem_avail_bytes"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Nightly Postgres backup ───────────────────────────────────
  # Runs at 02:10 UTC daily via busybox crond. Uses backup.sh with
  # pg_dump + AES-256 encryption + S3 upload. The same container can be
  # exec'd to run restore.sh interactively.

  backup:
    # Custom image: deps baked at build time (no runtime apk-add hangs)
    # + scripts/lockbox_bootstrap.sh as a cron wrapper that fetches
    # secrets from Lockbox before each backup run. See
    # docker/Dockerfile.backup for full rationale.
    build:
      context: ..
      dockerfile: docker/Dockerfile.backup
    mem_limit: 256m    # R5-M9
    cpus: 0.3        # R5-M9
    # tini as PID 1, crond as its child. Without init:true crond runs
    # as PID 1 and its setpgid() calls fail with "Operation not
    # permitted" because PID 1 is its own session leader and can't
    # call setpgid on itself. Symptom: container restart-loops with
    # `setpgid: Operation not permitted` in logs.
    init: true
    environment:
      # R10 Phase 0-B PR-C (2026-05-31) — DATABASE_URL is no longer set
      # here. The previous `postgresql://sku:${POSTGRES_PASSWORD}@…`
      # compose-time interpolation was a hack that only worked because
      # Lockbox bootstrap silently overrode it with the composed-pwd
      # DATABASE_URL entry at script-runtime. After PR-C dropped that
      # entry from Lockbox, cron_wrapper.sh + restore.sh source
      # scripts/compose_database_url.sh to compose the DSN from
      # POSTGRES_PASSWORD — the single source of truth. See
      # [[feedback_secret_atomicity_lockbox]] +
      # [[feedback_no_secrets_in_env]].
      # Backup S3 — отдельный аккаунт / keypair. Backup-скрипт смотрит
      # СНАЧАЛА на S3_BACKUP_* , потом fallback на общие AWS_* (dev/MinIO).
      S3_BACKUP_BUCKET:               ${S3_BACKUP_BUCKET:-sku-forecasting-backups}
      S3_BACKUP_ENDPOINT_URL:         ${S3_BACKUP_ENDPOINT_URL:-}
      S3_BACKUP_ACCESS_KEY_ID:        ${S3_BACKUP_ACCESS_KEY_ID:-}
      S3_BACKUP_SECRET_ACCESS_KEY:    ${S3_BACKUP_SECRET_ACCESS_KEY:-}
      S3_BACKUP_REGION:               ${S3_BACKUP_REGION:-}
      # Fallbacks на случай, если per-backup креды не заданы (dev + MinIO).
      S3_ENDPOINT_URL:       http://minio:9000
      AWS_ACCESS_KEY_ID:     ${MINIO_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-minioadmin}
      BACKUP_PASSPHRASE: "${BACKUP_PASSPHRASE:-}"
    volumes:
      - ../scripts:/scripts:ro
      - backups:/tmp/backup
      # 2026-05-30 — persistent state for the warmup pattern. Scripts
      # without an S3 artifact (audit_log_retention is a pure DB op)
      # write their last-success epoch here; backup_metric_warmup.sh
      # reads on container start and re-pushes the metric so a
      # pushgateway recreate doesn't false-fire its *Stale alert.
      - backup_state:/var/lib/backup-state
    # No entrypoint override — Dockerfile.backup CMD echoes the
    # "backup cron installed" sentinel then exec's crond. Crontab entry
    # uses lockbox_bootstrap.sh as a wrapper to fetch fresh secrets
    # from Lockbox before each backup run.
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
    restart: unless-stopped
    # R11-#97: stays root — dcron's crond binary is mode 0700 root:root, so
    # only root can exec it (non-root → "crond: Permission denied"). Hardening
    # is Level 1: cap_drop ALL + no-new-privileges, keeping root but dropping
    # every privileged kernel op (CAP_SYS_ADMIN, CAP_NET_ADMIN, …). cap_add
    # SETGID + SETUID is REQUIRED: to run each cron job dcron does
    # setgid()+initgroups()+setuid() to the crontab owner (ChangeUser), and
    # initgroups()→setgroups(2) needs CAP_SETGID even for root → without it
    # crond logs "initgroups failed / unable to ChangeUser" and SILENTLY runs
    # ZERO jobs (validated on staging 2026-06-20: cap_drop ALL alone → 0 fires;
    # + SETGID,SETUID → fires). The jobs themselves (pg_dump/openssl/mc/lockbox)
    # need no further caps. tini (init:true) handles setpgid.
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    # R5-M10 — bound docker json-log file size to avoid filling host disk on chatty service.
    logging: *log-rotation
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Alertmanager ──────────────────────────────────────────────
  alertmanager:
    # Custom image: alpine + lockbox_bootstrap.sh so the container fetches
    # TELEGRAM_ALERT_BOT_TOKEN / TELEGRAM_ALERT_CHAT_ID from YC Lockbox at
    # startup. The bot token never touches /srv/backend/.env — see
    # docker/Dockerfile.alertmanager + scripts/alertmanager_entrypoint.sh.
    #
    # In Lockbox-mode (prod), docker-compose.lockbox.yml mounts the SA
    # key + sets YC_SA_KEY_FILE / YC_LOCKBOX_SECRET_ID. In dev (no
    # Lockbox), set TELEGRAM_ALERT_* directly via .env — entrypoint
    # falls through to render-with-env if YC_SA_KEY_FILE is unset.
    build:
      context: ..
      dockerfile: docker/Dockerfile.alertmanager
    mem_limit: 128m    # R5-M9
    cpus: 0.1        # R5-M9
    volumes:
      # Template — contains ${TELEGRAM_ALERT_BOT_TOKEN} and
      # ${TELEGRAM_ALERT_CHAT_ID} placeholders, rendered at startup.
      # R7-7 (2026-05-19) — directory bind-mount to dodge the
      # single-file inode trap (see R6-5). entrypoint reads
      # /etc/alertmanager/alertmanager.yml.tpl and renders to
      # /tmp/alertmanager.yml.
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped
    # R11-#97: already runs as USER nobody (Dockerfile.alertmanager) and the
    # lockbox bootstrap + config render happen as nobody too — needs zero Linux
    # caps (silences/nflog written to a volume it owns; port 9093 unprivileged).
    # No *-init needed (like prometheus, unlike upstream pushgateway): the custom
    # image does `chown -R nobody:nobody /alertmanager`, so a fresh
    # alertmanager_data volume inherits nobody ownership via Docker's
    # copy-on-first-mount. Verified live: /alertmanager is 65534:65534.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # R5-M10 — bound docker json-log file size to avoid filling host disk on chatty service.
    logging: *log-rotation
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Grafana ───────────────────────────────────────────────────
  # ── Tempo (distributed tracing — OTLP backend) ────────────────
  # Receives spans from api/worker via OTEL_EXPORTER_OTLP_ENDPOINT
  # (set in their env, points at tempo:4317 gRPC). Filesystem-backed,
  # 7-day retention. Internal-only — query via Grafana → Explore →
  # Tempo. Loki's derivedField for trace_id auto-links to traces.
  tempo:
    # R4-20 digest-pinned 2026-05-17
    image: grafana/tempo:2.5.0@sha256:f0200a9bff6d14eb3a4332194f7b77c37ee1a3535e7e41db024d95aab6f1b4e8
    mem_limit: 384m    # R5-M9
    cpus: 0.5        # R5-M9
    restart: unless-stopped
    # R11-#97: trace store — reads config (ro), writes only its data volume,
    # serves over the network. Needs zero Linux caps.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # R5-M10 — bound docker json-log file size to avoid filling host disk on chatty service.
    logging: *log-rotation
    volumes:
      # R7-7 — directory bind-mount (see R6-5 inode-trap fix).
      - ./tempo:/etc/tempo:ro
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready 2>/dev/null | grep -q ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Loki + Promtail (logs aggregation) ────────────────────────
  # Loki is the storage / query side; promtail tails docker container
  # logs via the local docker socket and ships them to Loki. Both
  # internal-only — query via Grafana → Explore → Loki datasource.
  # Retention 30 days (loki-config.yaml).
  loki:
    # R4-20 digest-pinned 2026-05-17
    image: grafana/loki:3.0.0@sha256:757b5fadf816a1396f1fea598152947421fa49cb8b2db1ddd2a6e30fae003253
    mem_limit: 384m    # R5-M9
    cpus: 0.5        # R5-M9
    restart: unless-stopped
    # R11-#97: log store — reads config + rules (ro), writes only its data
    # volume, serves over the network. Needs zero Linux caps.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # R5-M10 — bound docker json-log file size to avoid filling host disk on chatty service.
    logging: *log-rotation
    volumes:
      # R7-7 — directory bind-mounts (see R6-5 inode-trap fix).
      # Loki has two mount points: config + ruler rules.
      - ./loki/etc:/etc/loki:ro
      # Loki ruler — rules under /loki/rules/<tenant>/. tenant=fake
      # for auth_enabled=false setups. Ports the 3 log-based alerts
      # that R2-8 originally tried (and failed) to express in
      # prometheus alerts.yml. See loki/etc/local-config.yaml
      # `ruler:` block.
      - ./loki/rules:/loki/rules:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready 2>/dev/null | grep -q ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  promtail:
    # R4-20 digest-pinned 2026-05-17
    image: grafana/promtail:3.0.0@sha256:d3de3da9431cfbe74a6a94555050df5257f357e827be8e63f8998d509c37af8b
    mem_limit: 128m    # R5-M9
    cpus: 0.2        # R5-M9
    restart: unless-stopped
    # R11-#97: tails container logs from read-only bind-mounts and reads the
    # docker socket (ro) for service discovery — reading mounted files/socket
    # needs no Linux capability. cap_drop ALL is safe; the ro docker.sock
    # stays (SD needs it). no-new-privileges blocks escalation.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # R5-M10 — bound docker json-log file size to avoid filling host disk on chatty service.
    logging: *log-rotation
    volumes:
      # R7-7 — directory bind-mount (see R6-5 inode-trap fix).
      - ./promtail:/etc/promtail:ro
      # Container logs (json-file driver writes here).
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Docker socket for SD (discovers running containers + their labels).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persistent positions file. Without this, every container recreate
      # makes promtail re-read all docker container logs from offset 0,
      # which floods loki with timestamps older than its 7d acceptance
      # window — Loki then logs "timestamp too old" errors for every
      # rejected entry. Anonymous volume keeps positions across restarts.
      - promtail_positions:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      loki:
        condition: service_healthy
    # No docker healthcheck — grafana/promtail:3.0.0 is distroless-ish:
    # no wget/curl/nc/bash in the image, so any CMD-SHELL fails. Health
    # is monitored externally via the prometheus `promtail` scrape job
    # → `up{job="promtail"} == 0` alert (PromtailDown). Same approach
    # used for ssl-exporter for the same reason.

  grafana:
    # 2026-05-31 — switched from the upstream image to our own
    # docker/Dockerfile.grafana that bakes lockbox_bootstrap.sh +
    # grafana_entrypoint.sh. The admin password (GRAFANA_PASSWORD)
    # is now fetched from Yandex Lockbox at startup and never
    # touches /srv/backend/.env. See [[feedback_no_secrets_in_env]]
    # for the slip that drove this.
    build:
      context: ..
      dockerfile: docker/Dockerfile.grafana
    image: docker-grafana:custom
    mem_limit: 256m    # R5-M9
    cpus: 0.3        # R5-M9
    # R12-#86 — the entrypoint's root phase reads the SA key + re-owns
    # the data volume, then su-exec-drops to grafana's UID 472. CHOWN
    # covers the one-time volume migration; SETUID/SETGID the drop.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    ports:
      - "3000:3000"
    environment:
      # GF_SECURITY_ADMIN_PASSWORD is set by grafana_entrypoint.sh from
      # the Lockbox-injected GRAFANA_PASSWORD. The entrypoint refuses
      # to start on either an empty value OR the upstream default
      # "admin" — a fresh grafana_data volume can no longer come up
      # admin/admin.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      # Datasource provisioning — Prometheus (default) + Loki.
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    # R5-M10 — bound docker json-log file size to avoid filling host disk on chatty service.
    logging: *log-rotation
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  artifacts:
  loki_data:
  redis_data:
  tempo_data:
  postgres_data:
  minio_data:
  airflow_logs:
  prometheus_data:
  grafana_data:
  clamav_db:
  sandbox_staging:
  alertmanager_data:
  backups:
  promtail_positions:
  # R5-16 — pushgateway persistence so recreate doesn't wipe metrics.
  pushgateway_data:
  # 2026-05-30 — persistent state for backup_metric_warmup.sh.
  # Holds last-success epochs for cron scripts without S3 artifacts
  # (audit_log_retention). Tiny — one int per file.
  backup_state:

# ── Networks (2026-05-30 — STABLE POSTGRES IP) ───────────────────────
# Previously implicit (auto-`docker_default`, dynamic IPs from the whole
# 172.18.0.0/16 pool). Made explicit so postgres can pin a static IP that
# survives recreate — eliminating the pgbouncer c-ares wedge root.
#
# Subnet matches what Docker had auto-assigned on both VPS (verified
# 2026-05-30: staging + prod both at 172.18.0.0/16 gw 172.18.0.1), so
# the network value itself doesn't change — only the IPAM strategy.
#
# `ip_range` splits the /16 in half:
#   • 172.18.0.0/17   — reserved for STATICS (postgres at .0.10; room
#                       for future pins). Dynamic allocation NEVER
#                       touches this half, so a dynamically-assigned
#                       container can't grab .0.10 ahead of postgres.
#   • 172.18.128.0/17 — dynamic pool for everything else (~32k IPs;
#                       stack today is ~25 containers).
#
# Migration: changing the network's IPAM config requires the network to
# be RECREATED (Docker can't reconfigure a network with attached
# containers). One-time on each VPS via a controlled `docker compose
# down && up -d` (planned maintenance window). After that, steady-state
# CD (`up -d --build postgres`) honors the static — no recreate, no
# downtime.
networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet:  172.18.0.0/16
          ip_range: 172.18.128.0/17
          gateway: 172.18.0.1
  # R11-#66 — private link between process-worker and sandbox-broker.
  # internal: no gateway, no egress; only its two members can talk.
  sandbox-broker:
    driver: bridge
    internal: true
