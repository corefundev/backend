# ══════════════════════════════════════════════════════════════
# SKU Forecasting Platform — Production orientation (Beget S3)
#
# STATUS: RETAINED FOR HISTORICAL REFERENCE.
#   The active production stack is composed from
#   docker-compose.yml + docker-compose.prod.yml +
#   docker-compose.lockbox.yml + docker-compose.minimal.yml, driven
#   by scripts/cd_deploy.sh. This file is NOT applied on prod.
#
# УРОВНИ ЗАПУСКА (legacy bootstrap modes):
#
# Level 3 (production-style) — .env НЕ НУЖЕН:
#   YC_SA_KEY_FILE=/run/secrets/yc-sa-key.json \
#   YC_LOCKBOX_SECRET_ID=xxx \
#   docker compose -f docker/docker-compose.beget.yml up -d
#
# Level 1 (dev):
#   docker compose --env-file ../.env -f docker/docker-compose.beget.yml up -d
#
# Secrets bootstrap is via Yandex Lockbox (NOT HashiCorp Vault) — see
# the comment block at the bottom of this file.
#
# ══════════════════════════════════════════════════════════════

x-common: &common
  restart: unless-stopped
  networks: [sku_net]

# Переменные которые НЕ СЕКРЕТЫ — адреса, имена, конфигурация.
# Секреты (JWT, API_KEY, AWS_*) — приходят из Lockbox в runtime
# (см. блок-комментарий внизу файла).
x-infra-env: &infra-env
  # ── Окружение ─────────────────────────────────────────────
  APP_ENV:               ${APP_ENV:-production}
  CONFIG_PATH:           ${CONFIG_PATH:-configs/config.yaml}
  # ── Хранилище ─────────────────────────────────────────────
  STORAGE_BACKEND:       ${STORAGE_BACKEND:-s3}
  ARTIFACTS_DIR:         ${ARTIFACTS_DIR:-/app/artifacts}
  S3_BUCKET:             ${S3_BUCKET:-sku-forecasting}
  S3_ENDPOINT_URL:       ${S3_ENDPOINT_URL:-https://s3.beget.com}
  AWS_DEFAULT_REGION:    ${AWS_DEFAULT_REGION:-ru-1}
  S3_KEY_PREFIX:         ${S3_KEY_PREFIX:-}
  # ── Сервисы ───────────────────────────────────────────────
  REDIS_URL:             ${REDIS_URL:-redis://redis:6379}
  MLFLOW_TRACKING_URI:   ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
  # ── База данных ───────────────────────────────────────────
  DB_HOST:               ${DB_HOST:-postgres}
  DB_PORT:               ${DB_PORT:-5432}
  DB_NAME:               ${DB_NAME:-sku_db}
  DATABASE_URL:          ${DATABASE_URL:-}
  # ── Lockbox (secrets bootstrap — see comment at bottom of file) ──
  YC_SA_KEY_FILE:        ${YC_SA_KEY_FILE:-/run/secrets/yc-sa-key.json}
  YC_LOCKBOX_SECRET_ID:  ${YC_LOCKBOX_SECRET_ID:-}
  # ── Секреты (Level 1: из .env / Level 2-3: из Lockbox) ─────
  JWT_SECRET_KEY:        ${JWT_SECRET_KEY:-}
  JWT_EXPIRE_MINUTES:    ${JWT_EXPIRE_MINUTES:-60}
  JWT_ALGORITHM:         ${JWT_ALGORITHM:-HS256}
  API_KEY:               ${API_KEY:-}
  AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  GRAFANA_PASSWORD:      ${GRAFANA_PASSWORD:-}
  ALERT_WEBHOOK_URL:     ${ALERT_WEBHOOK_URL:-}
  WEBHOOK_IP_WHITELIST:  ${WEBHOOK_IP_WHITELIST:-}

services:

  # ── API ────────────────────────────────────────────────────
  api:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sku-forecasting-api:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *infra-env
    volumes:
      - ../configs:/app/configs:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Training Worker ────────────────────────────────────────
  worker:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: sku-forecasting-worker:latest
    environment:
      <<: *infra-env
    volumes:
      - ../configs:/app/configs:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import redis; redis.from_url('redis://redis:6379').ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Redis ─────────────────────────────────────────────────
  redis:
    <<: *common
    image: redis:7.2-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MLflow ────────────────────────────────────────────────
  mlflow:
    <<: *common
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.beget.com}
      # In Level 3 these vars are populated by the Lockbox bootstrap, not .env
      AWS_ACCESS_KEY_ID:      ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY:  ${AWS_SECRET_ACCESS_KEY:-}
    command: >
      mlflow server
        --host 0.0.0.0 --port 5000
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --default-artifact-root s3://${S3_BUCKET:-sku-forecasting}/mlflow
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Prometheus ────────────────────────────────────────────
  prometheus:
    <<: *common
    image: prom/prometheus:v2.52.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro    # R6-5
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Grafana ───────────────────────────────────────────────
  grafana:
    <<: *common
    image: grafana/grafana:10.4.2
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Password is injected from Lockbox at api/worker container start
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me-via-lockbox}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Secrets bootstrap (R9-B item #13, 2026-05-21) ────────
  # Project uses Yandex Lockbox for secrets (NOT HashiCorp Vault).
  # Vault sidecar service + VAULT_* env vars + vault_data volume +
  # api depends_on:vault were retired here. The module
  # `src/auth/vault_agent.py` keeps its historical name but
  # implements the Lockbox bootstrap protocol — see
  # `project_lockbox_bootstrap.md`.
  #
  # Live wire-up: docker/docker-compose.lockbox.yml. Python services
  # call `src/auth/vault_agent.bootstrap_secrets()` at module import;
  # non-Python (backup, alertmanager) use scripts/lockbox_bootstrap.sh
  # via Dockerfile ENTRYPOINT.
  #
  # This compose file is RETAINED for historical reference and the
  # Beget S3 orientation block above. The active prod stack is
  # composed from docker-compose.yml + .prod + .lockbox + .minimal —
  # see scripts/cd_deploy.sh.

networks:
  sku_net:
    driver: bridge

volumes:
  redis_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
