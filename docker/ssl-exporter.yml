# ssl-exporter modules — SSL/TLS endpoint probing for cert-expiry alerts.
#
# Why ssl-exporter and not blackbox-exporter:
#   blackbox-exporter's TCP query_response treats Send/Expect strings as
#   YAML strings, and high bytes (e.g. 0xD2 in PostgreSQL's SSLRequest
#   magic 0x04D2162F) get UTF-8 encoded by the YAML parser, breaking the
#   8-byte handshake. ssl-exporter has built-in `starttls: postgres`
#   support that speaks the protocol natively in Go.

modules:
  postgres:
    prober: tcp
    # tls_config sits at the MODULE level in ssl-exporter (different
    # schema from blackbox-exporter, where it nested under `tcp:`).
    # Cert is self-signed → skip chain verification; we only need
    # expiry, not chain validity.
    tls_config:
      insecure_skip_verify: true
    tcp:
      # Built-in postgres StartTLS handler — sends SSLRequest, expects
      # 'S', upgrades to TLS, then introspects the server cert.
      starttls: postgres

  https:
    # Public HTTPS endpoints (LE certs). Standard chain validation —
    # if the cert is expired or chain broken, the metric `ssl_verified_cert_not_after`
    # remains absent. Alert on `ssl_cert_not_after` < 14 days.
    prober: https
    # ssl-exporter v2.4.3's `https:` schema only takes tls_config + url
    # query overrides; ip_protocol_fallback is blackbox-exporter syntax,
    # not ssl-exporter. Empty body = use defaults (chain verify on).
