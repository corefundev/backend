global:
  scrape_interval:     15s
  evaluation_interval: 15s
  # external_labels propagate to every metric, alert and federation
  # sample. Lets alertmanager group by cluster + lets us route
  # staging alerts visibly differently from prod (see template in
  # alertmanager.yml). Override to "staging" via prometheus.staging.yml.
  external_labels:
    cluster: staging

# Alerting rules (in alerts.yml) evaluate against freshly scraped metrics.
# Alertmanager fans out to Slack / PagerDuty / email via its own config.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "sku-forecasting-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Worker queues — rq exposes metrics only when the rq-exporter sidecar
  # is running. Optional; rule referencing rq_* no-ops if no data.
  - job_name: "rq-exporter"
    static_configs:
      - targets: ["rq-exporter:9726"]
    honor_labels: true
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "^go_|^process_"
        action: drop

  # Postgres — via postgres_exporter (LOCAL: primary's own DB)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # NOTE: ssl-pg-tls + postgres-replica scrape jobs are intentionally
  # absent on staging. Staging postgres doesn't run with TLS (no replica
  # to encrypt the WAL stream to), so there's no cert to probe. The
  # corresponding alerts in alerts.yml reference these metrics — they
  # silently no-op when the metric doesn't exist.

  # Pushgateway — receives metrics from batch jobs (backup.sh).
  # honor_labels: true so the `instance` / `job` labels pushed by the
  # job survive (otherwise prometheus overwrites them with the scrape
  # target's pushgateway:9091).
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  # node_exporter — host filesystem / memory / cpu (#198).
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "staging.testcore.ru"

  # cAdvisor — per-container metrics (#203).
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Loki internal — distributor lines/bytes (#203).
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  # Promtail scrape — external health (no tools in distroless image).
  - job_name: "promtail"
    static_configs:
      - targets: ["promtail:9080"]

  # ssl-exporter https probe — LE cert TTL (#203).
  - job_name: "ssl-https"
    metrics_path: /probe
    params:
      module: [https]
    static_configs:
      - targets:
          - "https://api.staging.testcore.ru"
    relabel_configs:
      - source_labels: [__address__]
        target_label:  __param_target
      - source_labels: [__param_target]
        target_label:  instance
      - target_label: __address__
        replacement:   ssl-exporter:9219
    scrape_interval: 5m
