# Re-publishes the primary's postgres port for streaming replication
# AND ships a privileged sidecar that locks 5432 down to the replica
# IP via DOCKER-USER iptables rules.
#
# docker-compose.minimal.yml does `ports: !reset []` to keep postgres
# off the public network in the standard prod stack. With a replica
# online, we need the WAL stream to reach it — so this overlay puts
# the port back. Append this file LAST in the compose -f chain.
#
# Defence-in-depth (since the port is now reachable):
#   • pg-firewall sidecar — DOCKER-USER chain rule that drops 5432
#     traffic from anywhere except REPLICA_CIDR + localhost. Survives
#     dockerd / host restart via `restart: always`.
#   • pg_hba.conf restricts `replication` to the replica CIDR only —
#     no other host can authenticate as `replicator`.
#   • scram-sha-256 + a 32-char random password.
#
# Why a sidecar instead of OS-level iptables-persistent: the deploy
# user on this VPS doesn't have NOPASSWD sudo, so `apt-get install
# iptables-persistent` and `netfilter-persistent save` fail under
# automation. Running iptables inside a privileged --net=host
# container needs only docker-group membership, which deploy already
# has. Idempotent, self-healing, no manual sudoers edit.

services:
  postgres:
    ports:
      - "5432:5432"
    # Override default command to enable SSL with CA-chain validation +
    # WAL archiving for PITR (#183).
    #
    # SSL: primary.crt + primary.key signed by ca.crt; ssl_ca_file lets
    # primary verify replica's client cert (mTLS — #174).
    # /srv/backend/secrets/pg-ssl/ is the host bind mount, owned by
    # uid 70 (alpine postgres user). `hostssl ... clientcert=verify-ca`
    # in pg_hba forces all replication connections to present a cert
    # signed by the same CA.
    #
    # archive_mode + archive_command + archive_timeout: postgres pushes
    # each WAL segment to S3 via wal_archive.sh (mc cp baked into our
    # Dockerfile.postgres). archive_timeout=60 forces a WAL switch every
    # 60s when there's no traffic, so PITR resolution stays sub-minute
    # even on a quiet DB. wal_level=replica is already implied by
    # streaming replication; archive_mode=on requires it.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/pg/primary.crt
      - -c
      - ssl_key_file=/etc/ssl/pg/primary.key
      - -c
      - ssl_ca_file=/etc/ssl/pg/ca.crt
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/wal_archive.sh %p %f
      - -c
      - archive_timeout=60
    volumes:
      - /srv/backend/secrets/pg-ssl:/etc/ssl/pg:ro

  pg-firewall:
    # R4-20 digest-pinned 2026-05-17 (same digest as Dockerfile.pgbouncer/
    # backup/alertmanager/postgres-exporter pin per R3-20).
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    container_name: pg-firewall
    # privileged + network_mode: host gives the container CAP_NET_ADMIN
    # against the HOST's iptables (not its own netns). That's the
    # documented escape-hatch for this kind of bootstrap.
    privileged: true
    network_mode: host
    restart: always
    environment:
      REPLICA_CIDR: "${REPLICA_CIDR:-212.8.226.233/32}"
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache iptables >/dev/null
        ensure_rule() {
            while iptables -C DOCKER-USER "$$@" 2>/dev/null; do
                iptables -D DOCKER-USER "$$@"
            done
            iptables -I DOCKER-USER 1 "$$@"
        }
        apply_rules() {
            # Final chain order (top-of-chain insert pushes earlier rules down):
            #   1. RETURN docker-subnet src — outbound from our own
            #      containers (api → replica:5432) skips this filter.
            #      Without this rule, app-container outbound to replica
            #      would also match the dport-5432 DROP and break read-
            #      replica routing.
            #   2. ACCEPT replica src on 5432  (incoming WAL request).
            #   3. ACCEPT localhost on 5432    (host-local backups).
            #   4. DROP rest on 5432           (external scans).
            # Insert in reverse so RETURN ends up at the top.
            ensure_rule -p tcp --dport 5432 -j DROP \
                -m comment --comment "pg-fw-deny"
            ensure_rule -p tcp --dport 5432 -s 127.0.0.1/8 -j ACCEPT \
                -m comment --comment "pg-fw-localhost"
            ensure_rule -p tcp --dport 5432 -s "$$REPLICA_CIDR" -j ACCEPT \
                -m comment --comment "pg-fw-replica"
            ensure_rule -s 172.16.0.0/12 -j RETURN \
                -m comment --comment "pg-fw-skip-docker-out"
        }
        apply_rules
        echo "pg-firewall: rules applied for REPLICA_CIDR=$$REPLICA_CIDR"
        iptables -L DOCKER-USER -n -v --line-numbers | head -10
        # Periodic re-apply heals against external table flush.
        while true; do
            sleep 3600
            apply_rules
        done
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
