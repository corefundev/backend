# Alertmanager config — single Slack webhook.
#
# A modern Slack incoming webhook is bound to a single channel at creation
# time, so the `channel:` field in receiver configs is ignored. Severity-
# based channel routing requires a separate webhook per channel; if/when
# that's needed, add more webhooks and split routes accordingly.
#
# The ${ALERT_WEBHOOK_URL} placeholder is rendered at startup by the
# alertmanager service's wrapper entrypoint (sed-based envsubst — see
# docker-compose.yml). The unrendered template lives at
#   /etc/alertmanager/alertmanager.yml.tpl
# and the rendered output goes to /tmp/alertmanager.yml.

global:
  resolve_timeout: 5m

route:
  receiver: slack
  group_by:        ["alertname", "cluster"]
  group_wait:      30s        # quiet window before first notify
  group_interval:  2m         # gap between notifications in a group
  repeat_interval: 2h         # re-notify if still firing

  routes:
    - matchers:
        - severity = "critical"
      receiver: slack
      group_wait: 10s
      repeat_interval: 5m

receivers:
  - name: slack
    slack_configs:
      - api_url: "${ALERT_WEBHOOK_URL}"
        send_resolved: true
        title: |-
          {{ if eq .CommonLabels.severity "critical" }}🚨{{ else }}⚠️{{ end }} {{ .CommonLabels.alertname }}
        text: |
          *Severity:* `{{ .CommonLabels.severity }}`
          {{ range .Alerts }}• *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  # When the API is down, every dependent alert fires too. Suppress the
  # noise so on-call sees the root cause first.
  - source_matchers: [severity = "critical", alertname = "ApiDown"]
    target_matchers: [severity = "warning"]
    equal: ["cluster"]
