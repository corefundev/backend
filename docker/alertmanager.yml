# Alertmanager config — Telegram bot delivery.
#
# All severity levels go to a single chat (Alert System supergroup),
# differentiated by a leading emoji and explicit *Severity:* line.
# When team grows enough to need on-call rotation, split routes into
# multiple chats / topics here.
#
# Two env placeholders rendered at startup by the alertmanager
# service's wrapper entrypoint (sed-based envsubst — see
# docker-compose.yml). Template lives at
#   /etc/alertmanager/alertmanager.yml.tpl
# rendered output goes to /tmp/alertmanager.yml.

global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by:        ["alertname", "cluster"]
  group_wait:      30s        # quiet window before first notify
  group_interval:  2m         # gap between notifications in a group
  repeat_interval: 2h         # re-notify if still firing

  routes:
    - matchers:
        - severity = "critical"
      receiver: telegram
      group_wait: 10s
      repeat_interval: 5m

receivers:
  - name: telegram
    telegram_configs:
      # Alertmanager v0.27 expects the token as bot_token (not _file),
      # rendered from $TELEGRAM_ALERT_BOT_TOKEN at compose startup.
      - bot_token: "${TELEGRAM_ALERT_BOT_TOKEN}"
        chat_id:    ${TELEGRAM_ALERT_CHAT_ID}
        api_url:    "https://api.telegram.org"
        parse_mode: HTML
        send_resolved: true
        message: |-
          {{ if eq .CommonLabels.severity "critical" }}🔥{{ else }}⚠️{{ end }} <b>{{ .CommonLabels.alertname }}</b>{{ if eq .CommonLabels.cluster "staging" }} <i>(staging)</i>{{ end }}

          <i>cluster:</i>  <code>{{ .CommonLabels.cluster }}</code>
          <i>severity:</i> <code>{{ .CommonLabels.severity }}</code>
          <i>status:</i>   <code>{{ .Status }}</code>
          {{ range .Alerts }}
          • <b>{{ .Annotations.summary }}</b>
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  # When the API is down, every dependent alert fires too. Suppress the
  # noise so on-call sees the root cause first.
  - source_matchers: [severity = "critical", alertname = "ApiDown"]
    target_matchers: [severity = "warning"]
    equal: ["cluster"]
