        alertname: PushgatewayDown
        exp_alerts:
          - exp_labels: {job: "pushgateway", severity: critical, team: forecasting}
            exp_annotations:
              summary: "Pushgateway is down — batch metrics blind"
              description: "BackupStale / BaseBackupStale / future push-metrics depend on this. Restart docker-pushgateway-1 and verify it accepts pushes."

  - interval: 1m
    name: "PromtailDown fires when up=0"
    input_series:
      - series: 'up{job="promtail"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 6m
        alertname: PromtailDown
        exp_alerts:
          - exp_labels: {job: "promtail", severity: warning, team: forecasting}
            exp_annotations:
              summary: "Promtail :9080 unreachable for 5m"
              description: "All container logs flowing to Loki stop. Restart docker-promtail-1; positions persist via volume so no replay flood."

  - interval: 1m
    name: "LokiPushFailure fires when discarded bytes rate >0"
    input_series:
      - series: 'loki_discarded_bytes_total{reason="rate_limited"}'
        values: '0+1000x15'   # 1000 B/min discarded
    alert_rule_test:
      - eval_time: 12m
        alertname: LokiPushFailure
        exp_alerts:
          - exp_labels: {reason: "rate_limited", severity: warning, team: forecasting}
            exp_annotations:
              summary: "Loki dropping log bytes for 10m"
              description: "16.67B/s being rejected (reason=rate_limited). Check promtail positions persistence (#198 fix) and loki ingester health."

  # ── certificates ──────────────────────────────────────────────
  - interval: 1m
    name: "LeCertExpiringSoon fires when cert <14d out"
    input_series:
      # ssl_cert_not_after = unix ts. value 1000000 ≈ 11.57d from epoch;
      # (1000000 - time())/86400 < 14 from t=0.
      - series: 'ssl_cert_not_after{job="ssl-https", instance="https://api.testcore.ru"}'
        values: '1000000x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: LeCertExpiringSoon
        exp_alerts:
          - exp_labels: {job: "ssl-https", instance: "https://api.testcore.ru", severity: warning, team: forecasting}
            exp_annotations:
              summary: "LE cert https://api.testcore.ru expires in <14d (11.5d)"
              description: "Certbot should auto-renew at 30d remaining. If we're at 14d, cron isn't firing or renewal is failing. Inspect certbot container logs."

  - interval: 1m
    name: "LeCertExpiringCritical fires when cert <3d out"
    input_series:
      # value 100000 ≈ 1.16d from epoch; (100000 - time())/86400 < 3 from t=0.
      - series: 'ssl_cert_not_after{job="ssl-https", instance="https://api.testcore.ru"}'
        values: '100000x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LeCertExpiringCritical
        exp_alerts:
          - exp_labels: {job: "ssl-https", instance: "https://api.testcore.ru", severity: critical, team: forecasting}
            exp_annotations:
              summary: "LE cert https://api.testcore.ru expires in <3 DAYS"
              description: "User-facing TLS will break. Run certbot manually now and check renewal cron."

  # ── host-resources ────────────────────────────────────────────
  - interval: 1m
    name: "HostDiskFillingUp fires at 90% disk usage"
    input_series:
      - series: 'node_filesystem_avail_bytes{fstype="ext4", mountpoint="/", instance="api.testcore.ru"}'
        values: '10x20'
      - series: 'node_filesystem_size_bytes{fstype="ext4", mountpoint="/", instance="api.testcore.ru"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: HostDiskFillingUp
        exp_alerts:
          - exp_labels: {fstype: "ext4", mountpoint: "/", instance: "api.testcore.ru", severity: warning, team: forecasting}
            exp_annotations:
              summary: "Host disk usage >80% on api.testcore.ru"
              description: "Filesystem at / is 90.0% full. Likely cause: pg_wal backup if S3 archive_command failing, or container logs / docker images bloat. Run `docker system df` and check S3 archive health."

  - interval: 1m
    name: "HostDiskCritical fires at 95% disk usage"
    input_series:
      - series: 'node_filesystem_avail_bytes{fstype="ext4", mountpoint="/", instance="api.testcore.ru"}'
        values: '5x10'
      - series: 'node_filesystem_size_bytes{fstype="ext4", mountpoint="/", instance="api.testcore.ru"}'
        values: '100x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: HostDiskCritical
        exp_alerts:
          - exp_labels: {fstype: "ext4", mountpoint: "/", instance: "api.testcore.ru", severity: critical, team: forecasting}
            exp_annotations:
              summary: "Host disk usage >92% on api.testcore.ru — postgres at risk"
              description: "Postgres will stop accepting writes when the disk fills. Evacuate large files NOW. 95.0% used."

  - interval: 1m
    name: "HostMemoryHigh fires at 95% memory usage"
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="api.testcore.ru"}'
        values: '5x35'
      - series: 'node_memory_MemTotal_bytes{instance="api.testcore.ru"}'
        values: '100x35'
    alert_rule_test:
      - eval_time: 32m
        alertname: HostMemoryHigh
        exp_alerts:
          - exp_labels: {instance: "api.testcore.ru", severity: warning, team: forecasting}
            exp_annotations:
              summary: "Host memory >90% used for 30m on api.testcore.ru"
              description: "95.0% used. Check for memory-leak suspects (mlflow has had crash loops; api / worker can spike during training)."

  # ════════════════════════════════════════════════════════════════
  # PROD-ONLY rules (alerts.production.yml) — replication + mirror.
  # ════════════════════════════════════════════════════════════════
  - interval: 1m
    name: "PgReplicationCertExpiringSoon fires when replica cert <30d out"
    input_series:
      - series: 'ssl_cert_not_after{job="ssl-pg-tls", instance="postgres:5432"}'
        values: '1000000x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: PgReplicationCertExpiringSoon
        exp_alerts:
          - exp_labels: {job: "ssl-pg-tls", instance: "postgres:5432", severity: warning, team: forecasting}
            exp_annotations:
              summary: "PG replication TLS cert expires in <30 days (12 days left)"
              description: "Self-signed cert at /srv/backend/secrets/pg-ssl/server.crt expires soon. Rotate via the Setup PG Replication (Primary) workflow with force_regen_cert=true; runbook in deploy/REPLICATION.md → 'SSL cert rotation'."

  - interval: 1m
    name: "PgReplicationCertExpired fires when replica cert already expired"
    input_series:
      - series: 'ssl_cert_not_after{job="ssl-pg-tls", instance="postgres:5432"}'
        values: '0x10'   # not_after=epoch → already expired
    alert_rule_test:
      - eval_time: 7m
        alertname: PgReplicationCertExpired
        exp_alerts:
          - exp_labels: {job: "ssl-pg-tls", instance: "postgres:5432", severity: critical, team: forecasting}
            exp_annotations:
              summary: "PG replication TLS cert HAS EXPIRED — replica streaming will break on next reconnect"
              description: "Rotate immediately. Runbook in deploy/REPLICATION.md."

  - interval: 1m
    name: "PgReplicaLagHigh fires when lag >60s"
    input_series:
      - series: 'pg_replication_lag_seconds{job="postgres-replica"}'
        values: '120x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: PgReplicaLagHigh
        exp_alerts:
          - exp_labels: {job: "postgres-replica", severity: warning, team: forecasting}
            exp_annotations:
              summary: "Replica is 120s behind primary (or exporter silent)"
              description: "Check pg_stat_wal_receiver on replica + pg_stat_replication on primary. If `absent`, the replica-side postgres-exporter is down or unscrapeable (built-in pg_replication_lag_seconds missing). Otherwise: network or WAL apply bottleneck."

  - interval: 1m
    name: "PgReplicaLagHigh fires when lag metric absent (replica exporter down/unscrapeable)"
    input_series: []
    alert_rule_test:
      - eval_time: 12m
        alertname: PgReplicaLagHigh
        exp_alerts:
          # absent() propagates the equality-matcher label job="postgres-replica".
          - exp_labels: {job: "postgres-replica", severity: warning, team: forecasting}
            exp_annotations:
              summary: "Replica is 1s behind primary (or exporter silent)"
              description: "Check pg_stat_wal_receiver on replica + pg_stat_replication on primary. If `absent`, the replica-side postgres-exporter is down or unscrapeable (built-in pg_replication_lag_seconds missing). Otherwise: network or WAL apply bottleneck."

  - interval: 1m
    name: "PgReplicaWalReceiverDown fires when pg_up=0"
    input_series:
      - series: 'pg_up{job="postgres-replica"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: PgReplicaWalReceiverDown
        exp_alerts:
          - exp_labels: {job: "postgres-replica", severity: critical, team: forecasting}
            exp_annotations:
              summary: "Replica's postgres-exporter unreachable for 2m"
              description: "Either replica VPS is down, replica-firewall sidecar dropped its rules, or the exporter container died. SSH to the replica VPS (deploy@212.8.226.233) and inspect."

  - interval: 1m
    name: "PgReplicaScrapeFailed fires when up=0"
    input_series:
      - series: 'up{job="postgres-replica"}'
        values: '0x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: PgReplicaScrapeFailed
        exp_alerts:
          - exp_labels: {job: "postgres-replica", severity: critical, team: forecasting}
            exp_annotations:
              summary: "Prometheus can't scrape postgres-replica for 3m"
              description: "Likely cause: REPLICA_EXPORTER_HOST env on primary doesn't match the current replica IP (rotate via prod .env + recreate prometheus), OR replica firewall dropped our IP, OR the replica VPS is down."

  - interval: 1m
    name: "BackupMirrorStale fires when mirror metric absent"
    input_series: []
    alert_rule_test:
      - eval_time: 35m
        alertname: BackupMirrorStale
        exp_alerts:
          - exp_labels: {severity: warning, team: forecasting}
            exp_annotations:
              summary: "Off-region backup mirror is stale (>49h)"
              description: "Selectel `uz-2` backup mirror hasn't received a fresh dump in 49h. Primary Beget backup is unaffected (data is safe); this is a DR-posture degradation. Inspect: `docker exec docker-backup-1 sh -c 'mc alias set mir <S3_MIRROR_ENDPOINT_URL> ... && mc ls mir/<S3_MIRROR_BUCKET>/'`. Likely causes: Selectel creds rotated, bucket permission changed, or off-region network outage."

  - interval: 1m
    name: "BaseBackupMirrorStale fires when base mirror metric absent"
    input_series: []
    alert_rule_test:
      - eval_time: 125m
        alertname: BaseBackupMirrorStale
        exp_alerts:
          - exp_labels: {severity: warning, team: forecasting}
            exp_annotations:
              summary: "Off-region weekly base backup mirror is stale (>16d)"
              description: "Selectel `uz-2` weekly base_backup mirror hasn't received a fresh push in 16d (2 missed cycles). Primary Beget base_backup is unaffected. PITR is still functional from the primary; this is a DR-posture degradation only."

  # ── WalMirrorStale (R10 B1, prod-only) ────────────────────────
  # The off-region WAL mirror freshness alert. Critical property to
  # verify: absent() is storm-SAFE here (unlike the PR #38 *CronSilent)
  # because the 5-min sync cadence << for:15m, so the metric appears
  # before the absent() pending window completes on a fresh deploy.
  - interval: 1m
    name: "WalMirrorStale fires when WAL mirror stale >30m"
    input_series:
      # -2000 < -1800: time() - (-2000) > 1800 from t=0 → active immediately.
      - series: 'sku_wal_mirror_last_success_timestamp_seconds{instance="sku-forecasting", job="wal_mirror"}'
        values: '-2000x40'
    alert_rule_test:
      - eval_time: 18m     # active from t=0, > for:15m
        alertname: WalMirrorStale
        exp_alerts:
          - exp_labels: {instance: "sku-forecasting", job: "wal_mirror", severity: warning, team: forecasting}
            exp_annotations:
              summary: "Off-region WAL mirror is stale (>30m)"
              description: "Selectel `uz-2` WAL mirror (scripts/wal_mirror.sh, every 5 min) hasn't completed a sync in 30+ min. Primary Beget WAL archive is unaffected (PITR from primary is intact) — this degrades the off-region RPO from ~5 min back toward the last weekly base. Inspect: `docker exec docker-backup-1 tail /var/log/wal_mirror.log`. Likely causes: Selectel creds rotated, bucket permission changed, or off-region network outage."

  - interval: 1m
    name: "WalMirrorStale fires when metric NEVER appears (wal_mirror.sh broken from boot)"
    input_series: []
    alert_rule_test:
      - eval_time: 18m     # absent the whole time, past for:15m
        alertname: WalMirrorStale
        exp_alerts:
          - exp_labels: {severity: warning, team: forecasting}
            exp_annotations:
              summary: "Off-region WAL mirror is stale (>30m)"
              description: "Selectel `uz-2` WAL mirror (scripts/wal_mirror.sh, every 5 min) hasn't completed a sync in 30+ min. Primary Beget WAL archive is unaffected (PITR from primary is intact) — this degrades the off-region RPO from ~5 min back toward the last weekly base. Inspect: `docker exec docker-backup-1 tail /var/log/wal_mirror.log`. Likely causes: Selectel creds rotated, bucket permission changed, or off-region network outage."

  - interval: 1m
    name: "WalMirrorStale STORM-SAFE: absent for first 6m then metric appears → does NOT fire"
    input_series:
      # Mirrors a fresh deploy: no sync for the first 6 min (metric
      # absent), then the first 5-min cron sync lands a fresh value.
      # Because for:15m > the 6m absent window, the pending absent()
      # alert resets when the metric appears and never fires. This is
      # the property that makes absent() safe here (vs the PR #38 storm
      # where for: < time-to-first-metric).
      - series: 'sku_wal_mirror_last_success_timestamp_seconds{instance="sku-forecasting", job="wal_mirror"}'
        values: '_x6 1200x20'   # absent 0-5m, fresh (value≈time()) from 6m
    alert_rule_test:
      - eval_time: 20m
        alertname: WalMirrorStale
        exp_alerts: []

  - interval: 1m
    name: "WalMirrorStale does NOT fire when sync is fresh"
    input_series:
      # value tracks ~now (fresh): at eval 10m time()=600, value 600 → diff 0.
      - series: 'sku_wal_mirror_last_success_timestamp_seconds{instance="sku-forecasting", job="wal_mirror"}'
        values: '600x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: WalMirrorStale
        exp_alerts: []

  # ── MirrorPruneStale (R10 B4, prod-only) ──────────────────────
  # NO absent() (daily cadence > for: → a fresh deploy would storm if
  # absent() were present). Tests: fires-when-stale, no-fire-fresh,
  # and absent→no-fire (storm-safety for the daily-metric case).
  - interval: 1m
    name: "MirrorPruneStale fires when prune stale >50h"
    input_series:
      # -181000 < -(50*3600=-180000): time() - (-181000) > 180000 from t=0.
      - series: 'sku_mirror_prune_last_success_timestamp_seconds{instance="sku-forecasting", job="mirror_prune"}'
        values: '-181000x80'
    alert_rule_test:
      - eval_time: 65m     # active from t=0, > for:1h
        alertname: MirrorPruneStale
        exp_alerts:
          - exp_labels: {instance: "sku-forecasting", job: "mirror_prune", severity: warning, team: forecasting}
            exp_annotations:
              summary: "Off-region mirror retention prune is stale (>50h)"
              description: "Selectel `uz-2` mirror prune (scripts/mirror_prune.sh, daily 05:00 UTC) hasn't completed in 50+ h. Selectel can't self-expire via S3 lifecycle, so without this prune the mirror grows unbounded (cost, not data-loss). Inspect: `docker exec docker-backup-1 tail /var/log/mirror_prune.log`."

  - interval: 1m
    name: "MirrorPruneStale STORM-SAFE: absent metric does NOT fire (daily cadence, no absent() branch)"
    input_series: []
    alert_rule_test:
      - eval_time: 90m
        alertname: MirrorPruneStale
        exp_alerts: []

  - interval: 1m
    name: "MirrorPruneStale does NOT fire when prune is fresh"
    input_series:
      - series: 'sku_mirror_prune_last_success_timestamp_seconds{instance="sku-forecasting", job="mirror_prune"}'
        values: '600x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: MirrorPruneStale
        exp_alerts: []

  # ── SyntheticAlertTest (task #38) ───────────────────────────────
  # Fires when (time() - sku_synthetic_alert_test_request_timestamp_seconds) < 300.
  # Three behavioural cases: fresh push fires, stale push does NOT
  # fire, absent metric does NOT fire (no absent() branch by design —
  # the metric is operator-pushed on demand only).
  - interval: 30s
    name: "SyntheticAlertTest fires when push is fresh (<5 min)"
    # Push at eval_time=0 carries a timestamp value of 0; promtool's
    # time() at eval_time=2m returns 120, so (120 - 0) = 120 < 300 ✓
    input_series:
      - series: 'sku_synthetic_alert_test_request_timestamp_seconds{instance="sku-forecasting", job="synthetic_alert_test"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: SyntheticAlertTest
        exp_alerts:
          - exp_labels: {instance: "sku-forecasting", job: "synthetic_alert_test", severity: synthetic, team: ops}
            exp_annotations:
              summary: "[E2E test] scrape → AM → Telegram pipeline check"
              description: |-
                This alert is fired by .github/workflows/synthetic-alert-test.yml to prove the alerting pipeline routes end-to-end. If you see this message in Telegram, the pipeline is healthy. Auto-resolves ~5 min after the workflow's push (no manual silence needed).

  - interval: 1m
    name: "SyntheticAlertTest does NOT fire after the 5 min window expires"
    input_series:
      - series: 'sku_synthetic_alert_test_request_timestamp_seconds{instance="sku-forecasting", job="synthetic_alert_test"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 6m       # time()-0 = 360s > 300s window → resolved
        alertname: SyntheticAlertTest
        exp_alerts: []

  - interval: 1m
    name: "SyntheticAlertTest does NOT fire when metric absent"
    input_series: []
    alert_rule_test:
      - eval_time: 5m
        alertname: SyntheticAlertTest
        exp_alerts: []

  # ── StalenessNudgeStale / ModelAgeCheckStale (QW2-3 #226 → NC-4 #244) ────
  # NC-4: per-client ModelStale retired (the USER owns staleness via NC-3
  # nudges); ops watches the MACHINERY: nudge-cron freshness + probe health.
  - interval: 1m
    name: "StalenessNudgeStale fires when the nudge cron stops (>50h + 30m for)"
    # 1m sampling: with sparser samples the 5m staleness lookback would empty
    # the instant vector between points and keep resetting the for-clock — a
    # test-harness artifact only (prod scrapes pushgateway continuously).
    input_series:
      - series: 'sku_staleness_nudge_last_success_timestamp_seconds{instance="sku-forecasting", job="staleness_nudge"}'
        values: '0x3121'              # frozen at 0, sampled every 1m for 52h
    alert_rule_test:
      - eval_time: 40h                # 144000 < 180000 → healthy
        alertname: StalenessNudgeStale
        exp_alerts: []
      - eval_time: 51h                # 183600 > 180000, past for:30m → fires
        alertname: StalenessNudgeStale
        exp_alerts:
          - exp_labels: {instance: "sku-forecasting", job: "staleness_nudge", severity: warning, team: forecasting}
            exp_annotations:
              summary: "staleness nudge cron is stale (>50h)"
              description: "scripts/staleness_nudge.sh (daily 07:15, backup container) hasn't pushed a success in 50+h — stale-model clients are no longer being nudged (NC-3 #243). Check /var/log/staleness_nudge.log in docker-backup-1, the api /internal/staleness-nudge endpoint, and pushgateway reachability."

  - interval: 1h
    name: "StalenessNudgeStale does NOT fire when metric absent (fresh deploy; dead crond covered by *CronSilent)"
    input_series: []
    alert_rule_test:
      - eval_time: 5h
        alertname: StalenessNudgeStale
        exp_alerts: []

  # ── PiiPurgeStale (AUD-11 #363) ──────────────────────────────────────────
  # 152-ФЗ purge cron watchdog. UNLIKE the nudge rule it carries an absent()
  # arm — safe because backup_metric_warmup.sh re-pushes the state-file
  # timestamp on every container start, so absent = "never succeeded on
  # this volume" (exactly what must page), not "pushgateway just recreated".
  - interval: 1m
    name: "PiiPurgeStale fires when the purge cron stops (>50h + 30m for)"
    input_series:
      - series: 'sku_pii_purge_last_success_timestamp_seconds{instance="sku-forecasting", job="pii_purge"}'
        values: '0x3121'              # frozen at 0, sampled every 1m for 52h
    alert_rule_test:
      - eval_time: 40h                # 144000 < 180000 → healthy
        alertname: PiiPurgeStale
        exp_alerts: []
      - eval_time: 51h                # 183600 > 180000, past for:30m → fires
        alertname: PiiPurgeStale
        exp_alerts:
          - exp_labels: {instance: "sku-forecasting", job: "pii_purge", severity: warning, team: forecasting}
            exp_annotations:
              summary: "PII retention purge cron is stale or missing (>50h)"
              description: "scripts/pii_purge.sh (daily 04:40, backup container) hasn't pushed a success in 50+h — 152-ФЗ retention purge of closed accounts is NOT running (erasure cascade #356 included). Check /var/log/pii_purge.log in docker-backup-1, the api /internal/pii-purge endpoint, and pushgateway reachability."

  - interval: 1h
    name: "PiiPurgeStale DOES fire when metric absent (never succeeded on this volume — the failsafe arm)"
    input_series: []
    alert_rule_test:
      - eval_time: 5h
        alertname: PiiPurgeStale
        exp_alerts:
          - exp_labels: {severity: warning, team: forecasting}
            exp_annotations:
              summary: "PII retention purge cron is stale or missing (>50h)"
              description: "scripts/pii_purge.sh (daily 04:40, backup container) hasn't pushed a success in 50+h — 152-ФЗ retention purge of closed accounts is NOT running (erasure cascade #356 included). Check /var/log/pii_purge.log in docker-backup-1, the api /internal/pii-purge endpoint, and pushgateway reachability."

  - interval: 1m
    name: "PiiPurgeStale stays quiet while the purge cron is fresh"
    input_series:
      - series: 'sku_pii_purge_last_success_timestamp_seconds{instance="sku-forecasting", job="pii_purge"}'
        values: '0+60x300'            # tracks time() — always fresh
    alert_rule_test:
      - eval_time: 4h
        alertname: PiiPurgeStale
        exp_alerts: []

  - interval: 1m
    name: "ModelAgeCheckStale fires when the probe stops pushing (>3h + 30m for)"
    input_series:
      - series: 'model_age_check_timestamp_seconds{instance="sku-forecasting", job="model_age_check"}'
        values: '0x241'               # value frozen at 0, sampled every 1m
    alert_rule_test:
      - eval_time: 2h                 # 7200 < 10800 → healthy
        alertname: ModelAgeCheckStale
        exp_alerts: []
      - eval_time: 4h                 # 14400 > 10800, past for:30m → fires
        alertname: ModelAgeCheckStale
        exp_alerts:
          - exp_labels: {instance: "sku-forecasting", job: "model_age_check", severity: warning, team: forecasting}
            exp_annotations:
              summary: "model_age_check probe is stale (>3h)"
              description: "scripts/model_age_check.sh (hourly, backup container) has not pushed model_age_check_timestamp_seconds in 3h — the staleness NUDGE and the admin console are now blind on model ages (frozen ages could mask real staleness). Check /var/log/model_age_check.log in docker-backup-1 and pushgateway reachability."

  - interval: 1h
    name: "ModelAgeCheckStale does NOT fire when metric absent (no absent() arm by design — fresh deploy storm-safety; dead crond is covered by *CronSilent)"
    input_series: []
    alert_rule_test:
      - eval_time: 5h
        alertname: ModelAgeCheckStale
        exp_alerts: []
