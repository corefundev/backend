# tests/prometheus/alerts_acceptance_test.yml
#
# promtool alert-acceptance tests — behavioural coverage of the
# Prometheus alert rules in docker/prometheus/alerts.yml +
# alerts.production.yml. Run via:
#
#   promtool test rules tests/prometheus/alerts_acceptance_test.yml
#
# Why this exists (R10 G1, 2026-05-28): the static unit tests in
# tests/unit/test_*alerts*.py assert YAML-STRING presence (metric
# name appears, severity is warning, etc) — they CANNOT catch
# behavioural bugs. Three reactive-find incidents proved the gap:
#   • R5-12/R5-13 — phantom-metric alerts that never fired (wrong
#     metric name; static test would have passed)
#   • R10 A1-A3 — same class, 3 more sites
#   • PR #38 absent()-storm — *CronSilent alerts fired for up to 7
#     days post-deploy because absent() matched a not-yet-pushed
#     metric. The unit test ASSERTED absent() was present — it
#     encoded the bug. A behavioural test ("given metric absent,
#     alert must NOT fire") would have caught it at PR time.
#
# promtool feeds synthetic time-series and asserts which alerts are
# firing at each eval_time. `time()` inside an expression returns the
# eval timestamp as seconds since the test's epoch-0 start, so a
# gauge holding a unix timestamp of VALUE 0 reads as "<eval_time>
# seconds old" — that's how the `time() - metric > threshold`
# staleness alerts are exercised below.

rule_files:
  - ../../docker/prometheus/alerts.yml
  - ../../docker/prometheus/alerts.production.yml

evaluation_interval: 1m

tests:
  # ──────────────────────────────────────────────────────────────
  # A1 — WorkerQueueBacklog uses the REAL rq_jobs{queue,status} metric
  # (regression for the phantom `rq_queue_jobs` we fixed in PR #36).
  # ──────────────────────────────────────────────────────────────
  - interval: 1m
    name: "WorkerQueueBacklog fires when a queue has >100 queued jobs"
    input_series:
      - series: 'rq_jobs{queue="sku-scan", status="queued"}'
        values: '150x25'   # 150 queued, constant, 25 min
    alert_rule_test:
      - eval_time: 21m       # for: 20m + 1m slack
        alertname: WorkerQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              team: forecasting
              queue: sku-scan
            exp_annotations:
              summary: "Queue sku-scan has >100 pending jobs"
              description: "Consider scaling the matching worker."

  - interval: 1m
    name: "WorkerQueueBacklog does NOT fire under threshold (50 queued)"
    input_series:
      - series: 'rq_jobs{queue="sku-scan", status="queued"}'
        values: '50x25'
    alert_rule_test:
      - eval_time: 21m
        alertname: WorkerQueueBacklog
        exp_alerts: []

  - interval: 1m
    name: "WorkerQueueBacklog ignores non-queued statuses"
    input_series:
      # 500 finished jobs must NOT trip the backlog alert — only queued counts.
      - series: 'rq_jobs{queue="sku-scan", status="finished"}'
        values: '500x25'
    alert_rule_test:
      - eval_time: 21m
        alertname: WorkerQueueBacklog
        exp_alerts: []

  # ──────────────────────────────────────────────────────────────
  # BackupStale — success-side staleness with absent() defence.
  # ──────────────────────────────────────────────────────────────
  - interval: 1m
    name: "BackupStale fires when last success >25h ago"
    input_series:
      # gauge value 0 = "backup succeeded at epoch 0"; at eval 26h it
      # reads as 26h old > 25h threshold.
      - series: 'sku_backup_last_success_timestamp_seconds{instance="sku-forecasting", job="backup"}'
        values: '0x1600'   # constant 0, 1600 min ≈ 26.6h
    alert_rule_test:
      - eval_time: 1580m     # 26.3h > 25h, well past for:15m
        alertname: BackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              team: forecasting
              instance: sku-forecasting
              job: backup
            exp_annotations:
              summary: "Postgres backup is stale or missing (>25h)"
              description: "No fresh dump pushed to pushgateway in 25h. Trigger the Diagnose Backup → Restart Backup workflows."

  - interval: 1m
    name: "BackupStale fires when metric is ABSENT (never pushed)"
    input_series: []   # no series at all
    alert_rule_test:
      - eval_time: 20m
        alertname: BackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              team: forecasting
            exp_annotations:
              summary: "Postgres backup is stale or missing (>25h)"
              description: "No fresh dump pushed to pushgateway in 25h. Trigger the Diagnose Backup → Restart Backup workflows."

  # ──────────────────────────────────────────────────────────────
  # PR #38 / PR #39 regression — *CronSilent alerts must NOT fire on
  # an ABSENT cron_fired metric (the post-deploy storm bug). This is
  # the test that would have caught the absent()-storm at PR time.
  # ──────────────────────────────────────────────────────────────
  - interval: 1m
    name: "BaseBackupCronSilent does NOT fire when cron_fired metric is absent (PR #38 storm regression)"
    input_series:
      # success metric present + fresh, but cron_fired NEVER defined.
      # Pre-PR-39 (with `or absent()`) this would FIRE — the bug.
      - series: 'sku_base_backup_last_success_timestamp_seconds{instance="sku-forecasting", job="base_backup"}'
        values: '0x130'
    alert_rule_test:
      - eval_time: 125m    # well past for: 1h
        alertname: BaseBackupCronSilent
        exp_alerts: []

  - interval: 1m
    name: "BackupDailyCronSilent does NOT fire when cron_fired metric is absent"
    input_series: []
    alert_rule_test:
      - eval_time: 60m
        alertname: BackupDailyCronSilent
        exp_alerts: []

  - interval: 1m
    name: "AuditLogRetentionCronSilent does NOT fire when cron_fired metric is absent"
    input_series: []
    alert_rule_test:
      - eval_time: 60m
        alertname: AuditLogRetentionCronSilent
        exp_alerts: []

  # ──────────────────────────────────────────────────────────────
  # *CronSilent DO fire when the metric exists but has gone stale.
  #
  # Synthetic-value note: promtool's `for:` state doesn't accumulate
  # across a COARSE evaluation interval (a 1h interval skips the
  # intermediate pending→firing transitions), so these use the fine
  # 1m interval. To avoid materialising 25h / 8d of 1-min samples we
  # set the gauge to a large NEGATIVE constant — a unix timestamp
  # "before 1970", which never occurs in prod but makes
  # `time() - metric` exceed the threshold from t=0. The alert is
  # then active immediately and `for:` fires it after its window
  # with only a few dozen samples. This exercises the threshold
  # ARITHMETIC + for: timing, which is what we're asserting.
  # ──────────────────────────────────────────────────────────────
  - interval: 1m
    name: "BackupDailyCronSilent fires when cron_fired is stale >25h"
    input_series:
      # -100000 < -(25*3600=-90000): time() - (-100000) > 90000 from t=0.
      - series: 'sku_backup_cron_fired_timestamp_seconds{instance="sku-forecasting", job="backup_cron_fired"}'
        values: '-100000x40'
    alert_rule_test:
      - eval_time: 35m     # active from t=0, > for:30m
        alertname: BackupDailyCronSilent
        exp_alerts:
          - exp_labels:
              severity: warning
              team: forecasting
              instance: sku-forecasting
              job: backup_cron_fired
            exp_annotations:
              summary: "Daily backup cron hasn't fired in >25h"
              description: "The 02:10 UTC cron line for backup.sh inside docker-backup-1 has not pushed a `sku_backup_cron_fired_timestamp_seconds` in 25+ hours. Pairs with `BackupStale` which catches the script-success side; this one catches the cron-infrastructure side. Same triage: crontab + crond + container logs."

  - interval: 1m
    name: "BaseBackupCronSilent fires when cron_fired is stale >8d"
    input_series:
      # -700000 < -(8*86400=-691200): time() - (-700000) > 691200 from t=0.
      - series: 'sku_base_backup_cron_fired_timestamp_seconds{instance="sku-forecasting", job="base_backup_cron_fired"}'
        values: '-700000x70'
    alert_rule_test:
      - eval_time: 65m     # active from t=0, > for:1h
        alertname: BaseBackupCronSilent
        exp_alerts:
          - exp_labels:
              severity: warning
              team: forecasting
              instance: sku-forecasting
              job: base_backup_cron_fired
            exp_annotations:
              summary: "Weekly base_backup cron hasn't fired in >8d"
              description: "The Sunday 03:30 UTC cron line for base_backup.sh inside docker-backup-1 has not pushed a `sku_base_backup_cron_fired_timestamp_seconds` in 8+ days. If `BaseBackupStale` is GREEN this means an operator has been running base_backup.sh manually to recover, which masks the cron drift. Investigate: `docker exec docker-backup-1 crontab -l` (line present?), `docker exec docker-backup-1 ps -e | grep crond` (daemon alive?), `docker logs docker-backup-1 --since 24h`."

  # ──────────────────────────────────────────────────────────────
  # AuditLogRetentionStale — success-side with absent() defence.
  # Fires when the metric is absent (the D1 "never ran" state).
  # ──────────────────────────────────────────────────────────────
  - interval: 1h
    name: "AuditLogRetentionStale fires when retention success metric is absent"
    input_series: []
    alert_rule_test:
      - eval_time: 2h
        alertname: AuditLogRetentionStale
        exp_alerts:
          - exp_labels:
              severity: warning
              team: forecasting
            exp_annotations:
              summary: "audit_log retention script hasn't pushed success in >48h"
              description: "`scripts/audit_log_retention.sh` runs daily 04:00 UTC from the backup container, calling postgres function `prune_audit_log()` and pushing a success timestamp. Stale metric means either (a) the cron didn't fire — see `BackupContainerCronSilent` or `AuditLogRetentionCronSilent` for that orthogonal signal — or (b) the script ran but failed (likely DB connectivity / permissions). Check `docker exec docker-backup-1 tail /var/log/audit_log_retention.log`."

  - interval: 1h
    name: "AuditLogRetentionStale does NOT fire when success metric is fresh"
    input_series:
      # value = eval-relative fresh: at eval 2h, a value of 3600 means
      # "succeeded 1h ago" (time()=7200, 7200-3600=3600s=1h < 48h).
      - series: 'sku_audit_log_retention_last_success_timestamp_seconds{instance="sku-forecasting", job="audit_log_retention"}'
        values: '3600x5'
    alert_rule_test:
      - eval_time: 2h
        alertname: AuditLogRetentionStale
        exp_alerts: []

  # ──────────────────────────────────────────────────────────────
  # A3 — OtpBruteForce uses audit_log_event_failure_total (the Counter
  # added to src/audit/log.py in PR #36). Regression for the phantom
  # metric that left this security alert silent since R2-8.
  # ──────────────────────────────────────────────────────────────
  - interval: 1m
    name: "OtpBruteForce fires when one email exceeds 10 failed logins / 10m"
    input_series:
      # Counter rising 0→30 over 15 min → increase[10m] ≈ 20 > 10.
      - series: 'audit_log_event_failure_total{event_type="login", actor_email="attacker@example.test"}'
        values: '0+2x15'
    alert_rule_test:
      - eval_time: 13m     # >10m window populated + for:2m
        alertname: OtpBruteForce
        exp_alerts:
          - exp_labels:
              severity: warning
              team: forecasting
              actor_email: attacker@example.test
            exp_annotations:
              summary: "OTP brute force against attacker@example.test (>10 fails / 10m)"
              description: "The audit-log lockout will block this email automatically. Verify in audit_log: `SELECT * FROM audit_log WHERE actor_email='attacker@example.test' AND ts > NOW() - INTERVAL '10 minutes' ORDER BY ts DESC;`"

  - interval: 1m
    name: "OtpBruteForce does NOT fire for a slow trickle of failures (<10 / 10m)"
    input_series:
      # Counter rising 0→7 over 15 min → increase[10m] ≈ 5 < 10.
      - series: 'audit_log_event_failure_total{event_type="login", actor_email="typo@example.test"}'
        values: '0+0.5x15'
    alert_rule_test:
      - eval_time: 13m
        alertname: OtpBruteForce
        exp_alerts: []

  # ════════════════════════════════════════════════════════════════
  # FULL COVERAGE BACKFILL (R10 G1, 2026-05-28) — behavioural test for
  # every remaining alert so the coverage gate
  # (tests/lint/test_alert_test_coverage.py) reaches 100%. One fires-
  # case per alert minimum; no-fire cases added where they guard a
  # real boundary. $value-templated annotations were resolved by
  # running promtool and pasting the rendered output verbatim.
  # ════════════════════════════════════════════════════════════════

  # ── api-availability ──────────────────────────────────────────
  - interval: 1m
    name: "ApiDown fires when up=0"
    input_series:
      - series: 'up{job="sku-forecasting-api"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: ApiDown
        exp_alerts:
          - exp_labels: {job: "sku-forecasting-api", severity: critical, team: forecasting}
            exp_annotations:
              summary: "API /metrics is unreachable for 2m"
              description: "No successful scrape of api:8000 since 0. Check container health, /readyz."

  - interval: 1m
    name: "ApiDown does NOT fire when up=1"
    input_series:
      - series: 'up{job="sku-forecasting-api"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: ApiDown
        exp_alerts: []

  - interval: 1m
    name: "ApiHighErrorRate fires at 10% error ratio"
    input_series:
      - series: 'forecast_requests_total{status="error"}'
        values: '0+1x15'
      - series: 'forecast_requests_total{status="ok"}'
        values: '0+9x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: ApiHighErrorRate
        exp_alerts:
          - exp_labels: {severity: warning, team: forecasting}
            exp_annotations:
              summary: "API error rate >5% for 10m"
              description: "Current error ratio is 10%."

  - interval: 1m
    name: "ApiPredictSlow fires when p95 latency >2s"
    input_series:
      - series: 'forecast_latency_seconds_bucket{le="1"}'
        values: '0x30'
      - series: 'forecast_latency_seconds_bucket{le="2"}'
        values: '0x30'
      - series: 'forecast_latency_seconds_bucket{le="5"}'
        values: '0+100x30'
      - series: 'forecast_latency_seconds_bucket{le="+Inf"}'
        values: '0+100x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ApiPredictSlow
        exp_alerts:
          - exp_labels: {severity: warning, team: forecasting}
            exp_annotations:
              summary: "Predict p95 latency >2s (15m)"
              description: "p95 = 4.85s. Check model load / feature build path."

  - interval: 1m
    name: "FallbackModelInUse fires when fallback rate exceeds 5/min"
    input_series:
      - series: 'fallback_model_used_total'
        values: '0+6x25'
    alert_rule_test:
      - eval_time: 17m       # rate active ~5m, + for:10m
        alertname: FallbackModelInUse
        exp_alerts:
          - exp_labels: {severity: warning, team: forecasting}
            exp_annotations:
              summary: "Fallback model active for 10m"
              description: "Clients: check primary model load logs."

  # ── workers ───────────────────────────────────────────────────
  - interval: 1m
    name: "RqWorkerSilent fires when rq_workers metric is absent (exporter down)"
    input_series: []
    alert_rule_test:
      - eval_time: 35m
        alertname: RqWorkerSilent
        exp_alerts:
          - exp_labels: {severity: warning, team: forecasting}
            exp_annotations:
              summary: "RQ workers not consuming queued jobs (or rq-exporter down)"
              description: "Either rq-exporter is silent (DNS-cache-stale after redis recreate? see 2026-05-17 incident; restart docker-rq-exporter-1) OR queued jobs are not being picked up. Inspect: `docker logs docker-worker-1 --tail 50`. If workers running but idle while queue non-empty, restart: `docker compose restart worker scan-worker process-worker`."

  # ── database ──────────────────────────────────────────────────
  - interval: 1m
    name: "PostgresDown fires when up=0"
    input_series:
      - series: 'up{job="postgres"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgresDown
        exp_alerts:
          - exp_labels: {job: "postgres", severity: critical, team: forecasting}
            exp_annotations:
              summary: "Postgres exporter unreachable"

  - interval: 1m
    name: "PostgresConnectionsHigh fires at 90% of max_connections"
    input_series:
      - series: 'pg_stat_activity_count'
        values: '90x15'
      - series: 'pg_settings_max_connections'
        values: '100x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: PostgresConnectionsHigh
        exp_alerts:
          - exp_labels: {severity: warning, team: forecasting}
            exp_annotations:
              summary: "Postgres connections >80% of max_connections"

  # ── slo ───────────────────────────────────────────────────────
  - interval: 1m
    name: "SloErrorBudgetFastBurn fires at 2% error over 1h+5m"
    input_series:
      - series: 'forecast_requests_total{status="error"}'
        values: '0+2x70'
      - series: 'forecast_requests_total{status="ok"}'
        values: '0+98x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: SloErrorBudgetFastBurn
        exp_alerts:
          - exp_labels: {severity: critical, team: forecasting}
            exp_annotations:
              summary: "SLO error budget burning fast (14.4× — 2-day burn-down)"
              description: "Forecast endpoint error rate >1.44% sustained for 1h AND 5m windows. At this rate the 30-day error budget is gone in 2 days. Investigate immediately."

  - interval: 1m
    name: "SloErrorBudgetSlowBurn fires at 2% error over 6h+30m"
    input_series:
      - series: 'forecast_requests_total{status="error"}'
        values: '0+2x380'
      - series: 'forecast_requests_total{status="ok"}'
        values: '0+98x380'
    alert_rule_test:
      - eval_time: 375m
        alertname: SloErrorBudgetSlowBurn
        exp_alerts:
          - exp_labels: {severity: warning, team: forecasting}
            exp_annotations:
              summary: "SLO error budget burning slowly (6× — 5-day burn-down)"
              description: "Forecast endpoint error rate >0.6% sustained for 6h AND 30m windows. At this rate the 30-day error budget is gone in 5 days. Diagnose during business hours."

  # ── backup (stale variants — absent() defence) ────────────────
  - interval: 1m
    name: "BaseBackupStale fires when success metric absent (>9d / never)"
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: BaseBackupStale
        exp_alerts:
          - exp_labels: {severity: critical, team: forecasting}
            exp_annotations:
              summary: "Postgres weekly base backup stale or missing (>9d)"
              description: "pg_basebackup hasn't pushed a success ts in 9 days. PITR window will start shrinking once WAL retention (14d) catches up. Check backup container cron + S3 base/ prefix."

  - interval: 1m
    name: "BaseBackupWarning fires when success metric absent (>8d / never)"
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: BaseBackupWarning
        exp_alerts:
          - exp_labels: {severity: warning, team: forecasting}
            exp_annotations:
              summary: "Postgres weekly base backup is overdue (>8d)"
              description: "Backup hasn't been pushed in 8 days — one day short of the 9d critical threshold. Inspect backup container logs while there's still a healthy PITR window. Suppressed by BaseBackupStale once it fires (see alertmanager inhibit rules)."

  - interval: 1m
    name: "WalArchiveFailing fires when archiver failed_count metric absent (exporter silent)"
    input_series: []
    alert_rule_test:
      - eval_time: 7m
        alertname: WalArchiveFailing
        exp_alerts:
          # absent() propagates the equality-matcher label job="postgres".
          - exp_labels: {job: "postgres", severity: critical, team: forecasting}
            exp_annotations:
              summary: "Postgres WAL archive_command failing or exporter silent"
              description: "wal_archive.sh is failing to push to S3 (or postgres-exporter is down). WAL accumulates in pg_wal/ on the postgres data volume until the host disk fills. Inspect: `docker logs docker-postgres-1 --tail 50 | grep archive`; `docker exec docker-postgres-1 psql -U sku -c 'SELECT * FROM pg_stat_archiver'`. Likely causes: S3 outage, Beget key rotation, Lockbox SA expiry, or backup bucket policy change."

  - interval: 1m
    name: "WalArchiveFailing fires when failed_count increases"
    input_series:
      - series: 'pg_stat_archiver_failed_count{job="postgres"}'
        values: '0+1x10'   # one failure per minute → increase[5m] > 0
    alert_rule_test:
      - eval_time: 7m
        alertname: WalArchiveFailing
        exp_alerts:
          - exp_labels: {job: "postgres", severity: critical, team: forecasting}
            exp_annotations:
              summary: "Postgres WAL archive_command failing or exporter silent"
              description: "wal_archive.sh is failing to push to S3 (or postgres-exporter is down). WAL accumulates in pg_wal/ on the postgres data volume until the host disk fills. Inspect: `docker logs docker-postgres-1 --tail 50 | grep archive`; `docker exec docker-postgres-1 psql -U sku -c 'SELECT * FROM pg_stat_archiver'`. Likely causes: S3 outage, Beget key rotation, Lockbox SA expiry, or backup bucket policy change."

  - interval: 1m
    name: "WalArchiveStale fires when archiver age metric absent"
    input_series: []
    alert_rule_test:
      - eval_time: 17m
        alertname: WalArchiveStale
        exp_alerts:
          # absent() propagates the equality-matcher label job="postgres".
          - exp_labels: {job: "postgres", severity: warning, team: forecasting}
            exp_annotations:
              summary: "Postgres WAL archive idle >30 min while DB has WRITE activity"
              description: "No new WAL segment archived in 30 min AND `sku_forecasting` saw >10 row writes (inserted+updated+deleted) in the same window — archive_command may be stuck retrying. Inspect: `docker exec docker-postgres-1 psql -U sku -d postgres -c 'SELECT * FROM pg_stat_archiver'`. If failed_count > 0, switch to WalArchiveFailing for the canonical diagnosis. If failed_count = 0 but archive is genuinely stale on a write-active DB, suspect S3 outage / Beget key rotation / Lockbox SA expiry. Quiet-DB AND read-only-DB false positives can no longer fire here (R5-17 enterprise fix iteration 2, 2026-05-18)."

  # ── container-lifecycle ───────────────────────────────────────
  - interval: 1m
    name: "ContainerRestartLoop fires when start_time changes >5x / 15m"
    input_series:
      - series: 'container_start_time_seconds{name="docker-mlflow-1"}'
        values: '1+1x25'   # value changes every minute → changes[15m]=15 > 5
    alert_rule_test:
      - eval_time: 21m
        alertname: ContainerRestartLoop
        exp_alerts:
          - exp_labels: {name: "docker-mlflow-1", severity: critical, team: forecasting}
            exp_annotations:
              summary: "Container docker-mlflow-1 restart-looping (>5 starts/15m)"
              description: "Container is restarting too fast for the unless-stopped policy to be normal recovery. Common causes: OOM (check mem_limit + actual usage), bad config, dependency unhealthy. ExitCode=0 + Docker restart-policy hides this from `docker inspect` — only metric-side detection works."

  - interval: 1m
    name: "ContainerOOMKilled fires when oom_events increases"
    input_series:
      - series: 'container_oom_events_total{name="docker-mlflow-1"}'
        values: '0+1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: ContainerOOMKilled
        exp_alerts:
          - exp_labels: {name: "docker-mlflow-1", severity: warning, team: forecasting}
            exp_annotations:
              summary: "Container docker-mlflow-1 OOM-killed"
              description: "Out-of-memory kill in last 10m. Bump mem_limit or investigate leak."

  # ── monitoring-pipeline ───────────────────────────────────────
  - interval: 1m
    name: "PushgatewayDown fires when up=0"
    input_series:
      - series: 'up{job="pushgateway"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 6m
        alertname: PushgatewayDown
        exp_alerts:
          - exp_labels: {job: "pushgateway", severity: critical, team: forecasting}
            exp_annotations:
              summary: "Pushgateway is down — batch metrics blind"
              description: "BackupStale / BaseBackupStale / future push-metrics depend on this. Restart docker-pushgateway-1 and verify it accepts pushes."

  - interval: 1m
    name: "PromtailDown fires when up=0"
    input_series:
      - series: 'up{job="promtail"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 6m
        alertname: PromtailDown
        exp_alerts:
          - exp_labels: {job: "promtail", severity: warning, team: forecasting}
            exp_annotations:
              summary: "Promtail :9080 unreachable for 5m"
              description: "All container logs flowing to Loki stop. Restart docker-promtail-1; positions persist via volume so no replay flood."

  - interval: 1m
    name: "LokiPushFailure fires when discarded bytes rate >0"
    input_series:
      - series: 'loki_discarded_bytes_total{reason="rate_limited"}'
        values: '0+1000x15'   # 1000 B/min discarded
    alert_rule_test:
      - eval_time: 12m
        alertname: LokiPushFailure
        exp_alerts:
          - exp_labels: {reason: "rate_limited", severity: warning, team: forecasting}
            exp_annotations:
              summary: "Loki dropping log bytes for 10m"
              description: "16.67B/s being rejected (reason=rate_limited). Check promtail positions persistence (#198 fix) and loki ingester health."

  # ── certificates ──────────────────────────────────────────────
  - interval: 1m
    name: "LeCertExpiringSoon fires when cert <14d out"
    input_series:
      # ssl_cert_not_after = unix ts. value 1000000 ≈ 11.57d from epoch;
      # (1000000 - time())/86400 < 14 from t=0.
      - series: 'ssl_cert_not_after{job="ssl-https", instance="https://api.testcore.ru"}'
        values: '1000000x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: LeCertExpiringSoon
        exp_alerts:
          - exp_labels: {job: "ssl-https", instance: "https://api.testcore.ru", severity: warning, team: forecasting}
            exp_annotations:
              summary: "LE cert https://api.testcore.ru expires in <14d (11.5d)"
              description: "Certbot should auto-renew at 30d remaining. If we're at 14d, cron isn't firing or renewal is failing. Inspect certbot container logs."

  - interval: 1m
    name: "LeCertExpiringCritical fires when cert <3d out"
    input_series:
      # value 100000 ≈ 1.16d from epoch; (100000 - time())/86400 < 3 from t=0.
      - series: 'ssl_cert_not_after{job="ssl-https", instance="https://api.testcore.ru"}'
        values: '100000x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LeCertExpiringCritical
        exp_alerts:
          - exp_labels: {job: "ssl-https", instance: "https://api.testcore.ru", severity: critical, team: forecasting}
            exp_annotations:
              summary: "LE cert https://api.testcore.ru expires in <3 DAYS"
              description: "User-facing TLS will break. Run certbot manually now and check renewal cron."

  # ── host-resources ────────────────────────────────────────────
  - interval: 1m
    name: "HostDiskFillingUp fires at 90% disk usage"
    input_series:
      - series: 'node_filesystem_avail_bytes{fstype="ext4", mountpoint="/", instance="api.testcore.ru"}'
        values: '10x20'
      - series: 'node_filesystem_size_bytes{fstype="ext4", mountpoint="/", instance="api.testcore.ru"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: HostDiskFillingUp
        exp_alerts:
          - exp_labels: {fstype: "ext4", mountpoint: "/", instance: "api.testcore.ru", severity: warning, team: forecasting}
            exp_annotations:
              summary: "Host disk usage >80% on api.testcore.ru"
              description: "Filesystem at / is 90.0% full. Likely cause: pg_wal backup if S3 archive_command failing, or container logs / docker images bloat. Run `docker system df` and check S3 archive health."

  - interval: 1m
    name: "HostDiskCritical fires at 95% disk usage"
    input_series:
      - series: 'node_filesystem_avail_bytes{fstype="ext4", mountpoint="/", instance="api.testcore.ru"}'
        values: '5x10'
      - series: 'node_filesystem_size_bytes{fstype="ext4", mountpoint="/", instance="api.testcore.ru"}'
        values: '100x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: HostDiskCritical
        exp_alerts:
          - exp_labels: {fstype: "ext4", mountpoint: "/", instance: "api.testcore.ru", severity: critical, team: forecasting}
            exp_annotations:
              summary: "Host disk usage >92% on api.testcore.ru — postgres at risk"
              description: "Postgres will stop accepting writes when the disk fills. Evacuate large files NOW. 95.0% used."

  - interval: 1m
    name: "HostMemoryHigh fires at 95% memory usage"
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="api.testcore.ru"}'
        values: '5x35'
      - series: 'node_memory_MemTotal_bytes{instance="api.testcore.ru"}'
        values: '100x35'
    alert_rule_test:
      - eval_time: 32m
        alertname: HostMemoryHigh
        exp_alerts:
          - exp_labels: {instance: "api.testcore.ru", severity: warning, team: forecasting}
            exp_annotations:
              summary: "Host memory >90% used for 30m on api.testcore.ru"
              description: "95.0% used. Check for memory-leak suspects (mlflow has had crash loops; api / worker can spike during training)."

  # ════════════════════════════════════════════════════════════════
  # PROD-ONLY rules (alerts.production.yml) — replication + mirror.
  # ════════════════════════════════════════════════════════════════
  - interval: 1m
    name: "PgReplicationCertExpiringSoon fires when replica cert <30d out"
    input_series:
      - series: 'ssl_cert_not_after{job="ssl-pg-tls", instance="postgres:5432"}'
        values: '1000000x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: PgReplicationCertExpiringSoon
        exp_alerts:
          - exp_labels: {job: "ssl-pg-tls", instance: "postgres:5432", severity: warning, team: forecasting}
            exp_annotations:
              summary: "PG replication TLS cert expires in <30 days (12 days left)"
              description: "Self-signed cert at /srv/backend/secrets/pg-ssl/server.crt expires soon. Rotate via the Setup PG Replication (Primary) workflow with force_regen_cert=true; runbook in deploy/REPLICATION.md → 'SSL cert rotation'."

  - interval: 1m
    name: "PgReplicationCertExpired fires when replica cert already expired"
    input_series:
      - series: 'ssl_cert_not_after{job="ssl-pg-tls", instance="postgres:5432"}'
        values: '0x10'   # not_after=epoch → already expired
    alert_rule_test:
      - eval_time: 7m
        alertname: PgReplicationCertExpired
        exp_alerts:
          - exp_labels: {job: "ssl-pg-tls", instance: "postgres:5432", severity: critical, team: forecasting}
            exp_annotations:
              summary: "PG replication TLS cert HAS EXPIRED — replica streaming will break on next reconnect"
              description: "Rotate immediately. Runbook in deploy/REPLICATION.md."

  - interval: 1m
    name: "PgReplicaLagHigh fires when lag >60s"
    input_series:
      - series: 'pg_replication_lag_seconds{job="postgres-replica"}'
        values: '120x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: PgReplicaLagHigh
        exp_alerts:
          - exp_labels: {job: "postgres-replica", severity: warning, team: forecasting}
            exp_annotations:
              summary: "Replica is 120s behind primary (or exporter silent)"
              description: "Check pg_stat_wal_receiver on replica + pg_stat_replication on primary. If `absent`, the replica-side postgres-exporter is missing the custom queries.yaml mount — see docker/postgres-exporter-queries.yaml. Otherwise: network or WAL apply bottleneck."

  - interval: 1m
    name: "PgReplicaLagHigh fires when lag metric absent (exporter missing queries.yaml)"
    input_series: []
    alert_rule_test:
      - eval_time: 12m
        alertname: PgReplicaLagHigh
        exp_alerts:
          # absent() propagates the equality-matcher label job="postgres-replica".
          - exp_labels: {job: "postgres-replica", severity: warning, team: forecasting}
            exp_annotations:
              summary: "Replica is 1s behind primary (or exporter silent)"
              description: "Check pg_stat_wal_receiver on replica + pg_stat_replication on primary. If `absent`, the replica-side postgres-exporter is missing the custom queries.yaml mount — see docker/postgres-exporter-queries.yaml. Otherwise: network or WAL apply bottleneck."

  - interval: 1m
    name: "PgReplicaWalReceiverDown fires when pg_up=0"
    input_series:
      - series: 'pg_up{job="postgres-replica"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: PgReplicaWalReceiverDown
        exp_alerts:
          - exp_labels: {job: "postgres-replica", severity: critical, team: forecasting}
            exp_annotations:
              summary: "Replica's postgres-exporter unreachable for 2m"
              description: "Either replica VPS is down, replica-firewall sidecar dropped its rules, or the exporter container died. SSH to db-replica.testcore.ru and inspect."

  - interval: 1m
    name: "PgReplicaScrapeFailed fires when up=0"
    input_series:
      - series: 'up{job="postgres-replica"}'
        values: '0x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: PgReplicaScrapeFailed
        exp_alerts:
          - exp_labels: {job: "postgres-replica", severity: critical, team: forecasting}
            exp_annotations:
              summary: "Prometheus can't scrape postgres-replica for 3m"
              description: "Likely cause: REPLICA_EXPORTER_HOST env on primary doesn't match the current replica IP (rotate via prod .env + recreate prometheus), OR replica firewall dropped our IP, OR the replica VPS is down."

  - interval: 1m
    name: "BackupMirrorStale fires when mirror metric absent"
    input_series: []
    alert_rule_test:
      - eval_time: 35m
        alertname: BackupMirrorStale
        exp_alerts:
          - exp_labels: {severity: warning, team: forecasting}
            exp_annotations:
              summary: "Off-region backup mirror is stale (>49h)"
              description: "Selectel `uz-2` backup mirror hasn't received a fresh dump in 49h. Primary Beget backup is unaffected (data is safe); this is a DR-posture degradation. Inspect: `docker exec docker-backup-1 sh -c 'mc alias set mir <S3_MIRROR_ENDPOINT_URL> ... && mc ls mir/<S3_MIRROR_BUCKET>/'`. Likely causes: Selectel creds rotated, bucket permission changed, or off-region network outage."

  - interval: 1m
    name: "BaseBackupMirrorStale fires when base mirror metric absent"
    input_series: []
    alert_rule_test:
      - eval_time: 125m
        alertname: BaseBackupMirrorStale
        exp_alerts:
          - exp_labels: {severity: warning, team: forecasting}
            exp_annotations:
              summary: "Off-region weekly base backup mirror is stale (>16d)"
              description: "Selectel `uz-2` weekly base_backup mirror hasn't received a fresh push in 16d (2 missed cycles). Primary Beget base_backup is unaffected. PITR is still functional from the primary; this is a DR-posture degradation only."
